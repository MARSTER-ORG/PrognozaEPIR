name: One-shot TAF issue-time observation anchor fix

on:
  push:
    branches:
      - fix/taf-issue-time-observation-anchor-2026-09-14

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply issue-time anchor patch
        run: python3 scripts/apply_taf_issue_anchor_fix.py
      - name: Validate
        run: |
          node --check taf-app-v2.js
          node --check taf-engine-v2.js
          node tests/taf-engine-v2.test.js
      - name: Remove migration artifact
        run: rm scripts/apply_taf_issue_anchor_fix.py
      - name: Commit source result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: kotwicz TAF tylko obserwacją dostępną przy emisji"
          git push origin HEAD:${GITHUB_REF_NAME}
