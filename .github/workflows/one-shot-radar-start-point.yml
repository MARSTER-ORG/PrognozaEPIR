name: One-shot radar start point

on:
  push:
    paths:
      - '.github/workflows/one-shot-radar-start-point.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use EPIR as initial radar analysis point and map center
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('radar.html')
          s=p.read_text(encoding='utf-8')
          old="map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([52.05,19.2],6);"
          new="map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([DEFAULT.lat,DEFAULT.lon],8);"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Expected initMap setView pattern not found')
          s=s.replace("$('placeLabel').textContent=(nearDefault?'Inowrocław':'Punkt własny')+' · '+point.lat.toFixed(4)+', '+point.lon.toFixed(4);",
                      "$('placeLabel').textContent=(nearDefault?DEFAULT.name:'Punkt własny')+' · '+point.lat.toFixed(4)+', '+point.lon.toFixed(4);")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate start point wiring
        run: |
          grep -F "const DEFAULT={lat:52.8275,lon:18.3175,name:'EPIR'};" radar.html
          grep -F "setView([DEFAULT.lat,DEFAULT.lon],8)" radar.html
          grep -F "nearDefault?DEFAULT.name:'Punkt własny'" radar.html
          grep -F "let point={...DEFAULT}" radar.html
      - name: Commit patch and remove one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-radar-start-point.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.html .github/workflows/one-shot-radar-start-point.yml
          git commit -m "Use EPIR as radar start analysis point"
          git push
