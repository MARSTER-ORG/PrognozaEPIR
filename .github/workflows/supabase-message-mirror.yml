name: Mirror Supabase messages to GitHub

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Optional UTC calendar year to backfill (for example 2025)'
        required: false
        type: string
      days:
        description: 'Incremental UTC days when year is empty'
        required: false
        default: '3'
        type: string
  push:
    branches:
      - fix/supabase-message-mirror-2025
    paths:
      - '.github/workflows/supabase-message-mirror.yml'
      - 'scripts/sync_supabase_messages_to_git.py'
      - 'scripts/import_historical_synop_teacher.py'
      - 'tests/test_sync_supabase_messages_to_git.py'
      - 'tests/test_import_historical_synop_teacher.py'

permissions:
  contents: write

concurrency:
  group: supabase-message-mirror-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify mirror code
        run: |
          python3 -m py_compile scripts/sync_supabase_messages_to_git.py scripts/import_historical_synop_teacher.py scripts/message_archive.py scripts/collect_epir_observations.py
          python3 tests/test_sync_supabase_messages_to_git.py
          python3 tests/test_import_historical_synop_teacher.py

      - name: Import historical SYNOP teacher
        if: github.event_name == 'push' && github.ref_name == 'fix/supabase-message-mirror-2025'
        run: |
          set -euo pipefail
          python3 scripts/import_historical_synop_teacher.py | tee /tmp/historical-synop-import.json

      - name: Mirror canonical messages
        id: mirror
        env:
          SUPABASE_PROJECT_REF: qozgntzeormujmqzkkmd
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'push' && '${{ github.ref_name }}' == 'fix/supabase-message-mirror-2025' ]]; then
            echo 'Bootstrap validation: mirroring calendar year 2025.'
            python3 scripts/sync_supabase_messages_to_git.py --year 2025 | tee /tmp/supabase-message-mirror.json
          elif [[ '${{ github.event_name }}' == 'workflow_dispatch' && -n '${{ inputs.year }}' ]]; then
            python3 scripts/sync_supabase_messages_to_git.py --year '${{ inputs.year }}' | tee /tmp/supabase-message-mirror.json
          elif [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            python3 scripts/sync_supabase_messages_to_git.py --days '${{ inputs.days }}' | tee /tmp/supabase-message-mirror.json
          else
            python3 scripts/sync_supabase_messages_to_git.py --days 3 | tee /tmp/supabase-message-mirror.json
          fi

      - name: Validate canonical archive
        run: |
          python3 scripts/message_archive.py --validate-only
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/supabase-message-mirror.json')
          report=json.loads(p.read_text(encoding='utf-8'))
          if report['fetched'] != report['normalized']:
              raise SystemExit(f"mirror normalized {report['normalized']} of {report['fetched']} fetched rows")
          if report['checked_records'] < report['normalized']:
              raise SystemExit('archive validation checked fewer rows than this mirror normalized')
          print('Mirror validation OK:', report['fetched_by_type'])

          h=Path('/tmp/historical-synop-import.json')
          if h.exists():
              hist=json.loads(h.read_text(encoding='utf-8'))
              if hist['source_rows'] != hist['normalized']:
                  raise SystemExit(f"historical SYNOP normalized {hist['normalized']} of {hist['source_rows']} source rows")
              if sorted(hist['rows_by_year']) != ['2020','2021','2022','2023','2024']:
                  raise SystemExit(f"historical SYNOP year coverage invalid: {hist['rows_by_year']}")
              print('Historical SYNOP validation OK:', hist['rows_by_year'])
          PY

      - name: Commit mirrored archive
        run: |
          if git diff --quiet -- data/messages; then
            echo 'Canonical message archive unchanged.'
            exit 0
          fi
          git config user.name 'prognozaepir-message-mirror'
          git config user.email 'message-mirror@prognozaepir.invalid'
          git add data/messages
          git commit -m 'archive: mirror Supabase and historical SYNOP into canonical history'
          for n in 1 2 3 4 5; do
            if git pull --rebase origin '${{ github.ref_name }}' && git push origin HEAD:'${{ github.ref_name }}'; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((n*2))
          done
          echo 'Unable to publish canonical message mirror after retries.' >&2
          exit 1
