name: Verify central METAR SPECI TAF SYNOP archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/messages/**'
      - 'message-archive-client.js'
      - 'scripts/message_archive.py'
      - 'scripts/check_archive_boundaries.py'
      - '.github/workflows/message-archive.yml'

permissions:
  contents: read

concurrency:
  group: prognozaepir-central-archive-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify consumer and archive syntax
        run: |
          node --check message-archive-client.js
          python3 -m py_compile scripts/message_archive.py scripts/check_archive_boundaries.py

      - name: Validate mirrored Railway archive
        run: |
          test -s data/messages/latest.json
          test -s data/messages/recent.json
          test -s data/messages/taf-neighbors.json
          python3 scripts/message_archive.py --validate-only
          python3 scripts/check_archive_boundaries.py

      - name: Confirm acquisition boundary
        run: |
          echo 'Railway central-ingestor is the only automatic bulletin acquisition engine.'
          echo 'This workflow validates GitHub archive content only and never contacts bulletin providers.'
