name: TAF core hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taf-core-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch TAF core generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('taf.html')
          s=p.read_text(encoding='utf-8')
          orig=s

          # Freshest METAR/SPECI from recent + latest; SYNOP deliberately excluded.
          marker="async function loadObs(){"
          helpers=r'''function tafMsgTime(x){if(!x)return NaN;for(const k of ['obs_time','message_time','time','issue_time','timestamp']){let t=Date.parse(x[k]||'');if(fin(t))return t}let r=String(x.raw||x.canonical_raw||''),m=r.match(/\b(\d{6})Z\b/);return m?monthTime(m[1],Date.now(),true):NaN}function tafRecentAviation(r){let o=[];for(const k of ['metar','speci','aviation'])if(Array.isArray(r?.[k]))o.push(...r[k]);return o.filter(x=>/\bEPIR\b/.test(String(x?.raw||x?.canonical_raw||'')))}function tafNewestAviation(a){return a.filter(Boolean).sort((x,y)=>(tafMsgTime(y)||0)-(tafMsgTime(x)||0))[0]||null}'''
          if helpers not in s:
              if marker not in s: raise SystemExit('loadObs marker not found')
              s=s.replace(marker,helpers+marker,1)

          # Do not request/use SYNOP in TAF analysis.
          s=s.replace("A.getLatest('SYNOP','12342',true)","Promise.resolve(null)")
          old="let m=a[2].status==='fulfilled'?a[2].value:null,s=a[3].status==='fulfilled'?a[3].value:null,t=a[4].status==='fulfilled'?a[4].value:null;m=m||obs?.aviation||obs?.metar;s=s||obs?.synop;t=t||obs?.taf_by_station?.EPIR||obs?.taf;"
          new="let ro=tafRecentAviation(recent),m=tafNewestAviation([a[2].status==='fulfilled'?a[2].value:null,obs?.aviation,obs?.metar,...ro]),s=null,t=a[4].status==='fulfilled'?a[4].value:null;m=m||obs?.aviation||obs?.metar;obs.synop=null;t=t||obs?.taf_by_station?.EPIR||obs?.taf;"
          if old in s:
              s=s.replace(old,new,1)
          elif 'tafNewestAviation' not in s[s.find(marker):s.find(marker)+2500]:
              raise SystemExit('loadObs selection pattern not found')
          s=s.replace("$('synop').textContent=s?.raw||s?.canonical_raw||'Brak SYNOP'","$('synop').textContent='Wyłączony z analizy TAF'")
          s=s.replace("$('synopMeta').textContent=s?`${s.source||s.sources?.[0]?.name||'ARCHIWUM'} · ${fu(Date.parse(s.obs_time||s.message_time||s.time||obs?.updated_at||Date.now()))}`:''","$('synopMeta').textContent='SYNOP tymczasowo nie jest używany w analizie.'")

          # Core TAF rules: VRB02 from the final 12 h speeds and observational CAVOK anchor.
          bmark="function build(){"
          core=r'''function tafVrb02Plan(){let a=rows.map(z=>evenWindKt(kt(z.WS)||0)).filter(fin);if(a.length<8)return null;let low=a.filter(v=>v<=2).length,share=low/a.length,max=Math.max(...a);return share>=.75&&max<=10?{count:low,total:a.length,share,max}:null}function tafObsClearEvidence(start){let a=tafRecentAviation(recent).map(x=>({x,t:tafMsgTime(x)})).filter(q=>fin(q.t)&&q.t<=start&&q.t>=start-6*36e5).sort((x,y)=>y.t-x.t).slice(0,8);if(a.length<3)return null;let c=a.filter(q=>{let r=String(q.x.raw||q.x.canonical_raw||'');return /\bCAVOK\b/.test(r)||(/\b9999\b/.test(r)&&/\bNSC\b/.test(r)&&!/(FEW|SCT|BKN|OVC)\d{3}/.test(r))}),share=c.length/a.length,age=(start-a[0].t)/36e5;return c.length>=3&&share>=.75&&age<=4?{count:c.length,total:a.length,share,age}:null}function tafWeakFewStart(){let a=rows.slice(0,3);if(a.length<2)return false,weak=0,strong=0;let weak=0,strong=0;for(const z of a){let cs=String(cg(z)||'').split(/\s+/).map(t=>{let m=t.match(/^(FEW|SCT|BKN|OVC)(\d{3})(CB|TCU)?$/);return m?{a:m[1],ft:+m[2]*100,type:m[3]||''}:null}).filter(Boolean).filter(c=>!c.type&&c.ft<5000);if(cs.some(c=>c.a==='SCT'||c.a==='BKN'||c.a==='OVC'))strong++;if(cs.some(c=>c.a==='FEW'&&c.ft>=2800))weak++}return weak>=2&&strong===0}function tafBaseState(z,c){let text=state(z),vrb=tafVrb02Plan(),clear=tafObsClearEvidence(c.start);if(vrb)text=text.replace(/\b(?:VRB|\d{3})\d{2,3}(?:G(?:P99|\d{2,3}))?KT\b/,'VRB02KT');if(clear&&tafWeakFewStart()){let t=text.split(/\s+/),removed=false;t=t.filter(x=>{let m=x.match(/^(FEW)(\d{3})(CB|TCU)?$/);if(m&&!m[3]&&+m[2]>=30&&+m[2]<50){removed=true;return false}return true});if(removed){let conv=t.some(x=>/^(FEW|SCT|BKN|OVC)\d{3}(?:CB|TCU)$/.test(x)),wx=t.some(x=>/^(?:\+|-)?(?:FG|FZFG|BR|HZ|RA|DZ|SN|SHRA|SHSN|TS|TSRA|FZRA|FZDZ|MIFG|BCFG|PRFG)$/.test(x));if(!conv&&!wx&&t.includes('9999')){t=t.filter(x=>x!=='9999'&&!/^(FEW|SCT|BKN|OVC)\d{3}$/.test(x)&&x!=='NSC'&&x!=='CAVOK');t.push('CAVOK');text=t.join(' ')}}}return{text,vrb,clear}}'''
          if core not in s:
              if bmark not in s: raise SystemExit('build marker not found')
              s=s.replace(bmark,core+bmark,1)

          oldbase="baseRow=wp?cloneWind(rows[0],wp.baseKt,rows[0].WD,wp.baseGustKt):rw?cloneWind(rows[0],rw.speedKt,rw.dir,rw.gustKt):rows[0],o=`TAF EPIR ${ddhhmm(c.issue)}Z ${ddhh(c.start)}/${ddhhEnd(c.end)} ${state(baseRow)}`;"
          newbase="baseRow=wp?cloneWind(rows[0],wp.baseKt,rows[0].WD,wp.baseGustKt):rw?cloneWind(rows[0],rw.speedKt,rw.dir,rw.gustKt):rows[0],bs=tafBaseState(baseRow,c),o=`TAF EPIR ${ddhhmm(c.issue)}Z ${ddhh(c.start)}/${ddhhEnd(c.end)} ${bs.text}`;"
          if oldbase in s:
              s=s.replace(oldbase,newbase,1)
          elif 'bs=tafBaseState(baseRow,c)' not in s:
              raise SystemExit('build base-state pattern not found')
          s=s.replace("return{o,ch,ck,wp,rw}}function render()", "return{o,ch,ck,wp,rw,vrb:bs.vrb,clear:bs.clear}}function render()",1)

          # Make the applied core rule visible in the confidence line.
          oldconf="${tn}${rn}`;$('badge').textContent='GOTOWY'"
          newconf="${tn}${rn}${r.vrb?` VRB02: ${r.vrb.count}/${r.vrb.total} h <=02KT (${Math.round(r.vrb.share*100)}%), max ${r.vrb.max}KT.`:''}${r.clear?` METAR: ${r.clear.count}/${r.clear.total} ostatnich obserwacji CAVOK/NSC — słaby FEW przy początku prognozy obniżony.`:''}`;$('badge').textContent='GOTOWY'"
          if oldconf in s:s=s.replace(oldconf,newconf,1)

          if s==orig: raise SystemExit('no changes made')
          p.write_text(s,encoding='utf-8')
          print('TAF core patched')
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'PrognozaEPIR bot'
          git config user.email 'actions@users.noreply.github.com'
          git add taf.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'TAF: enforce VRB02 and CAVOK in core generator [skip ci]'
          git push
