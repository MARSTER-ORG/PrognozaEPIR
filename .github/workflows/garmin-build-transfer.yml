name: Temporary Garmin build transfer

on:
  push:
    branches: [ garmin-build-transfer ]
    paths:
      - '.github/workflows/garmin-build-transfer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: garmin-build-transfer

      - name: Fetch and verify vivoactive 5 PRG
        shell: bash
        run: |
          mkdir -p tmp-garmin-build
          curl --fail --location --silent --show-error \
            'https://qozgntzeormujmqzkkmd.supabase.co/functions/v1/garmin-build-transfer' \
            | base64 -d > tmp-garmin-build/EPIRMeteo-vivoactive5.prg
          test "$(stat -c%s tmp-garmin-build/EPIRMeteo-vivoactive5.prg)" = "102492"
          echo 'd40643c2a4233708bd3678137965764dbd70d15fd6a2c9b5537feb37c028c6ac  tmp-garmin-build/EPIRMeteo-vivoactive5.prg' | sha256sum -c -

      - name: Upload verified PRG artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPIRMeteo-vivoactive5
          path: tmp-garmin-build/EPIRMeteo-vivoactive5.prg
          if-no-files-found: error
          retention-days: 1
