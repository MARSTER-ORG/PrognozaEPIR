name: One-shot fix TAF sources
on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-taf-sources.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix IMGW parsing and PilotHub EPIN mapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/taf-proxy.js')
          s = p.read_text(encoding='utf-8')

          old = """const PILOTHUB = {\n  EPIR: [\n    'https://pilothub.pl/lotniska/inowroclaw-szpital',\n    'https://pilothub.pl/lotniska/epwt',\n    'https://pilothub.pl/lotniska/epwk'\n  ],"""
          new = """const PILOTHUB = {\n  EPIR: [\n    'https://pilothub.pl/lotniska/epin',\n    'https://pilothub.pl/lotniska/inowroclaw-szpital'\n  ],"""
          if old not in s:
              raise SystemExit('EPIR PilotHub mapping marker not found')
          s = s.replace(old, new, 1)

          marker = "function normalizeReport(raw) {"
          helper = r'''function parseableText(input) {
  const raw = decodeEntities(String(input || ''));
  const hydrated = raw
    .replace(/\\u003c/gi, '<')
    .replace(/\\u003e/gi, '>')
    .replace(/\\u0026/gi, '&')
    .replace(/\\r\\n|\\n|\\r/g, ' ')
    .replace(/\\"/g, '"')
    .replace(/\\\//g, '/');
  const visible = plainText(raw);
  const embedded = decodeEntities(hydrated)
    .replace(/<style\\b[^>]*>[\\s\\S]*?<\\/style>/gi, ' ')
    .replace(/<[^>]+>/g, ' ')
    .replace(/\\s+/g, ' ')
    .trim();
  return `${visible} ${embedded}`.replace(/\\s+/g, ' ').trim();
}

'''
          if 'function parseableText(input)' not in s:
              if marker not in s:
                  raise SystemExit('normalizeReport marker not found')
              s = s.replace(marker, helper + marker, 1)

          count = s.count('const text = plainText(input);')
          if count != 2:
              raise SystemExit(f'expected 2 parser markers, got {count}')
          s = s.replace('const text = plainText(input);', 'const text = parseableText(input);')

          old_url = "const imgwUrl = `https://awiacja.imgw.pl/metar-i-taf?_=${Date.now()}`;"
          new_url = "const imgwUrl = `https://awiacja.imgw.pl/metar-i-taf?aport=EPIR&_=${Date.now()}`;"
          if old_url not in s:
              raise SystemExit('IMGW URL marker not found')
          s = s.replace(old_url, new_url, 1)

          old_fetch = "const txt = await fetchText(imgwUrl, 'text/html,*/*;q=0.8', 10000);\n      const tafs = extractTafs(txt);"
          new_fetch = "const txt = await fetchText(imgwUrl, 'text/html,*/*;q=0.8', 10000);\n      rec.bytes = txt.length;\n      rec.has_taf_token = /\\bTAF\\b/i.test(txt);\n      rec.has_epir_token = /\\bEPIR\\b/i.test(txt);\n      const tafs = extractTafs(txt);"
          if old_fetch not in s:
              raise SystemExit('IMGW fetch marker not found')
          s = s.replace(old_fetch, new_fetch, 1)

          old_headers = "headers: { 'User-Agent': UA, Accept: accept, 'Cache-Control': 'no-cache' }"
          new_headers = "headers: { 'User-Agent': UA, Accept: accept, 'Accept-Language': 'pl-PL,pl;q=0.9,en;q=0.7', Referer: 'https://awiacja.imgw.pl/', 'Cache-Control': 'no-cache', Pragma: 'no-cache' }"
          if old_headers not in s:
              raise SystemExit('fetch headers marker not found')
          s = s.replace(old_headers, new_headers, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check api/taf-proxy.js
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fix-taf-sources.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/taf-proxy.js .github/workflows/one-shot-fix-taf-sources.yml
          git commit -m 'Fix IMGW TAF parsing and EPIN fallback'
          git push
