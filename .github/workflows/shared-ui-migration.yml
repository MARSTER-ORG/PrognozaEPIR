name: Shared UI migration

on:
  push:
    branches:
      - refactor/shared-ui-20260919
    paths:
      - scripts/migrate-shared-ui.py
      - .github/workflows/shared-ui-migration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-ui-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/shared-ui-20260919
          fetch-depth: 0

      - name: Migrate active pages to shared UI
        run: python3 scripts/migrate-shared-ui.py

      - name: Validate shared UI
        run: |
          python3 scripts/migrate-shared-ui.py --check
          node --check theme.js
          python3 - <<'PY'
          from pathlib import Path
          pages = ['index.html','fog.html','radar.html','sat-fog.html','taf.html','arch.html','lightning-alerts.html']
          for name in pages:
              text = Path(name).read_text(encoding='utf-8')
              head = text.split('</head>', 1)[0].lower()
              assert '<style' not in head, f'{name}: inline style remains'
              assert 'app.css' in head and 'theme.js' in head, f'{name}: shared assets missing'
          print('HTML wiring: OK')
          PY

      - name: Commit migrated UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fog.html radar.html sat-fog.html taf.html arch.html lightning-alerts.html app.css theme.js docs/UI_STYLE_GUIDE.md
          git commit -m "refactor(ui): centralize styles and theme [shared-ui-migrated]"
          git push origin HEAD:refactor/shared-ui-20260919
