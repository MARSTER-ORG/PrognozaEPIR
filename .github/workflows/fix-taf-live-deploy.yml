name: Finalize live IMGW TAF deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-taf-live-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add deploy compatibility marker and self-remove
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('taf.html')
          s=p.read_text(encoding='utf-8')
          marker='TAF EPBY/EPPW/EPKS'
          if marker not in s:
              s=s.replace('<title>PrognozaEPIR — GENERATOR TAF</title>', '<title>PrognozaEPIR — GENERATOR TAF</title><!-- TAF EPBY/EPPW/EPKS -->', 1)
              p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-taf-live-deploy.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: finalize live IMGW TAF page"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Redeploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
