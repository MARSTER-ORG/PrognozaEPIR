name: Retry resilient Europe-wide LFL repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lfl-repair-install-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current main
        shell: bash
        run: |
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('radar-intelligence.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("'lightningToggle',", "", 1)
          s=s.replace('Wyładowania LFL|Blitzortung LIVE|MTG IR10\\.5|MTG Geo', 'Blitzortung LIVE|MTG IR10\\.5|MTG Geo', 1)
          p.write_text(s,encoding='utf-8')

          p=Path('radar.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="lightning-layer\.js[^\"]*"></script>', '', s)
          s,n=re.subn(r'(<script src="radar-intelligence\.js[^\"]*"></script>)', r'\1\n<script src="lightning-layer.js?v=20260915-lfl-r7"></script>', s, count=1)
          if n!=1: raise SystemExit('radar-intelligence script anchor missing')
          p.write_text(s,encoding='utf-8')

          p=Path('lightning-layer.js'); s=p.read_text(encoding='utf-8')
          old="const card=$('stormHobbyCard');if(!card||card.dataset.lflV3==='1')return Boolean(card);"
          new="""let card=$('stormHobbyCard');
    if(!card){
      const mapCard=$('map')?.closest('.card');
      if(mapCard){
        card=document.createElement('section');card.id='stormHobbyCard';card.className='card';card.style.marginTop='8px';
        mapCard.insertAdjacentElement('afterend',card);
      }
    }
    if(!card||card.dataset.lflV3==='1')return Boolean(card);"""
          if old in s: s=s.replace(old,new,1)
          elif "let card=$('stormHobbyCard');" not in s: raise SystemExit('LFL panel anchor missing')
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/collect_lightning_features.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('LOOKBACK_MIN = 24','LOOKBACK_MIN = int(os.environ.get("LFL_LOOKBACK_MIN", "45"))',1)
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/collect_lightning_features_lowmem.py'); s=p.read_text(encoding='utf-8')
          old='''def main() -> int:\n    load_cache()\n    payload = core.collect_and_write()\n    if payload.get("status") in {"ok", "stale"}:\n        save_cache()'''
          new='''def main() -> int:\n    load_cache()\n    previous = None\n    try:\n        candidate = json.loads(core.OUT.read_text(encoding="utf-8"))\n        if candidate.get("schema") == "prognozaepir-lightning-features-v1" and candidate.get("status") in {"ok", "stale"}:\n            previous = candidate\n    except (OSError, json.JSONDecodeError, AttributeError):\n        pass\n\n    payload = core.collect_and_write()\n    if payload.get("status") == "error" and previous is not None:\n        failure_reason = payload.get("reason") or "temporary LFL collector failure"\n        payload = dict(previous)\n        payload["collector_health"] = {\n            "status": "degraded",\n            "reason": failure_reason,\n            "checked_at": core.iso(core.utc_now()),\n            "fallback": "last-valid-Europe-wide-snapshot",\n        }\n        core.atomic_json(core.OUT, payload)\n\n    if payload.get("status") in {"ok", "stale"}:\n        save_cache()'''
          if old in s: s=s.replace(old,new,1)
          elif 'fallback": "last-valid-Europe-wide-snapshot' not in s: raise SystemExit('lowmem anchor missing')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.html radar-intelligence.js lightning-layer.js scripts/collect_lightning_features.py scripts/collect_lightning_features_lowmem.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore Europe-wide LFL map panel and feed continuity'
          for n in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
