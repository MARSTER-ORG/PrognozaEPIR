name: Apply TAF METAR guard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_taf_metar_guard.py'
      - '.github/workflows/apply-taf-metar-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply parser fix
        run: python3 scripts/apply_taf_metar_guard.py
      - name: Validate JavaScript
        run: |
          node --check taf-multisource.js
          node --check api/taf-proxy.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('taf.html').read_text(encoding='utf-8')
          parts=s.split('<script>')
          assert len(parts) >= 3
          Path('/tmp/taf-source.js').write_text(parts[1].split('</script>',1)[0],encoding='utf-8')
          Path('/tmp/taf-generator.js').write_text(parts[2].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/taf-source.js
          node --check /tmp/taf-generator.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taf.html taf-multisource.js api/taf-proxy.js
          git commit -m "fix: reject TAF data in METAR parser"
          git pull --rebase origin main
          git push origin HEAD:main
