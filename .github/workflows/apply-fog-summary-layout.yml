name: Apply structured fog summary layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fog-summary-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-fog-summary-layout
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch page and MIFG horizon
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<script src="fog-summary-layout.js?v=1"></script>'
          if tag not in html:
              if '</body>' not in html:
                  raise SystemExit('index.html: </body> not found')
              html = html.replace('</body>', tag + '\n</body>', 1)
              index.write_text(html, encoding='utf-8')

          mifg = Path('mifg-engine.js')
          js = mifg.read_text(encoding='utf-8')
          if "forecast_hours:'24'" in js:
              js = js.replace("forecast_hours:'24'", "forecast_hours:'54'", 1)
          elif "forecast_hours:'54'" not in js:
              raise SystemExit('mifg-engine.js: forecast_hours marker not found')

          old = 'x.t<=now+18*HOUR'
          if old in js:
              count = js.count(old)
              if count != 2:
                  raise SystemExit(f'mifg-engine.js: expected 2 18h filters, found {count}')
              js = js.replace(old, 'x.t<=now+48*HOUR')
          elif js.count('x.t<=now+48*HOUR') < 2:
              raise SystemExit('mifg-engine.js: 48h filters not confirmed')
          mifg.write_text(js, encoding='utf-8')

      - name: Validate JavaScript and wiring
        run: |
          node --check fog-summary-layout.js
          node --check mifg-engine.js
          grep -F '<script src="fog-summary-layout.js?v=1"></script>' index.html
          grep -F "forecast_hours:'54'" mifg-engine.js
          test "$(grep -o 'x.t<=now+48\*HOUR' mifg-engine.js | wc -l)" -ge 2

      - name: Commit result and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-fog-summary-layout.yml
          git add index.html mifg-engine.js fog-summary-layout.js
          git commit -m 'ui: group FG BR and MIFG into structured rows'
          git pull --rebase origin main
          git push origin HEAD:main
