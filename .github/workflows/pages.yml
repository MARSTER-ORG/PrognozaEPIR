name: Deploy PrognozaEPIR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html radar.html index-fixes.js radar-enhance.js _site/
          python3 - <<'PY'
          from pathlib import Path

          # Main meteogram: keep source compact; fixes live in index-fixes.js.
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          for old in ('v0.9.13 HTML','v0.10.0 HTML','v0.10.1 HTML'):
              s = s.replace(old, 'v0.10.2 HTML')
          for old in ('HTML v0.9.12','HTML v0.9.13','HTML v0.10.0','HTML v0.10.1'):
              s = s.replace(old, 'HTML v0.10.2')

          icm = '<a class="control-link" href="https://www.meteo.pl/um/php/meteorogram_id_um.php?ntype=0n&amp;id=2077" target="_blank" rel="noopener noreferrer">ICM UM meteogram ↗</a>'
          radar = '<a class="control-link" href="radar.html">RADAR / SAT / AI</a>'
          if radar not in s and icm in s:
              s = s.replace(icm, radar + '\n    ' + icm, 1)

          s = s.replace("{id:'icon_global',name:'ICON',w:.05,provider:'openmeteo'},",
                        "{id:'icon_global',name:'ICON',w:.05,provider:'openmeteo',surfaceExclude:['visibility']},")
          s = s.replace("const vars=prof?profileVarsFor(model):SURFACE;",
                        "const vars=prof?profileVarsFor(model):SURFACE.filter(v=>!(model.surfaceExclude||[]).includes(v));")
          s = s.replace("const msg=j?.error||j?.reason||j?.message||('HTTP '+r.status);",
                        "const msg=j?.reason||j?.message||(typeof j?.error==='string'?j.error:('HTTP '+r.status));")
          addon = '<script src="index-fixes.js"></script>'
          if addon not in s:
              s = s.replace('</body>', addon + '\n</body>')
          p.write_text(s, encoding='utf-8')

          # Radar/Satellite module: official-source and map interaction extension.
          p = Path('_site/radar.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('RADAR / SAT / AI v0.10.0','RADAR / SAT / AI v0.10.2')
          s = s.replace('RADAR / SAT / AI v0.10.1','RADAR / SAT / AI v0.10.2')
          addon = '<script src="radar-enhance.js"></script>'
          if addon not in s:
              s = s.replace('</body>', addon + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check index-fixes.js
          node --check radar-enhance.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
