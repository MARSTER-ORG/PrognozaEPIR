name: Deploy PrognozaEPIR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site/data/observations _site/data/learning
          cp index.html radar.html epir-icon.svg epir-icon-192.png epir-icon-512.png \
             index-fixes.js axis-layout-fix.js visual-style-fix.js meteogram-layout-v2.js \
             rh-axis-fix.js day-night-fix.js fog-engine.js observation-engine.js mifg-engine.js fog-meteogram-overlay.js shortcut-mode.js \
             cloud-learning-client.js \
             radar-enhance.js warnings-readable.js radar-intelligence.js echo-analysis.js echo-fix.js \
             lightning-layer.js ui-cleanup.js map-extras.js analysis-plus.js range-rings-reset.js _site/
          cp data/observations/latest.json data/observations/recent.json _site/data/observations/
          cp data/learning/cloud-skill.json _site/data/learning/
          python3 - <<'PY'
          from pathlib import Path
          import re

          APP='v0.10.24 HTML'
          favicon = '<link rel="icon" href="epir-icon-192.png" type="image/png" sizes="192x192">\n<link rel="shortcut icon" href="epir-icon-192.png" type="image/png">\n<link rel="apple-touch-icon" href="epir-icon-192.png">'
          shortcut_addon = '<script src="shortcut-mode.js"></script>'
          cloud_loader = '<script src="cloud-learning-client.js"></script>'
          fog_overlay_addon = '<script src="fog-meteogram-overlay.js"></script>'

          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          if 'href="epir-icon-192.png"' not in s:
              s=s.replace('<title>',favicon+'\n<title>',1)
          s=re.sub(r'v0\.\d+\.\d+ HTML',APP,s)
          s=re.sub(r'HTML v0\.\d+\.\d+','HTML v0.10.24',s)
          s=s.replace('function timeline(){const now=Date.now(),t0=Math.ceil(now/3600e3)*3600e3',
                      'function timeline(){const now=Date.now(),t0=Math.floor(now/3600e3)*3600e3')
          icm='<a class="control-link" href="https://www.meteo.pl/um/php/meteorogram_id_um.php?ntype=0n&amp;id=2077" target="_blank" rel="noopener noreferrer">ICM UM meteogram ↗</a>'
          radar='<a class="control-link" href="radar.html">RADAR / SAT / AI</a>'
          if radar not in s and icm in s:
              s=s.replace(icm,radar+'\n    '+icm,1)
          s=s.replace("{id:'icon_global',name:'ICON',w:.05,provider:'openmeteo'},",
                      "{id:'icon_global',name:'ICON',w:.05,provider:'openmeteo',surfaceExclude:['visibility']},")
          s=s.replace("const vars=prof?profileVarsFor(model):SURFACE;",
                      "const vars=prof?profileVarsFor(model):SURFACE.filter(v=>!(model.surfaceExclude||[]).includes(v));")
          s=s.replace("const msg=j?.error||j?.reason||j?.message||('HTTP '+r.status);",
                      "const msg=j?.reason||j?.message||(typeof j?.error==='string'?j.error:('HTTP '+r.status));")

          # Load the learning client before the main inline application script.
          if cloud_loader not in s:
              s=s.replace("<script>\n'use strict';",cloud_loader+"\n<script>\n'use strict';",1)

          # Keep the original model weights for temperature, humidity, wind,
          # visibility and precipitation. Adapt only the cloud-profile ensemble.
          old_cloud="const pr=profile(items,terr),ceil=ceiling(pr)"
          new_cloud="const cloudItems=items.map(i=>({...i,w:i.w*(window.PrognozaEPIRCloudLearning?.factor?.(i.model.id,t)||1)})),cloudSw=cloudItems.reduce((a,b)=>a+b.w,0);if(cloudSw)cloudItems.forEach(i=>i.w/=cloudSw);const pr=profile(cloudItems,terr),ceil=ceiling(pr)"
          if old_cloud not in s:
              raise SystemExit('Cloud Learning profile hook not found')
          s=s.replace(old_cloud,new_cloud,1)

          # Ensure skill data is loaded before the asynchronous model requests finish.
          old_load="async function load(){setBadge('ŁADOWANIE','');failures=[];datasets.clear();demo=false;"
          new_load="async function load(){try{await window.PrognozaEPIRCloudLearning?.loadSkill?.()}catch(_){ }setBadge('ŁADOWANIE','');failures=[];datasets.clear();demo=false;"
          if old_load not in s:
              raise SystemExit('Cloud Learning load hook not found')
          s=s.replace(old_load,new_load,1)

          addons=[
              '<script src="index-fixes.js"></script>',
              '<script src="axis-layout-fix.js"></script>',
              '<script src="visual-style-fix.js"></script>',
              '<script src="meteogram-layout-v2.js"></script>',
              '<script src="rh-axis-fix.js"></script>',
              '<script src="day-night-fix.js"></script>',
              '<script src="observation-engine.js"></script>',
              '<script src="mifg-engine.js"></script>',
              fog_overlay_addon,
              shortcut_addon,
          ]
          for addon in addons:
              if addon not in s:
                  s=s.replace('</body>',addon+'\n</body>')
          s=s.replace('<script src="fog-engine.js"></script>\n','')
          s=s.replace('<script src="fog-archive.js"></script>\n','')
          p.write_text(s,encoding='utf-8')

          # Keep all meteogram modules on the same visible application version.
          for name in ('meteogram-layout-v2.js','observation-engine.js','fog-engine.js'):
              p=Path('_site')/name
              s=p.read_text(encoding='utf-8')
              s=re.sub(r"const VERSION = 'v0\.\d+\.\d+ HTML';",f"const VERSION = '{APP}';",s)
              s=re.sub(r"const APP_VERSION = 'v0\.\d+\.\d+ HTML';",f"const APP_VERSION = '{APP}';",s)
              if name == 'fog-engine.js':
                  old='fogSeries=out;renderFog();'
                  new="fogSeries=out;window.PrognozaEPIRFogSeries=fogSeries;window.dispatchEvent(new CustomEvent('prognozaepir:fog-series-updated',{detail:{count:fogSeries.length}}));renderFog();"
                  if old not in s:
                      raise SystemExit('Fog Engine series export hook not found')
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          p=Path('_site/radar.html')
          s=p.read_text(encoding='utf-8')
          if 'href="epir-icon-192.png"' not in s:
              s=s.replace('<title>',favicon+'\n<title>',1)
          s=re.sub(r'RADAR / SAT / AI v\d+\.\d+\.\d+','RADAR / SAT / AI v0.12.3',s)
          s=s.replace("function setDot(id,ok){$(id).className='dot '+(ok?'ok':'bad')}",
                      "function setDot(id,ok){const el=$(id);if(el)el.className='dot '+(ok?'ok':'bad')}")
          brand_old='<div class="brand">PrognozaEPIR <small>'
          brand_new='<div class="brand"><a href="index.html" title="Przejdź do meteogramu" aria-label="PrognozaEPIR — meteogram" style="color:inherit;text-decoration:none;cursor:pointer">PrognozaEPIR</a> <small>'
          if brand_old in s:
              s=s.replace(brand_old,brand_new,1)
          radar_addons=[
              '<script src="radar-enhance.js"></script>',
              '<script src="warnings-readable.js"></script>',
              '<script src="radar-intelligence.js"></script>',
              '<script src="echo-analysis.js"></script>',
              '<script src="echo-fix.js"></script>',
              '<script src="lightning-layer.js"></script>',
              '<script src="ui-cleanup.js"></script>',
              '<script src="map-extras.js"></script>',
              '<script src="analysis-plus.js"></script>',
              '<script src="range-rings-reset.js"></script>',
              shortcut_addon,
          ]
          for addon in radar_addons:
              if addon not in s:
                  s=s.replace('</body>',addon+'\n</body>')
          p.write_text(s,encoding='utf-8')

          for name in ('radar-enhance.js','radar-intelligence.js','echo-analysis.js','echo-fix.js','lightning-layer.js','map-extras.js','analysis-plus.js','range-rings-reset.js'):
              p=Path('_site')/name
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'RADAR / SAT / AI v\d+\.\d+\.\d+','RADAR / SAT / AI v0.12.3',s)
              p.write_text(s,encoding='utf-8')

          p=Path('_site/radar-enhance.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('    setTimeout(loadPolradProducts, 150);\n','')
          start=s.find('  // --- Official IMGW / POLRAD product API ---')
          end=s.rfind("  const sources = document.querySelector('.sources');")
          if start>=0 and end>start:
              s=s[:start]+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          for f in index-fixes.js axis-layout-fix.js visual-style-fix.js meteogram-layout-v2.js rh-axis-fix.js day-night-fix.js fog-engine.js observation-engine.js mifg-engine.js fog-meteogram-overlay.js shortcut-mode.js cloud-learning-client.js radar-enhance.js warnings-readable.js radar-intelligence.js echo-analysis.js echo-fix.js lightning-layer.js ui-cleanup.js map-extras.js analysis-plus.js range-rings-reset.js; do
            node --check "$f"
          done
          node --check _site/observation-engine.js
          node --check _site/fog-engine.js
          node --check _site/fog-meteogram-overlay.js
          node --check _site/mifg-engine.js
          node --check _site/cloud-learning-client.js

      - name: Verify deployed features
        run: |
          test -s _site/epir-icon-192.png
          test -s _site/epir-icon-512.png
          test -s _site/fog-engine.js
          test -s _site/observation-engine.js
          test -s _site/mifg-engine.js
          test -s _site/fog-meteogram-overlay.js
          test -s _site/cloud-learning-client.js
          test -s _site/data/observations/latest.json
          test -s _site/data/observations/recent.json
          test -s _site/data/learning/cloud-skill.json
          python3 -m json.tool _site/data/observations/latest.json >/dev/null
          python3 -m json.tool _site/data/observations/recent.json >/dev/null
          python3 -m json.tool _site/data/learning/cloud-skill.json >/dev/null
          grep -F '<script src="observation-engine.js"></script>' _site/index.html
          grep -F '<script src="mifg-engine.js"></script>' _site/index.html
          grep -F '<script src="fog-meteogram-overlay.js"></script>' _site/index.html
          grep -F '<script src="cloud-learning-client.js"></script>' _site/index.html
          grep -F 'const cloudItems=items.map' _site/index.html
          grep -F 'PrognozaEPIRCloudLearning?.factor' _site/index.html
          grep -F 'PrognozaEPIRCloudLearning?.loadSkill' _site/index.html
          grep -F 'if(row)items.push({model:m,row,w:m.w,elevation:ds.elevation})' _site/index.html
          ! grep -F '<script src="fog-engine.js"></script>' _site/index.html
          ! grep -F 'fog-archive.js' _site/index.html
          grep -F "loadFogEngine" _site/observation-engine.js
          grep -F "automatic-epir-metar-synop" _site/observation-engine.js
          grep -F "shallowFog" _site/observation-engine.js
          grep -F "SYNOP ma pierwszeństwo" _site/observation-engine.js
          grep -F "data/observations/recent.json" _site/observation-engine.js
          grep -F "MIFG &lt;2 m" _site/mifg-engine.js
          grep -F "surface_temperature" _site/mifg-engine.js
          grep -F "EPIR FOG ENGINE v1.1" _site/fog-engine.js
          grep -F "PrognozaEPIRFogSeries" _site/fog-engine.js
          grep -F "prognozaepir:fog-series-updated" _site/fog-engine.js
          grep -F "FOG_DRAW_THRESHOLD = 40" _site/fog-meteogram-overlay.js
          grep -F "FOG ≥40/100" _site/fog-meteogram-overlay.js
          grep -F "if(o.freezingFog||o.fog)" _site/fog-engine.js
          grep -F "if(o.mist)" _site/fog-engine.js
          grep -F "Math.floor(now/3600e3)" _site/index.html
          ! grep -F "Math.ceil(now/3600e3)" _site/index.html
          grep -F "v0.10.24 HTML" _site/index.html
          grep -F '<link rel="icon" href="epir-icon-192.png" type="image/png" sizes="192x192">' _site/index.html
          grep -F '<script src="shortcut-mode.js"></script>' _site/index.html
          grep -F '<script src="day-night-fix.js"></script>' _site/index.html
          grep -F "RADAR / SAT / AI v0.12.3" _site/range-rings-reset.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
