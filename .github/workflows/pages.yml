name: Deploy PrognozaEPIR to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical runtime
        shell: bash
        run: |
          python3 -m py_compile scripts/build-pages.py
          node --check site-shell.js
          node --check taf-engine-v2.js
          node --check taf-app-v2.js
          node --check message-archive-client.js
          node --check utc-ui-guard.js
          node tests/taf-engine-v2.test.js
          python3 scripts/build-pages.py
          grep -F 'TAF ENGINE 2.3.1 · INSTRUCTION FIRST' _site/taf.html
          grep -F 'content="2.3.1"' _site/taf.html
          grep -F 'site-shell.css' _site/index.html
          grep -F 'site-shell.js' _site/taf.html
          test ! -e _site/taf-hybrid-engine.js
          test ! -e _site/taf-hybrid-adapter.js
          test ! -e _site/taf-generator-policy.js
          test ! -e _site/taf-instruction-guard.js
          test ! -e _site/taf-cloud-policy.js
          test ! -e _site/taf-weather-policy.js
          ! grep -R -E 'taf-hybrid|taf-generator-policy|taf-instruction-guard|TAF ENGINE 2\.2' _site --include='*.html' --include='*.js'

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build canonical site
        run: python3 scripts/build-pages.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
