name: Deploy PrognozaEPIR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html radar.html index-fixes.js radar-enhance.js warnings-readable.js radar-intelligence.js echo-analysis.js echo-fix.js lightning-layer.js ui-cleanup.js map-extras.js analysis-plus.js range-rings-reset.js _site/
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          for old in ('v0.9.13 HTML','v0.10.0 HTML','v0.10.1 HTML'):
              s = s.replace(old, 'v0.10.2 HTML')
          for old in ('HTML v0.9.12','HTML v0.9.13','HTML v0.10.0','HTML v0.10.1'):
              s = s.replace(old, 'HTML v0.10.2')
          icm = '<a class="control-link" href="https://www.meteo.pl/um/php/meteorogram_id_um.php?ntype=0n&amp;id=2077" target="_blank" rel="noopener noreferrer">ICM UM meteogram ↗</a>'
          radar = '<a class="control-link" href="radar.html">RADAR / SAT / AI</a>'
          if radar not in s and icm in s:
              s = s.replace(icm, radar + '\n    ' + icm, 1)
          s = s.replace("{id:'icon_global',name:'ICON',w:.05,provider:'openmeteo'},",
                        "{id:'icon_global',name:'ICON',w:.05,provider:'openmeteo',surfaceExclude:['visibility']},")
          s = s.replace("const vars=prof?profileVarsFor(model):SURFACE;",
                        "const vars=prof?profileVarsFor(model):SURFACE.filter(v=>!(model.surfaceExclude||[]).includes(v));")
          s = s.replace("const msg=j?.error||j?.reason||j?.message||('HTTP '+r.status);",
                        "const msg=j?.reason||j?.message||(typeof j?.error==='string'?j.error:('HTTP '+r.status));")
          addon = '<script src="index-fixes.js"></script>'
          if addon not in s:
              s = s.replace('</body>', addon + '\n</body>')
          p.write_text(s, encoding='utf-8')

          p = Path('_site/radar.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'RADAR / SAT / AI v\d+\.\d+\.\d+', 'RADAR / SAT / AI v0.12.3', s)
          s = s.replace(
              "function setDot(id,ok){$(id).className='dot '+(ok?'ok':'bad')}",
              "function setDot(id,ok){const el=$(id);if(el)el.className='dot '+(ok?'ok':'bad')}"
          )
          brand_old = '<div class="brand">PrognozaEPIR <small>'
          brand_new = '<div class="brand"><a href="index.html" title="Przejdź do meteogramu" aria-label="PrognozaEPIR — meteogram" style="color:inherit;text-decoration:none;cursor:pointer">PrognozaEPIR</a> <small>'
          if brand_old in s:
              s = s.replace(brand_old, brand_new, 1)
          addons = [
              '<script src="radar-enhance.js"></script>',
              '<script src="warnings-readable.js"></script>',
              '<script src="radar-intelligence.js"></script>',
              '<script src="echo-analysis.js"></script>',
              '<script src="echo-fix.js"></script>',
              '<script src="lightning-layer.js"></script>',
              '<script src="ui-cleanup.js"></script>',
              '<script src="map-extras.js"></script>',
              '<script src="analysis-plus.js"></script>',
              '<script src="range-rings-reset.js"></script>',
          ]
          for addon in addons:
              if addon not in s:
                  s = s.replace('</body>', addon + '\n</body>')
          p.write_text(s, encoding='utf-8')

          for name in ('radar-enhance.js', 'radar-intelligence.js', 'echo-analysis.js', 'echo-fix.js', 'lightning-layer.js', 'map-extras.js', 'analysis-plus.js', 'range-rings-reset.js'):
              p = Path('_site') / name
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'RADAR / SAT / AI v\d+\.\d+\.\d+', 'RADAR / SAT / AI v0.12.3', s)
              p.write_text(s, encoding='utf-8')

          p = Path('_site/radar-enhance.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    setTimeout(loadPolradProducts, 150);\n', '')
          start = s.find('  // --- Official IMGW / POLRAD product API ---')
          end = s.rfind("  const sources = document.querySelector('.sources');")
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check index-fixes.js
          node --check radar-enhance.js
          node --check warnings-readable.js
          node --check radar-intelligence.js
          node --check echo-analysis.js
          node --check echo-fix.js
          node --check lightning-layer.js
          node --check ui-cleanup.js
          node --check map-extras.js
          node --check analysis-plus.js
          node --check range-rings-reset.js
          node --check _site/index-fixes.js
          node --check _site/radar-enhance.js
          node --check _site/warnings-readable.js
          node --check _site/radar-intelligence.js
          node --check _site/echo-analysis.js
          node --check _site/echo-fix.js
          node --check _site/lightning-layer.js
          node --check _site/ui-cleanup.js
          node --check _site/map-extras.js
          node --check _site/analysis-plus.js
          node --check _site/range-rings-reset.js

      - name: Verify deployed radar features
        run: |
          grep -F "function setDot(id,ok){const el=\$(id);if(el)el.className='dot '+(ok?'ok':'bad')}" _site/radar.html
          grep -F "echo-fix.js" _site/radar.html
          grep -F "map-extras.js" _site/radar.html
          grep -F "analysis-plus.js" _site/radar.html
          grep -F "range-rings-reset.js" _site/radar.html
          grep -F "maps.blitzortung.org" _site/map-extras.js
          grep -F "const RADII=[10,25,50,75,100]" _site/analysis-plus.js
          grep -F "getPointsAround" _site/lightning-layer.js
          grep -F "cmaxPhenomena" _site/analysis-plus.js
          grep -F "RADII_KM = [10,25,50,75,100]" _site/range-rings-reset.js
          grep -F "clearOldPointGraphics" _site/range-rings-reset.js
          grep -F "goToAnalysisMap" _site/range-rings-reset.js
          grep -F "scrollMapIntoView" _site/range-rings-reset.js
          grep -F "RADAR / SAT / AI v0.12.3" _site/range-rings-reset.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
