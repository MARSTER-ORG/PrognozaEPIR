name: EPIR METAR SPECI archive watchdog

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: prognozaepir-metar-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check current METAR freshness and refresh GitHub mirror if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if python3 scripts/check_epir_archive_freshness.py --metar-only --skip-metar-continuity; then
            echo 'Current METAR/SPECI archive is fresh.'
            exit 0
          fi
          echo '::warning::Current METAR archive is stale; requesting a validated Railway-to-GitHub mirror refresh'
          gh workflow run mirror-central-archive.yml --repo "${{ github.repository }}" --ref main
          exit 1
