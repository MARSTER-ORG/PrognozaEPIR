name: EPIR Observations Armored Heartbeat

on:
  push:
    branches: [main]
    paths:
      - 'scripts/metar_armored.py'
      - 'scripts/live_metar_collector.py'
      - 'scripts/refresh_epir_metar.py'
      - 'scripts/collect_epir_observations.py'
      - 'scripts/supplement_metar_pilothub.py'
      - 'scripts/supplement_synop_12342.py'
      - '.github/workflows/metar-heartbeat.yml'
  schedule:
    # Primary observation clock. It is intentionally independent from every
    # TAF/model workflow. Multiple polls give several chances to capture each
    # routine EPIR report and every SPECI.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: epir-observation-armored
  cancel-in-progress: false

jobs:
  observations:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate observation collectors
        run: |
          python3 -m py_compile \
            scripts/collect_epir_observations.py \
            scripts/supplement_synop_12342.py \
            scripts/refresh_epir_metar.py \
            scripts/live_metar_collector.py \
            scripts/metar_armored.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import refresh_epir_metar as r
          sample='''
          METAR EPIR 071500Z 19006KT CAVOK 22/10 Q1023=
          SPECI EPIR 071515Z 20008KT 6000 BR SCT020 21/11 Q1023=
          METAR EPIR 071530Z 20007KT 9999 SCT030 21/10 Q1023=
          '''
          rows=r.extract_epir_reports(sample,'TEST')
          assert len(rows)==3, rows
          assert len({x['obs_time'] for x in rows})==3, rows
          assert rows[1]['report_type']=='SPECI', rows
          print('EPIR observation parser self-test: OK')
          PY

      - name: Collect EPIR METAR and SYNOP independently
        run: |
          # Legacy path may rescue SYNOP or a mirror source. Any failure here is
          # non-fatal because the armored METAR path runs afterwards.
          python3 scripts/collect_epir_observations.py || echo "Legacy observation source unavailable; continuing"
          python3 scripts/supplement_synop_12342.py || echo "SYNOP supplement unavailable; continuing"

          # Authoritative METAR/SPECI path: direct IMGW API plus independent
          # fallbacks, retries, backfill and atomic persistence.
          python3 scripts/metar_armored.py

      - name: Commit meaningful observation state
        id: commit
        run: |
          meaningful=false

          # Any canonical archive change is meaningful immediately.
          if ! git diff --quiet -- data/observations/metar data/observations/synop; then
            meaningful=true
          else
            # latest/recent contain volatile timestamps. Commit them only when
            # an actual METAR/SYNOP/freshness state changed.
            if python3 - <<'PY'
          import json, subprocess, sys
          cur=json.load(open('data/observations/latest.json',encoding='utf-8'))
          try:
              old=json.loads(subprocess.check_output(
                  ['git','show','HEAD:data/observations/latest.json'], text=True, encoding='utf-8'))
          except Exception:
              sys.exit(0)
          def row_key(p,kind):
              r=(p or {}).get(kind) or {}
              return (r.get('obs_time'),r.get('raw'),r.get('source'),r.get('report_type'))
          def state_key(p):
              f=(p or {}).get('metar_freshness') or {}
              return (f.get('status'),tuple(f.get('missing_routine_slots') or ()))
          changed=(row_key(cur,'metar')!=row_key(old,'metar') or
                   row_key(cur,'synop')!=row_key(old,'synop') or
                   state_key(cur)!=state_key(old))
          sys.exit(0 if changed else 1)
          PY
            then
              meaningful=true
            fi
          fi

          if [ "$meaningful" != true ]; then
            echo "No new observation/backfill/source upgrade; skipping timestamp-only commit"
            git restore -- data/observations/latest.json data/observations/recent.json 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations
          git commit -m "data: armored EPIR observations $(date -u +'%Y-%m-%d %H:%MZ')"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Observation push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 4))
          done
          echo "Failed to persist EPIR observations after retries" >&2
          exit 1

      - name: Validate persisted observations
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=json.load(open('data/observations/latest.json',encoding='utf-8'))
          m=p.get('metar') or {}
          assert m.get('station')=='EPIR', m
          assert m.get('obs_time') and m.get('raw'), m
          t=datetime.fromisoformat(m['obs_time'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-t).total_seconds()/60
          day=Path('data/observations/metar')/t.strftime('%Y')/t.strftime('%m')/(t.strftime('%d')+'.jsonl')
          assert day.exists(), day
          rows=[json.loads(x) for x in day.read_text(encoding='utf-8').splitlines() if x.strip()]
          assert any(x.get('obs_time')==m.get('obs_time') and x.get('raw')==m.get('raw') for x in rows), 'latest METAR missing from canonical archive'
          print('EPIR METAR:',m.get('obs_time'),m.get('source'),m.get('raw'))
          print('METAR age min:',round(age,1))
          print('SYNOP:',(p.get('synop') or {}).get('obs_time'),(p.get('synop') or {}).get('source'))
          print('Freshness:',p.get('metar_freshness'))
          if age > 75:
              raise SystemExit(f'EPIR METAR stale after armored collection: {age:.1f} min')
          PY

      - name: Redeploy current observations to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
