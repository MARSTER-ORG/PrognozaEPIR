name: Embed meteogram section popover

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Embed popover in deployed overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path

          overlay_path = Path('fog-meteogram-overlay.js')
          module_path = Path('meteogram-section-popover.js')
          marker = '// --- EPIR METEOGRAM SECTION POPOVER EMBEDDED ---'

          overlay = overlay_path.read_text(encoding='utf-8')
          module = module_path.read_text(encoding='utf-8').strip()
          if marker not in overlay:
              overlay = overlay.rstrip() + '\n\n' + marker + '\n' + module + '\n'
              overlay_path.write_text(overlay, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check fog-meteogram-overlay.js
          grep -F 'EPIR METEOGRAM SECTION POPOVER EMBEDDED' fog-meteogram-overlay.js
          grep -F 'epir-section-info-source-hidden' fog-meteogram-overlay.js

      - name: Commit embedded popover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fog-meteogram-overlay.js
          if git diff --cached --quiet; then
            echo 'Popover already embedded.'
            exit 0
          fi
          git commit -m 'feat: show meteogram section data in popover'
          git push origin main
