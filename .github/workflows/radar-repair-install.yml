name: Install radar repair bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-repair-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add repair script and cache-bust radar modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('radar.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="radar-repair.js?v=20260914-r6"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('radar.html has no </body>')
              s = s.replace('</body>', tag + '\n</body>')
          s = s.replace('radar-intelligence.js?v=20260914-radar-sync-v5', 'radar-intelligence.js?v=20260914-radar-repair-r6')
          s = s.replace('opera-nowcast.js?v=20260914-radar-sync-v5', 'opera-nowcast.js?v=20260914-radar-repair-r6')
          p.write_text(s, encoding='utf-8')
          PY
          if git diff --quiet -- radar.html; then
            echo 'radar.html already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.html
          git commit -m 'Activate radar repair runtime'
          git push
