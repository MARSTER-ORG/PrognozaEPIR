name: Fix Pages ARCH publish once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pages-arch-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Pages manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/pages.yml')
          s = p.read_text(encoding='utf-8')

          old_copy = 'cp index.html radar.html taf.html sat-fog.html'
          new_copy = 'cp index.html arch.html radar.html taf.html sat-fog.html'
          if new_copy not in s:
              if old_copy not in s:
                  raise SystemExit('Pages copy manifest hook not found')
              s = s.replace(old_copy, new_copy, 1)

          verify_arch = '          test -s _site/arch.html\n'
          verify_taf = '          test -s _site/taf.html\n'
          if verify_arch not in s:
              if verify_taf not in s:
                  raise SystemExit('Pages verification hook not found')
              s = s.replace(verify_taf, verify_arch + verify_taf, 1)

          grep_arch = '          grep -F \'<a class="control-link" href="arch.html">ARCH</a>\' _site/index.html\n'
          grep_taf = '          grep -F \'<a class="control-link" href="taf.html">GENERATOR TAF</a>\' _site/index.html\n'
          if grep_arch not in s:
              if grep_taf not in s:
                  raise SystemExit('Pages index verification hook not found')
              s = s.replace(grep_taf, grep_arch + grep_taf, 1)

          arch_content_check = "          grep -F 'PrognozaEPIR · ARCH' _site/arch.html\n"
          if arch_content_check not in s:
              s = s.replace(verify_arch, verify_arch + arch_content_check, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git diff -- .github/workflows/pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pages.yml
          if ! git diff --cached --quiet; then
            git commit -m 'fix: include ARCH in Pages deployment'
            git push origin HEAD:main
          fi

      - name: Dispatch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
