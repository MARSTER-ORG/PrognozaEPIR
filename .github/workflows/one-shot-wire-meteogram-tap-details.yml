name: One-shot wire meteogram tap details

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-wire-meteogram-tap-details.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire tap runtime into canonical Pages build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/prepare_pages.py')
          s=p.read_text(encoding='utf-8')
          old='''        "rh-axis-fix.js", "day-night-fix.js", "shortcut-mode.js",\n    ]'''
          new='''        "rh-axis-fix.js", "day-night-fix.js", "shortcut-mode.js",\n        "meteogram-tap-details.js",\n    ]'''
          if '"meteogram-tap-details.js",\n    ]' not in s:
              if old not in s: raise SystemExit('script strip list marker missing')
              s=s.replace(old,new,1)
          old='''        f'<script src="shortcut-mode.js?v={ASSET_V}"></script>',\n    ]'''
          new='''        f'<script src="shortcut-mode.js?v={ASSET_V}"></script>',\n        f'<script src="meteogram-tap-details.js?v={ASSET_V}"></script>',\n    ]'''
          if 'src="meteogram-tap-details.js?v={ASSET_V}"' not in s:
              if old not in s: raise SystemExit('addon list marker missing')
              s=s.replace(old,new,1)
          old='''        "fog-engine.js", "observation-engine.js", "mifg-engine.js",\n        "radar-risk-policy.js", "lightning-alerts.html", "lightning-alert-sw.js",\n    ]'''
          new='''        "fog-engine.js", "observation-engine.js", "mifg-engine.js",\n        "meteogram-tap-details.js",\n        "radar-risk-policy.js", "lightning-alerts.html", "lightning-alert-sw.js",\n    ]'''
          if '"meteogram-tap-details.js",\n        "radar-risk-policy.js"' not in s:
              if old not in s: raise SystemExit('required list marker missing')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check meteogram-tap-details.js
          python3 scripts/prepare_pages.py
          grep -q 'meteogram-tap-details.js?v=' _site/index.html
          grep -q 'PrognozaEPIRMeteogramSelection' _site/meteogram-tap-details.js
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-wire-meteogram-tap-details.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/prepare_pages.py .github/workflows/one-shot-wire-meteogram-tap-details.yml
          git commit -m 'meteogram: enable hourly section values on tap'
          git push origin HEAD:main
