name: Enforce synoptic UTC runtime

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_synoptic_utc_runtime.py'
      - '.github/workflows/apply-synoptic-utc-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply UTC runtime rule
        run: python3 scripts/apply_synoptic_utc_runtime.py

      - name: Validate JavaScript and UTC rule
        run: |
          node --check cloud-learning-client.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/index-inline.js').write_text(js,encoding='utf-8')
          for path in ['cloud-learning-client.js','scripts/apply_adaptive_runtime_patch.py','index.html']:
              text=Path(path).read_text(encoding='utf-8')
              assert "timeZone:'Europe/Warsaw'" not in text, path
              assert 'timeZone:"Europe/Warsaw"' not in text, path
          assert "timeZone:'UTC'" in Path('cloud-learning-client.js').read_text(encoding='utf-8')
          PY
          node --check /tmp/index-inline.js

      - name: Commit UTC runtime
        run: |
          if git diff --quiet -- cloud-learning-client.js index.html scripts/apply_adaptive_runtime_patch.py scripts/apply_synoptic_regime_upgrade.py; then
            echo 'Runtime already uses UTC.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud-learning-client.js index.html scripts/apply_adaptive_runtime_patch.py
          if test -f scripts/apply_synoptic_regime_upgrade.py; then git add scripts/apply_synoptic_regime_upgrade.py; fi
          git commit -m 'weather: use UTC in synoptic runtime classifier'
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Validate through adaptive rollout
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run adaptive-runtime-rollout.yml --repo "${{ github.repository }}" --ref main
