name: Install radar nowcast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-radar-nowcast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix nowcast source and embed in radar page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('radar-nowcast.js')
          s=p.read_text(encoding='utf-8')

          old="const grids=rasters.map(r=>gridForRaster(r,p)).filter(g=>g.active>=2||g===rasters.at(-1));return{grids};"
          new="const all=rasters.map(r=>gridForRaster(r,p));const grids=all.filter((g,i)=>g.active>=2||i===all.length-1);return{grids};"
          if old in s:
              s=s.replace(old,new,1)
          s=s.replace("async function loadModelSupport(p,etaMin,preds){", "async function loadModelSupport(p,etaMin,preds,source){")
          s=s.replace("const radarWet=Object.values(preds).some(v=>Number.isFinite(v)&&v>=27);", "const radarWet=Object.values(preds).some(v=>Number.isFinite(v)&&v>=ECHO_THRESHOLD[source]);")
          s=s.replace("function combinedLabel(conf,models,approach,preds){", "function combinedLabel(conf,models,approach,preds,source){")
          s=s.replace("const radarSignal=Object.values(preds).some(v=>Number.isFinite(v)&&v>=27)||!!approach;", "const radarSignal=Object.values(preds).some(v=>Number.isFinite(v)&&v>=ECHO_THRESHOLD[source])||!!approach;")
          s=s.replace("models=await loadModelSupport(p,eta,preds),combined=combinedLabel(conf,models,approach,preds);", "models=await loadModelSupport(p,eta,preds,source),combined=combinedLabel(conf,models,approach,preds,source);")
          s=s.replace("`${x.name} ${x.rain.toFixed(1)} mm/h`", "`${x.name} ${x.rain.toFixed(1)} mm/1h`")

          required=[
              'const all=rasters.map(r=>gridForRaster(r,p))',
              'ECHO_THRESHOLD[source]',
              'loadModelSupport(p,eta,preds,source)',
              'combinedLabel(conf,models,approach,preds,source)',
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('nowcast source patch failed: '+repr(missing))
          p.write_text(s,encoding='utf-8')

          hp=Path('radar.html')
          h=hp.read_text(encoding='utf-8')
          start='<!-- RADAR_NOWCAST_INLINE_START -->'
          end='<!-- RADAR_NOWCAST_INLINE_END -->'
          h=re.sub(re.escape(start)+r'.*?'+re.escape(end)+r'\s*','',h,flags=re.S)
          block=start+'\n<script>\n'+s+'\n</script>\n'+end+'\n'
          if '</body>' not in h:
              raise SystemExit('radar.html has no </body>')
          h=h.replace('</body>',block+'</body>',1)
          hp.write_text(h,encoding='utf-8')
          PY

          node --check radar-nowcast.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('radar.html').read_text(encoding='utf-8')
          assert s.count('RADAR_NOWCAST_INLINE_START') == 1
          block=s.split('<!-- RADAR_NOWCAST_INLINE_START -->',1)[1].split('<!-- RADAR_NOWCAST_INLINE_END -->',1)[0]
          js=block.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/radar-nowcast-inline.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/radar-nowcast-inline.js

      - name: Smoke-test live POLRAD metadata and image CORS
        run: |
          python3 - <<'PY' > /tmp/frame_url.txt
          import json, urllib.request
          u='https://meteo.imgw.pl/api/radars/v1/list/cmax'
          with urllib.request.urlopen(u,timeout=15) as r:
              j=json.load(r)
          rows=(j.get('cmax') or {}).get('list') or []
          assert len(rows)>=4, f'only {len(rows)} CMAX frames'
          print(rows[-1]['url'].replace('http://','https://'))
          PY
          FRAME_URL="$(tail -n1 /tmp/frame_url.txt)"
          curl -fsSI -H 'Origin: https://marster-org.github.io' "$FRAME_URL" >/tmp/polrad_headers.txt
          grep -Eqi '^access-control-allow-origin:[[:space:]]*(\*|https://marster-org\.github\.io)' /tmp/polrad_headers.txt
          echo "POLRAD history/image CORS: OK"

      - name: Commit nowcast source and radar page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-nowcast.js radar.html
          git commit -m 'feat: enable POLRAD radar nowcast 0-3h'
          git pull --rebase origin main
          git push origin HEAD:main
