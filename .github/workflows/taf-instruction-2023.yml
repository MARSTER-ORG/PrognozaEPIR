name: TAF Engine 2.4.2 / Instruction 11.2023 compliance

on:
  push:
    branches: [main]
    paths:
      - 'taf.html'
      - 'taf-engine-v2.js'
      - 'taf-engine-v24.js'
      - 'taf-engine-v241.js'
      - 'taf-engine-v242.js'
      - 'taf-app-v2.js'
      - 'message-archive-client.js'
      - 'tests/taf-engine-v2.test.js'
      - 'tests/taf-engine-v24.test.js'
      - 'tests/taf-engine-v241.test.js'
      - 'tests/taf-engine-v242.test.js'
      - 'data/learning/adaptive-weights.json'
      - 'data/learning/fog-event-skill.json'
      - 'data/learning/model-verification.json'
      - '.github/workflows/taf-instruction-2023.yml'
  pull_request:
    paths:
      - 'taf.html'
      - 'taf-engine-v2.js'
      - 'taf-engine-v24.js'
      - 'taf-engine-v241.js'
      - 'taf-engine-v242.js'
      - 'taf-app-v2.js'
      - 'message-archive-client.js'
      - 'tests/taf-engine-v2.test.js'
      - 'tests/taf-engine-v24.test.js'
      - 'tests/taf-engine-v241.test.js'
      - 'tests/taf-engine-v242.test.js'
      - 'data/learning/adaptive-weights.json'
      - 'data/learning/fog-event-skill.json'
      - 'data/learning/model-verification.json'
      - '.github/workflows/taf-instruction-2023.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taf-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check taf-engine-v2.js
          node --check taf-engine-v24.js
          node --check taf-engine-v241.js
          node --check taf-engine-v242.js
          node --check taf-app-v2.js
          node --check message-archive-client.js
          node --check tests/taf-engine-v2.test.js
          node --check tests/taf-engine-v24.test.js
          node --check tests/taf-engine-v241.test.js
          node --check tests/taf-engine-v242.test.js

      - name: Formal kernel regression and Instruction 11.2023 gate
        run: node tests/taf-engine-v2.test.js

      - name: TAF Engine 2.4 probabilistic calibration regression
        run: node tests/taf-engine-v24.test.js

      - name: TAF Engine 2.4.1 semantic quality regression
        run: node tests/taf-engine-v241.test.js

      - name: TAF Engine 2.4.2 low-cloud/fog coherence regression
        run: node tests/taf-engine-v242.test.js

      - name: Confirm sole public production engine stack
        run: |
          grep -F 'TAF ENGINE 2.4.2 · LOW CLOUD/FOG COHERENCE · INSTRUCTION FIRST' taf.html
          grep -F 'taf-engine-v2.js?v=2.3.0-kernel' taf.html
          grep -F 'taf-engine-v24.js?v=2.4.0' taf.html
          grep -F 'taf-engine-v241.js?v=2.4.1-audit' taf.html
          grep -F 'taf-engine-v242.js?v=2.4.2-cloud-fog' taf.html
          grep -F 'taf-app-v2.js?v=2.4.0-ui' taf.html
          grep -F "const VERSION='2.4.2'" taf-engine-v242.js
          grep -F 'lowCloudFogCoherence:true' taf-engine-v242.js
          ! grep -E 'taf-(hybrid-engine|hybrid-adapter|generator-policy|cloud-policy|weather-policy|gust-policy|cavok-nsc-policy|instruction-guard|output-sanitizer)\.js' taf.html
