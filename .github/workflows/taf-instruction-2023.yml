name: TAF Engine 2.3 / Instruction 11.2023 compliance

on:
  push:
    branches: [main]
    paths:
      - 'taf.html'
      - 'taf-engine-v2.js'
      - 'taf-app-v2.js'
      - 'message-archive-client.js'
      - 'tests/taf-engine-v2.test.js'
      - '.github/workflows/taf-instruction-2023.yml'
  pull_request:
    paths:
      - 'taf.html'
      - 'taf-engine-v2.js'
      - 'taf-app-v2.js'
      - 'message-archive-client.js'
      - 'tests/taf-engine-v2.test.js'
      - '.github/workflows/taf-instruction-2023.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taf-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          node --check taf-engine-v2.js
          node --check taf-app-v2.js
          node --check message-archive-client.js
          node --check tests/taf-engine-v2.test.js

      - name: TAF Engine 2.3 regression and Instruction 11.2023 gate
        run: node tests/taf-engine-v2.test.js

      - name: Confirm sole production engine
        run: |
          grep -F 'TAF ENGINE 2.3.0 · INSTRUCTION FIRST' taf.html
          grep -F 'taf-engine-v2.js?v=2.3.0' taf.html
          grep -F 'taf-app-v2.js?v=2.3.0' taf.html
          ! grep -E 'taf-(hybrid-engine|hybrid-adapter|generator-policy|cloud-policy|weather-policy|gust-policy|cavok-nsc-policy|instruction-guard|output-sanitizer)\.js' taf.html
