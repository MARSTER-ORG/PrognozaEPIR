name: Patch OPERA georeferencing

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-opera-georef.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply OPERA georeferencing patch
        run: python3 scripts/patch-opera-georef.py
      - name: Validate
        run: |
          node --check opera-nowcast.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('opera-nowcast.js').read_text(encoding='utf-8')
          for t in ['WEB_MERCATOR_R','reprojectForLeaflet','projectedBounds:{x0:wx0','operaRenderCache','latest.display?.geoBounds']:
              assert t in s,t
          print('OPERA georeferencing validation OK')
          PY
      - name: Commit final fix
        run: |
          rm -f .github/workflows/patch-opera-georef.yml scripts/patch-opera-georef.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opera-nowcast.js .github/workflows/patch-opera-georef.yml scripts/patch-opera-georef.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reproject OPERA radar layer for Leaflet alignment'
          git push origin main
