name: Publish ARCH overlay to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-arch-overlay.yml'
  workflow_run:
    workflows: ["Deploy PrognozaEPIR to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-arch-overlay
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Make ARCH permanent in main Pages artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/pages.yml')
          s = p.read_text(encoding='utf-8')

          old_copy = '          cp index.html radar.html taf.html sat-fog.html epir-icon.svg epir-icon-192.png epir-icon-512.png \\\n'
          new_copy = '          cp index.html radar.html taf.html sat-fog.html arch.html epir-icon.svg epir-icon-192.png epir-icon-512.png \\\n'
          if old_copy in s:
              s = s.replace(old_copy, new_copy, 1)
          elif 'cp index.html radar.html taf.html sat-fog.html arch.html ' not in s:
              raise SystemExit('Pages copy list hook not found')

          old_test = '          test -s _site/sat-fog.html\n'
          new_test = old_test + '          test -s _site/arch.html\n'
          if '          test -s _site/arch.html\n' not in s:
              if old_test not in s:
                  raise SystemExit('Pages ARCH test hook not found')
              s = s.replace(old_test, new_test, 1)

          old_link_check = '          grep -F \'<a class="control-link" href="sat-fog.html">SAT / FOG EUMETSAT</a>\' _site/index.html\n'
          new_link_check = old_link_check + '          grep -F \'<a class="control-link" href="arch.html">ARCH</a>\' _site/index.html\n          grep -F \'PrognozaEPIR · ARCH\' _site/arch.html\n'
          if "grep -F 'PrognozaEPIR · ARCH' _site/arch.html" not in s:
              if old_link_check not in s:
                  raise SystemExit('Pages ARCH marker hook not found')
              s = s.replace(old_link_check, new_link_check, 1)

          p.write_text(s, encoding='utf-8')
          PY

          if git diff --quiet -- .github/workflows/pages.yml; then
            echo 'pages.yml already contains ARCH permanently'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/pages.yml
            git commit -m 'fix: publish arch.html in main Pages workflow'
            if ! git push origin HEAD:main; then
              echo '::warning::Could not persist pages.yml automatically; ARCH overlay will still be deployed in this run.'
            fi
          fi

      - name: Resolve source Pages run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh run list --workflow pages.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download last good Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _pages_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Add ARCH page
        run: |
          set -euo pipefail
          mkdir -p _site
          TAR_FILE="$(find _pages_artifact -maxdepth 2 -type f -name '*.tar' -print -quit)"
          test -n "$TAR_FILE"
          tar -xf "$TAR_FILE" -C _site
          cp arch.html _site/arch.html
          test -s _site/index.html
          test -s _site/arch.html
          grep -F '<a class="control-link" href="arch.html">ARCH</a>' _site/index.html
          grep -F 'PrognozaEPIR · ARCH' _site/arch.html

      - name: Upload patched Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy patched Pages site
        id: deployment
        uses: actions/deploy-pages@v4
