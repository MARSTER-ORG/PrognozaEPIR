name: Restore meteogram bottom section table

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revert-meteogram-popover.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove section popover overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fog-meteogram-overlay.js')
          s = p.read_text(encoding='utf-8')
          marker = '// --- EPIR METEOGRAM SECTION POPOVER EMBEDDED ---'
          if marker not in s:
              raise SystemExit('Popover marker not found; refusing to alter unrelated code')
          s = s.split(marker, 1)[0].rstrip() + '\n'
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate restored overlay
        run: |
          node --check fog-meteogram-overlay.js
          if grep -Fq 'epir-section-info-source-hidden' fog-meteogram-overlay.js; then
            echo 'Legacy section table is still being hidden'
            exit 1
          fi
          if grep -Fq 'meteogramSectionPopover' fog-meteogram-overlay.js; then
            echo 'Popover code is still present'
            exit 1
          fi

      - name: Commit restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fog-meteogram-overlay.js
          git commit -m 'revert: restore meteogram section values below chart'
          git pull --rebase origin main
          git push origin HEAD:main
