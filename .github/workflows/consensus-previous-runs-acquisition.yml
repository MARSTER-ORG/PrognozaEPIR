name: CONSENSUS previous-runs acquisition

on:
  push:
    branches: [consensus-data-backfill-20260916]
    paths:
      - 'scripts/backfill_previous_runs_history.py'
      - '.github/workflows/consensus-previous-runs-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: consensus-data-backfill-20260916

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consensus-data-backfill-20260916
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate acquisition code
        run: python3 -m py_compile scripts/backfill_previous_runs_history.py

      - name: Probe January 2024 for all configured models
        run: |
          python3 scripts/backfill_previous_runs_history.py \
            --start 2024-01-01 \
            --end 2024-01-31 \
            --workers 4

      - name: Report archived coverage
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          state=json.loads(Path('data/learning/previous-runs-backfill-state.json').read_text(encoding='utf-8'))
          p=Path('data/learning/model-forecasts/previous-runs-2024-01.jsonl')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          models=Counter(r.get('model') for r in rows)
          leads=Counter(int(r.get('lead_hours') or 0) for r in rows)
          print('rows',len(rows))
          print('models',dict(models))
          print('leads',dict(leads))
          print('requests',state['requests_successful'],'success',state['requests_failed'],'failed')
          print('failures',json.dumps(state.get('failures') or [],ensure_ascii=False))
          assert len(rows) >= 50
          assert len(models) >= 1
          assert leads[24] > 0 and leads[48] > 0
          PY

      - name: Commit probe data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/learning/model-forecasts/previous-runs-2024-01.jsonl data/learning/previous-runs-backfill-state.json
          if git diff --cached --quiet; then
            echo 'No new historical data'
            exit 0
          fi
          git commit -m 'weather: probe January 2024 consensus model history'
          for attempt in 1 2 3; do
            git pull --rebase origin ${BRANCH} && git push origin HEAD:${BRANCH} && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
