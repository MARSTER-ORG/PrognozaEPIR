name: CONSENSUS previous-runs acquisition

on:
  push:
    branches: [consensus-data-backfill-20260916]
    paths:
      - 'scripts/backfill_previous_runs_history.py'
      - '.github/workflows/consensus-previous-runs-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: consensus-data-backfill-20260916

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consensus-data-backfill-20260916
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate acquisition code
        run: python3 -m py_compile scripts/backfill_previous_runs_history.py

      - name: Acquire GFS January 2024 fixed-lead history
        run: |
          python3 scripts/backfill_previous_runs_history.py \
            --start 2024-01-01 \
            --end 2024-01-31 \
            --workers 1 \
            --models ncep_gfs_global

      - name: Validate acquired archive
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p=Path('data/learning/model-forecasts/previous-runs-2024-01.jsonl')
          assert p.exists()
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          leads=Counter(int(r.get('lead_hours') or 0) for r in rows)
          print('rows', len(rows))
          print('leads', dict(leads))
          print('first', json.dumps(rows[0], ensure_ascii=False))
          assert len(rows) >= 20
          assert all(r.get('model')=='ncep_gfs_global' for r in rows)
          assert leads[24] > 0 and leads[48] > 0
          assert all(r.get('archive_source')=='open-meteo-previous-runs' for r in rows)
          PY

      - name: Commit acquired history to acquisition branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/learning/model-forecasts/previous-runs-2024-01.jsonl data/learning/previous-runs-backfill-state.json
          if git diff --cached --quiet; then
            echo 'No new historical data'
            exit 0
          fi
          git commit -m 'weather: acquire GFS January 2024 consensus history'
          git push origin HEAD:${BRANCH}
