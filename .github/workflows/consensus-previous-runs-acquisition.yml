name: CONSENSUS previous-runs acquisition

on:
  push:
    branches: [consensus-data-backfill-20260916]
    paths:
      - 'scripts/backfill_previous_runs_history.py'
      - '.github/workflows/consensus-previous-runs-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: consensus-data-backfill-20260916

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consensus-data-backfill-20260916
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate acquisition code
        run: python3 -m py_compile scripts/backfill_previous_runs_history.py

      - name: Acquire validated model history 2024-2026
        run: |
          python3 scripts/backfill_previous_runs_history.py \
            --start 2024-01-01 \
            --end 2026-05-31 \
            --workers 4 \
            --models ncep_gfs_global,icon_eu,icon_global,icon_d2,meteofrance_arpege_europe,cmc_gem_gdps

      - name: Validate acquired archive
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          state=json.loads(Path('data/learning/previous-runs-backfill-state.json').read_text(encoding='utf-8'))
          rows=0; models=Counter(); leads=Counter(); months=0
          for p in sorted(Path('data/learning/model-forecasts').glob('previous-runs-*.jsonl')):
              months += 1
              for line in p.read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  r=json.loads(line); rows += 1
                  models[r.get('model')] += 1
                  leads[int(r.get('lead_hours') or 0)] += 1
                  assert r.get('archive_source') == 'open-meteo-previous-runs'
                  assert r.get('archive_fixed_lead') is True
          print('rows', rows)
          print('months', months)
          print('models', dict(models))
          print('leads', dict(leads))
          print('requests', state['requests_successful'], 'success', state['requests_failed'], 'failed')
          print('failures', json.dumps(state.get('failures') or [], ensure_ascii=False))
          assert rows >= 5000, f'too few rows: {rows}'
          assert len(models) >= 5, f'too few models: {len(models)}'
          assert months >= 24, f'too few months: {months}'
          assert leads[24] > 500 and leads[48] > 500 and leads[72] > 500
          PY

      - name: Package acquired data
        run: |
          mkdir -p _artifact
          cp data/learning/previous-runs-backfill-state.json _artifact/
          cp data/learning/model-forecasts/previous-runs-*.jsonl _artifact/
          tar -czf consensus-previous-runs-2024-2026.tar.gz -C _artifact .

      - uses: actions/upload-artifact@v4
        with:
          name: consensus-previous-runs-2024-2026
          path: consensus-previous-runs-2024-2026.tar.gz
          retention-days: 2

      - name: Commit acquired history to acquisition branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/learning/model-forecasts/previous-runs-*.jsonl data/learning/previous-runs-backfill-state.json
          if git diff --cached --quiet; then
            echo 'No new historical data'
            exit 0
          fi
          git commit -m 'weather: acquire consensus fixed-lead history 2024-2026'
          for attempt in 1 2 3 4 5; do
            git fetch origin ${BRANCH}
            if git rebase origin/${BRANCH} && git push origin HEAD:${BRANCH}; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
