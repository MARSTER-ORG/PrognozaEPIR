name: EPIR Observations Watchdog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/observation-watchdog.yml'
  schedule:
    # Recovery clock: poll every 5 minutes. This deliberately uses the simplest
    # GitHub cron form and dispatches the armored collector independently from
    # the primary heartbeat schedule.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch armored observation heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run metar-heartbeat.yml --repo "${{ github.repository }}" --ref main
          echo "Armored observation heartbeat dispatched"
