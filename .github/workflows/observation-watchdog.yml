name: EPIR Observations Watchdog

on:
  schedule:
    # Independent clock from the primary heartbeat. If GitHub skips/delays one
    # schedule family, this second workflow dispatches the armored collector.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch armored observation heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run metar-heartbeat.yml --repo "${{ github.repository }}" --ref main
          echo "Armored observation heartbeat dispatched"
