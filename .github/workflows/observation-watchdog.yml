name: Central aviation archive watchdog
on:
  schedule:
    - cron: '11-51/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [aviation_tick]
permissions:
  contents: read
  actions: write
concurrency:
  group: prognozaepir-aviation-watchdog
  cancel-in-progress: true
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the single central ingestor
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run message-archive.yml --repo "${{ github.repository }}" --ref main
