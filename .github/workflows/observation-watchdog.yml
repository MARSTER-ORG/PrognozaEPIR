name: EPIR Observations Watchdog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/observation-watchdog.yml'
  schedule:
    # Second clock, halfway between the primary collector slots. It dispatches
    # the armored collector if the primary GitHub schedule is skipped/delayed.
    - cron: '14,29,44,59 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch armored observation heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run metar-heartbeat.yml --repo "${{ github.repository }}" --ref main
          echo "Armored observation heartbeat dispatched"
