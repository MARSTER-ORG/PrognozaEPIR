name: Aviation archive watchdog
on:
  schedule:
    # Backup clock, deliberately away from the top-of-hour load window.
    - cron: '11-51/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [aviation_tick]
permissions:
  contents: read
  actions: write
concurrency:
  group: prognozaepir-aviation-watchdog
  cancel-in-progress: true
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger independent aviation collectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run metar-heartbeat.yml --repo "${{ github.repository }}" --ref main
          gh workflow run taf-heartbeat.yml --repo "${{ github.repository }}" --ref main
