name: EPIR Observations Watchdog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/observation-watchdog.yml'
  schedule:
    # Independent clock from the primary heartbeat. It is deliberately
    # staggered away from the TAF cache schedule and dispatches the armored
    # collector if the primary GitHub schedule is skipped or delayed.
    - cron: '6,16,26,36,46,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch armored observation heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run metar-heartbeat.yml --repo "${{ github.repository }}" --ref main
          echo "Armored observation heartbeat dispatched"
