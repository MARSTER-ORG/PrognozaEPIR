name: Deploy PrognozaEPIR to GitHub Pages v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Reuse production site preparation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/pages.yml').read_text(encoding='utf-8')
          start_marker='      - name: Prepare site\n        run: |\n'
          end_marker='\n      - name: Validate JavaScript\n'
          start=src.find(start_marker)
          end=src.find(end_marker,start+1)
          if start<0 or end<0:
              raise SystemExit('Nie znaleziono kroku Prepare site w pages.yml')
          block=src[start+len(start_marker):end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/prepare-site.sh').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          bash /tmp/prepare-site.sh
          cp neighbor-observation-context.js _site/

      - name: Install TAF Engine 2.3 production artifact
        shell: bash
        run: |
          cp taf-engine-v2.js taf-app-v2.js _site/
          python3 - <<'PY'
          from pathlib import Path
          import re, os

          p=Path('_site/taf.html')
          s=p.read_text(encoding='utf-8')
          marker='<meta name="prognozaepir-taf-engine-v2" content="2.3.0">'
          if 'prognozaepir-taf-engine-v2' not in s:
              s=s.replace('<meta name="color-scheme" content="dark">', '<meta name="color-scheme" content="dark">\n  '+marker, 1)
          else:
              s=re.sub(r'<meta name="prognozaepir-taf-engine-v2" content="[^"]+">',marker,s,count=1)
          s=re.sub(r'src="index\.html(?:\?v=[^"]*)?"', f'src="index.html?v={os.environ.get("GITHUB_SHA","dev")[:12]}"', s, count=1)
          s=s.replace('taf-engine-v2.js?v=2.2.0','taf-engine-v2.js?v=2.3.0')
          s=s.replace('taf-app-v2.js?v=2.2.0','taf-app-v2.js?v=2.3.0')
          p.write_text(s,encoding='utf-8')

          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'href="taf\.html(?:\?v=[^"]*)?">GENERATOR TAF</a>', 'href="taf.html?v=2.3.0">GENERATOR TAF</a>', s, count=1)
          p.write_text(s,encoding='utf-8')

          # Engine 2 pages must be source-guarded against the legacy hybrid/mutator stack.
          p=Path('_site/message-archive-client.js')
          s=p.read_text(encoding='utf-8')
          if 'if(!document.querySelector(\'meta[name="prognozaepir-taf-engine-v2"]\'))' not in s and 'if(!document.querySelector(\'meta[name=\\"prognozaepir-taf-engine-v2\\"]\'))' not in s and 'prognozaepir-taf-engine-v2' not in s:
              raise SystemExit('Brak source guard dla legacy TAF runtime')
          p.write_text(s,encoding='utf-8')

          p=Path('_site/taf-app-v2.js')
          s=p.read_text(encoding='utf-8')
          if 'fogUntil=Date.now()+15000' not in s:
              raise SystemExit('TAF 2.3 nie czeka na kompletną serię FOG Engine')
          if 'const fgRisk=Math.max(fogScore' not in s or 'brRisk' not in s:
              raise SystemExit('Brak pełnego mostu FOG Engine -> TAF Engine')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate instruction-first TAF deployment
        run: |
          node --check taf-engine-v2.js
          node --check taf-app-v2.js
          node --check neighbor-observation-context.js
          node --check _site/taf-engine-v2.js
          node --check _site/taf-app-v2.js
          node --check _site/message-archive-client.js
          node --check _site/neighbor-observation-context.js
          node tests/taf-engine-v2.test.js
          test -s _site/taf.html
          test -s _site/taf-engine-v2.js
          test -s _site/taf-app-v2.js
          test -s _site/neighbor-observation-context.js
          grep -F 'TAF ENGINE 2.3.0 · INSTRUCTION FIRST' _site/taf.html
          grep -F 'Chmury (m AGL)' _site/taf.html
          grep -F 'Pułap BKN/OVC (m AGL)' _site/taf.html
          grep -F 'taf-engine-v2.js?v=2.3.0' _site/taf.html
          grep -F 'taf-app-v2.js?v=2.3.0' _site/taf.html
          grep -F 'prognozaepir-taf-engine-v2' _site/taf.html
          grep -F 'prognozaepir-taf-engine-v2' _site/message-archive-client.js
          grep -F 'fogUntil=Date.now()+15000' _site/taf-app-v2.js
          grep -F 'const fgRisk=Math.max(fogScore' _site/taf-app-v2.js
          grep -F 'FOG is an independent input' _site/taf-engine-v2.js
          grep -F 'cloudCandidateCredible' _site/taf-engine-v2.js
          grep -F 'lowWindWholePeriodMinFraction:.75' _site/taf-engine-v2.js
          grep -F 'neighbor-observation-context.js?v=neighbor-obs-v4' _site/index.html
          grep -F 'offset:-30' _site/index.html
          ! grep -F ' · surowy ' _site/index.html
          ! grep -F ' · korekta ' _site/index.html
          ! grep -F '<script src="taf-hybrid-adapter.js' _site/taf.html
          ! grep -F '<script src="taf-instruction-guard.js' _site/taf.html
          ! grep -F '<script src="taf-generator-policy.js' _site/taf.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
