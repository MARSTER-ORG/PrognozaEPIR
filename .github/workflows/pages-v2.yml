name: Deploy PrognozaEPIR to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare canonical site
        run: |
          python3 scripts/prepare_pages_v241.py
          python3 scripts/wire_fog_mifg_utc_runtime.py
          printf '{"commit":"%s","built_at":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/pages-build.json

      - name: Validate JavaScript and TAF 2.4.1
        run: |
          python3 -m py_compile scripts/prepare_pages.py scripts/prepare_pages_v241.py scripts/wire_fog_mifg_utc_runtime.py
          for f in \
            taf-engine-v2.js taf-engine-v24.js taf-engine-v241.js taf-app-v2.js message-archive-client.js neighbor-observation-context.js \
            fog-engine.js observation-engine.js mifg-engine.js fog-meteogram-overlay.js \
            fog-summary-layout.js fog-physics-vnext.js fog-vnext-probability-layer.js fog-vnext-transition-risk.js \
            radar-risk-policy.js lightning-alert-sw.js opera-nowcast.js opera-convection-bridge.js \
            _site/taf-engine-v2.js _site/taf-engine-v24.js _site/taf-engine-v241.js _site/taf-app-v2.js _site/message-archive-client.js \
            _site/fog-engine.js _site/observation-engine.js _site/mifg-engine.js \
            _site/fog-summary-layout.js _site/fog-physics-vnext.js _site/fog-vnext-probability-layer.js _site/fog-vnext-transition-risk.js \
            _site/radar-risk-policy.js _site/lightning-alert-sw.js; do
            node --check "$f"
          done
          node tests/taf-engine-v2.test.js
          node tests/taf-engine-v24.test.js
          node tests/taf-engine-v241.test.js
          node tests/fog-vnext-production.test.js

      - name: Validate canonical artifact
        run: |
          test -s _site/index.html
          test -s _site/radar.html
          test -s _site/taf.html
          test -s _site/taf-engine-v24.js
          test -s _site/taf-engine-v241.js
          test -s _site/sat-fog.html
          test -s _site/arch.html
          test -s _site/lightning-alerts.html
          test -s _site/lightning-alert-sw.js
          test -s _site/radar-risk-policy.js
          test -s _site/fog-summary-layout.js
          test -s _site/fog-physics-vnext.js
          test -s _site/fog-vnext-probability-layer.js
          test -s _site/fog-vnext-transition-risk.js
          test -s _site/pages-build.json
          test -s _site/data/messages/latest.json
          test -s _site/data/messages/recent.json
          test -s _site/data/messages/status.json
          test -s _site/data/learning/adaptive-weights.json
          test -s _site/data/learning/fog-event-skill.json
          test -s _site/data/learning/model-verification.json
          python3 -m json.tool _site/pages-build.json >/dev/null
          python3 -m json.tool _site/data/messages/latest.json >/dev/null
          python3 -m json.tool _site/data/messages/recent.json >/dev/null
          python3 -m json.tool _site/data/messages/status.json >/dev/null
          python3 -m json.tool _site/data/learning/adaptive-weights.json >/dev/null
          python3 -m json.tool _site/data/learning/fog-event-skill.json >/dev/null
          python3 -m json.tool _site/data/learning/model-verification.json >/dev/null
          grep -F 'TAF ENGINE 2.4.1 · SEMANTIC QUALITY · INSTRUCTION FIRST' _site/taf.html
          grep -F 'taf-engine-v2.js?v=2.3.0-kernel' _site/taf.html
          grep -F 'taf-engine-v24.js?v=2.4.0' _site/taf.html
          grep -F 'taf-engine-v241.js?v=2.4.1-audit' _site/taf.html
          grep -F 'taf-app-v2.js?v=2.4.0-ui' _site/taf.html
          grep -F 'content="2.4.1"' _site/taf.html
          grep -F "const VERSION='2.4.0'" _site/taf-engine-v24.js
          grep -F "const VERSION='2.4.1'" _site/taf-engine-v241.js
          grep -F 'structuredFinalization:true' _site/taf-engine-v241.js
          grep -F 'radar-risk-policy.js?v=' _site/radar.html
          grep -F 'lightning-alerts.html' _site/radar.html
          grep -F 'observation-engine.js' _site/index.html
          grep -F 'mifg-engine.js?v=' _site/index.html
          grep -F 'fog-meteogram-overlay.js' _site/index.html
          grep -F 'fog-summary-layout.js?v=' _site/index.html
          grep -F "fogEngineMode:'vnext-production'" _site/fog-summary-layout.js
          grep -F 'Probability.operationalScore' _site/fog-summary-layout.js
          grep -F "const VERSION='1.0.0-production'" _site/fog-vnext-probability-layer.js
          grep -F 'P_model_final' _site/fog-vnext-probability-layer.js
          grep -F 'functions/v1/message-archive' _site/message-archive-client.js
          grep -F 'search,stations' _site/message-archive-client.js
          grep -F 'MessageArchive legacy bridge' _site/message-archive-client.js
          grep -F 'message-archive-client.js?v=' _site/arch.html
          grep -F 'id="modeAdvanced"' _site/arch.html
          grep -F 'data-type="ALL"' _site/arch.html
          grep -F 'TAF ↔ METAR/SPECI' _site/arch.html
          grep -F "v+'Z'" _site/fog-engine.js
          grep -F "+' UTC'" _site/fog-engine.js
          grep -F "+' UTC'" _site/mifg-engine.js
          ! grep -F 'message-archive-fetch-bridge.js' _site/index.html
          ! test -e _site/message-archive-fetch-bridge.js
          ! grep -F 'taf-instruction-guard.js' _site/message-archive-client.js
          ! grep -F 'taf-verification-explain.js' _site/message-archive-client.js
          ! grep -F 'timeZone:PLACE.tz' _site/fog-engine.js
          ! grep -F 'timeZone:PLACE.tz' _site/mifg-engine.js
          ! grep -F '<script src="fog-engine.js' _site/index.html
          ! grep -F 'taf-hybrid-engine.js' _site/taf.html
          ! grep -F 'taf-hybrid-adapter.js' _site/taf.html
          ! grep -F 'taf-generator-policy.js' _site/taf.html
          ! grep -F 'taf-instruction-guard.js' _site/taf.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live revision, Fog vNext and ARCH UI
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 18); do
            marker="$(curl -fsSL --max-time 15 "${base}/pages-build.json?v=${GITHUB_SHA}" 2>/dev/null || true)"
            index="$(curl -fsSL --max-time 15 "${base}/index.html?v=${GITHUB_SHA}" 2>/dev/null || true)"
            taf="$(curl -fsSL --max-time 15 "${base}/taf.html?v=${GITHUB_SHA}" 2>/dev/null || true)"
            bridge="$(curl -fsSL --max-time 15 "${base}/fog-summary-layout.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            arch="$(curl -fsSL --max-time 15 "${base}/arch.html?v=${GITHUB_SHA}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -Fq "$GITHUB_SHA" \
              && printf '%s' "$index" | grep -Fq 'fog-summary-layout.js?v=' \
              && printf '%s' "$taf" | grep -Fq 'taf-engine-v241.js?v=2.4.1-audit' \
              && printf '%s' "$bridge" | grep -Fq "fogEngineMode:'vnext-production'" \
              && printf '%s' "$bridge" | grep -Fq 'Probability.operationalScore' \
              && printf '%s' "$arch" | grep -Fq 'id="modeAdvanced"' \
              && printf '%s' "$arch" | grep -Fq 'message-archive-client.js?v='; then
              echo "GitHub Pages serves commit $GITHUB_SHA with TAF 2.4.1, Fog vNext production and the advanced ARCH UI."
              exit 0
            fi
            echo "Waiting for Pages/CDN propagation (${attempt}/18)..."
            sleep 10
          done
          echo "ERROR: live GitHub Pages is not serving the deployed revision, TAF 2.4.1, Fog vNext production bridge, or advanced ARCH UI." >&2
          exit 1
