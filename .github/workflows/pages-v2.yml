name: Deploy PrognozaEPIR to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare canonical site
        run: |
          python3 scripts/prepare_pages_v241.py
          python3 scripts/wire_fog_mifg_utc_runtime.py
          printf '{"commit":"%s","built_at":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > _site/pages-build.json

      - name: Validate JavaScript and runtime tests
        run: |
          python3 -m py_compile scripts/prepare_pages.py scripts/prepare_pages_v241.py scripts/wire_fog_mifg_utc_runtime.py
          for f in \
            theme.js taf-engine-v2.js taf-engine-v24.js taf-engine-v241.js taf-engine-v242.js taf-engine-v243.js taf-fog-policy.js taf-app-v25.js taf-runtime-bootstrap.js \
            message-archive-client.js neighbor-observation-context.js fog-engine.js observation-engine.js mifg-engine.js br-engine.js fog-index-bridge.js fog-meteogram-overlay.js \
            fog-mode-switch.js fog-summary-layout.js fog-page-layout.js fog-visibility-cells.js fog-physics-vnext.js fog-vnext-probability-layer.js fog-vnext-transition-risk.js \
            radar-risk-policy.js lightning-alert-sw.js opera-nowcast.js opera-convection-bridge.js \
            _site/theme.js _site/taf-engine-v2.js _site/taf-engine-v24.js _site/taf-engine-v241.js _site/taf-engine-v242.js _site/taf-engine-v243.js _site/taf-fog-policy.js _site/taf-app-v25.js _site/taf-runtime-bootstrap.js \
            _site/fog-engine.js _site/observation-engine.js _site/mifg-engine.js _site/br-engine.js _site/fog-index-bridge.js _site/fog-meteogram-overlay.js _site/fog-mode-switch.js _site/fog-summary-layout.js _site/fog-page-layout.js _site/fog-visibility-cells.js \
            _site/fog-physics-vnext.js _site/fog-vnext-probability-layer.js _site/fog-vnext-transition-risk.js _site/radar-risk-policy.js _site/lightning-alert-sw.js; do
            node --check "$f"
          done
          node tests/taf-engine-v2.test.js
          node tests/taf-engine-v24.test.js
          node tests/taf-engine-v241.test.js
          node tests/taf-engine-v242.test.js
          node tests/taf-engine-v243.test.js
          node tests/fog-vnext-production.test.js
          node tests/br-engine.test.js
          node tests/runtime-integration-contract.test.js

      - name: Validate canonical artifact
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          site = Path('_site')
          required = [
              'index.html','fog.html','radar.html','taf.html','sat-fog.html','arch.html','theme.js','app.css',
              'taf-engine-v2.js','taf-engine-v24.js','taf-engine-v241.js','taf-engine-v242.js','taf-engine-v243.js','taf-fog-policy.js','taf-app-v25.js','taf-runtime-bootstrap.js',
              'fog-engine.js','mifg-engine.js','br-engine.js','fog-index-bridge.js','fog-meteogram-overlay.js','fog-mode-switch.js','fog-summary-layout.js','fog-page-layout.js','fog-visibility-cells.js',
              'fog-physics-vnext.js','fog-vnext-probability-layer.js','fog-vnext-transition-risk.js','radar-risk-policy.js','lightning-alert-sw.js',
              'pages-build.json','data/messages/latest.json','data/messages/recent.json','data/messages/status.json',
              'data/learning/adaptive-weights.json','data/learning/fog-event-skill.json','data/learning/model-verification.json'
          ]
          missing = [p for p in required if not (site / p).is_file() or (site / p).stat().st_size == 0]
          if missing:
              raise SystemExit(f'missing Pages assets: {missing}')

          for p in ['pages-build.json','data/messages/latest.json','data/messages/recent.json','data/messages/status.json','data/learning/adaptive-weights.json','data/learning/fog-event-skill.json','data/learning/model-verification.json']:
              json.loads((site / p).read_text(encoding='utf-8'))

          index = (site / 'index.html').read_text(encoding='utf-8')
          fog = (site / 'fog.html').read_text(encoding='utf-8')
          fog_engine = (site / 'fog-engine.js').read_text(encoding='utf-8')
          taf = (site / 'taf.html').read_text(encoding='utf-8')
          taf_app = (site / 'taf-app-v25.js').read_text(encoding='utf-8')
          taf_bootstrap = (site / 'taf-runtime-bootstrap.js').read_text(encoding='utf-8')

          for marker in ['taf.html?v=2.4.3','theme.js?v=','app.css?v=','fog-index-bridge.js?v=','fog-meteogram-overlay.js?v=','utc-ui-guard.js?v=']:
              if marker not in index: raise SystemExit(f'index contract missing: {marker}')
          for asset in ['fog-engine.js','observation-engine.js','mifg-engine.js','br-engine.js','fog-summary-layout.js','fog-mode-switch.js']:
              if re.search(rf'<script\s+src=["\']{re.escape(asset)}(?:\?[^"\']*)?["\']', index, re.I):
                  raise SystemExit(f'duplicate Fog runtime leaked into index: {asset}')
          if 'theme-control.js' in index:
              raise SystemExit('legacy theme-control.js leaked into index artifact')
          for marker in ['id="epirGlobalNav"','id="fogStandaloneMount"','fog-mode-switch.js?v=','fog-engine.js?v=','mifg-engine.js?v=','fog-summary-layout.js?v=','br-engine.js?v=','fog-page-layout.js?v=','fog-visibility-cells.js?v=','theme.js?v=','app.css?v=']:
              if marker not in fog: raise SystemExit(f'native fog page contract missing: {marker}')
          if 'theme-control.js' in fog:
              raise SystemExit('legacy theme-control.js leaked into fog artifact')
          for marker in ['<iframe','fogRuntime','index.html?fogpanel=','<canvas','canvasViewport','MutationObserver','ResizeObserver','epir-pages-compat-','observation-engine.js','fog-meteogram-overlay.js','shortcut-mode.js']:
              if marker in fog: raise SystemExit(f'forbidden meteogram/dead marker in fog.html: {marker}')
          if 'PrognozaEPIRFogLegacySeries' not in fog_engine:
              raise SystemExit('LEGACY Fog series export missing')
          for marker in ['TAF ENGINE 2.4.3 ·','taf-engine-v242.js?v=2.4.2-cloud-fog','taf-runtime-bootstrap.js?v=20260919-1']:
              if marker not in taf: raise SystemExit(f'TAF contract missing: {marker}')
          for marker in ['taf-engine-v243.js?v=${BUILD}', "QUALITY_VERSION !== ENGINE_LABEL"]:
              if marker not in taf_bootstrap: raise SystemExit(f'TAF 2.4.3 bootstrap contract missing: {marker}')
          for marker in ['const mode=Policy.selectedMode(w)','Policy.seriesForMode(w,mode)','Fog Engine LEGACY nie udostępnił kompletnej serii']:
              if marker not in taf_app: raise SystemExit(f'TAF selected Fog mode contract missing: {marker}')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live native Fog page and TAF startup
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 18); do
            marker="$(curl -fsSL --max-time 15 "${base}/pages-build.json?v=${GITHUB_SHA}" 2>/dev/null || true)"
            index="$(curl -fsSL --max-time 15 "${base}/index.html?v=${GITHUB_SHA}" 2>/dev/null || true)"
            fog="$(curl -fsSL --max-time 15 "${base}/fog.html?v=${GITHUB_SHA}" 2>/dev/null || true)"
            theme="$(curl -fsSL --max-time 15 "${base}/theme.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            css="$(curl -fsSL --max-time 15 "${base}/app.css?v=${GITHUB_SHA}" 2>/dev/null || true)"
            fogengine="$(curl -fsSL --max-time 15 "${base}/fog-engine.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            taf="$(curl -fsSL --max-time 15 "${base}/taf.html?v=${GITHUB_SHA}" 2>/dev/null || true)"
            tafbootstrap="$(curl -fsSL --max-time 15 "${base}/taf-runtime-bootstrap.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            taf243="$(curl -fsSL --max-time 15 "${base}/taf-engine-v243.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            tafapp="$(curl -fsSL --max-time 15 "${base}/taf-app-v25.js?v=${GITHUB_SHA}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -Fq "$GITHUB_SHA" \
              && printf '%s' "$index" | grep -Fq 'fog-index-bridge.js?v=' \
              && printf '%s' "$index" | grep -Fq 'fog-meteogram-overlay.js?v=' \
              && printf '%s' "$fog" | grep -Fq 'id="epirGlobalNav"' \
              && printf '%s' "$fog" | grep -Fq 'id="fogStandaloneMount"' \
              && printf '%s' "$fog" | grep -Fq 'theme.js?v=' \
              && printf '%s' "$fog" | grep -Fq 'app.css?v=' \
              && ! printf '%s' "$fog" | grep -Fq 'theme-control.js' \
              && printf '%s' "$theme" | grep -Fq 'prognozaepir.theme.preference' \
              && printf '%s' "$css" | grep -Fq 'EPIR-SHARED-START' \
              && printf '%s' "$fog" | grep -Fq 'fog-engine.js?v=' \
              && printf '%s' "$fog" | grep -Fq 'fog-visibility-cells.js?v=' \
              && ! printf '%s' "$fog" | grep -Fq '<iframe' \
              && ! printf '%s' "$fog" | grep -Fq 'index.html?fogpanel=' \
              && ! printf '%s' "$fog" | grep -Fq 'fogRuntime' \
              && printf '%s' "$fogengine" | grep -Fq 'PrognozaEPIRFogLegacySeries' \
              && printf '%s' "$taf" | grep -Fq 'TAF ENGINE 2.4.3 ·' \
              && printf '%s' "$taf" | grep -Fq 'taf-engine-v242.js?v=2.4.2-cloud-fog' \
              && printf '%s' "$tafbootstrap" | grep -Fq 'taf-engine-v243.js?v=${BUILD}' \
              && printf '%s' "$taf243" | grep -Fq 'prevailingWindFullPeriodWhenNoSignificantChange' \
              && printf '%s' "$tafapp" | grep -Fq 'const mode=Policy.selectedMode(w)' \
              && printf '%s' "$tafapp" | grep -Fq 'Policy.seriesForMode(w,mode)'; then
              echo "GitHub Pages serves commit $GITHUB_SHA with canonical fog.html provider, shared UI and TAF 2.4.3 integration."
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "ERROR: live Pages does not satisfy canonical Fog provider/native FOG/TAF 2.4.3 contract." >&2
              exit 1
            fi
            echo "Waiting for Pages/CDN propagation (${attempt}/18)..."
            sleep 10
          done

      - name: Browser smoke test TAF cycles and hourly data
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "ERROR: no Chromium/Chrome binary on runner" >&2
            exit 1
          fi

          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=8000 --dump-dom \
            "${base}/taf.html?v=${GITHUB_SHA}" > /tmp/taf-ui.html 2>/tmp/taf-ui.err || true

          if ! grep -Eq '<option value="[0-9]+">' /tmp/taf-ui.html; then
            echo "ERROR: TAF cycle selector has no generated UTC cycles." >&2
            grep -o '<span id="st"[^>]*>[^<]*' /tmp/taf-ui.html || true
            grep -o '<pre id="taf"[^>]*>[^<]*' /tmp/taf-ui.html || true
            cat /tmp/taf-ui.err || true
            exit 1
          fi

          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=45000 --dump-dom \
            "${base}/taf.html?autogen=1&v=${GITHUB_SHA}" > /tmp/taf-autogen.html 2>/tmp/taf-autogen.err || true

          if ! grep -Eq '<tbody id="hours">[[:space:]]*<tr>' /tmp/taf-autogen.html && ! grep -Fq ' h danych · FOG ' /tmp/taf-autogen.html; then
            echo "ERROR: TAF autogeneration produced no hourly rows." >&2
            grep -o '<span id="st"[^>]*>[^<]*' /tmp/taf-autogen.html || true
            grep -o '<pre id="taf"[^>]*>[^<]*' /tmp/taf-autogen.html || true
            grep -o '<span id="badge"[^>]*>[^<]*' /tmp/taf-autogen.html || true
            cat /tmp/taf-autogen.err || true
            exit 1
          fi

          echo "TAF browser smoke test: UTC cycles and hourly data are present."
