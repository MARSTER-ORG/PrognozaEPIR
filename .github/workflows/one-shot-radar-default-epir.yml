name: One-shot radar default EPIR point
on:
  push:
    paths:
      - '.github/workflows/one-shot-radar-default-epir.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set EPIR radar default point
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('radar.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'Inowrocław · 52.7989, 18.2639': 'EPIR · 52.8275, 18.3175',
            'value="52.7989"': 'value="52.8275"',
            'value="18.2639"': 'value="18.3175"',
            '<button id="resetPoint">Inowrocław</button>': '<button id="resetPoint">EPIR</button>',
            "const DEFAULT={lat:52.7989,lon:18.2639,name:'Inowrocław'};": "const DEFAULT={lat:52.8275,lon:18.3175,name:'EPIR'};",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected radar.html text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate defaults
        run: |
          grep -q "const DEFAULT={lat:52.8275,lon:18.3175,name:'EPIR'};" radar.html
          grep -q 'value="52.8275"' radar.html
          grep -q 'value="18.3175"' radar.html
          grep -q 'EPIR · 52.8275, 18.3175' radar.html
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-radar-default-epir.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.html .github/workflows/one-shot-radar-default-epir.yml
          git commit -m 'Set radar default point to EPIR coordinates'
          git push origin main
