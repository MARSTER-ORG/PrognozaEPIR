name: Fix radar nowcast fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-radar-nowcast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix SRI threshold and refresh embedded module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('radar-nowcast.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('radarWet=Object.values(preds).some(v=>Number.isFinite(v)&&v>=27)',
                      'radarWet=Object.values(preds).some(v=>Number.isFinite(v)&&v>=ECHO_THRESHOLD[source])')
          if 'radarWet=Object.values(preds).some(v=>Number.isFinite(v)&&v>=ECHO_THRESHOLD[source])' not in s:
              raise SystemExit('SRI model threshold fix not applied')
          p.write_text(s,encoding='utf-8')

          hp=Path('radar.html')
          h=hp.read_text(encoding='utf-8')
          start='<!-- RADAR_NOWCAST_INLINE_START -->'
          end='<!-- RADAR_NOWCAST_INLINE_END -->'
          if start not in h or end not in h:
              raise SystemExit('embedded nowcast markers missing')
          h=re.sub(re.escape(start)+r'.*?'+re.escape(end),
                   start+'\n<script>\n'+s+'\n</script>\n'+end,h,count=1,flags=re.S)
          hp.write_text(h,encoding='utf-8')
          PY
          node --check radar-nowcast.js
          grep -F 'radarWet=Object.values(preds).some(v=>Number.isFinite(v)&&v>=ECHO_THRESHOLD[source])' radar-nowcast.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-nowcast.js radar.html
          git commit -m 'fix: use product-specific threshold in radar nowcast'
          git pull --rebase origin main
          git push origin HEAD:main
