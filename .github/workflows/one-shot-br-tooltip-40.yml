name: One-shot BR tooltip threshold 40

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-br-tooltip-40.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch BR information threshold
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fog-meteogram-overlay.js')
          s = p.read_text(encoding='utf-8')

          changes = [
              (
                  "  const MIFG_INFO_THRESHOLD = 40;\n  const BR_COLOR = '#c084fc';",
                  "  const MIFG_INFO_THRESHOLD = 40;\n  const BR_INFO_THRESHOLD = 40;\n  const BR_COLOR = '#c084fc';",
                  1,
              ),
              (
                  "if (help) help.textContent = 'Pomarańczowa linia pokazuje widzialność konsensusu. Na meteogramie FOG, MIFG i BR są rysowane dopiero od 60/100; wartości w informacji godziny pozostają dostępne także poniżej progu rysowania.';",
                  "if (help) help.textContent = 'Pomarańczowa linia pokazuje widzialność konsensusu. Na meteogramie FOG, MIFG i BR są rysowane dopiero od 60/100; w informacji godziny FOG, MIFG i BR są pokazywane od 40/100.';",
                  1,
              ),
              (
                  "if (br && !values.querySelector('[data-br-risk=\"1\"]')) {",
                  "if (br && br.score >= BR_INFO_THRESHOLD && !values.querySelector('[data-br-risk=\"1\"]')) {",
                  1,
              ),
              (
                  "if (!br || !finite(br.score)) return;",
                  "if (!br || !finite(br.score) || br.score < BR_INFO_THRESHOLD) return;",
                  1,
              ),
          ]

          for old, new, expected in changes:
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {count}: {old[:80]}')
              s = s.replace(old, new, expected)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check fog-meteogram-overlay.js
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-br-tooltip-40.yml
          git add fog-meteogram-overlay.js
          git commit -m "Hide BR tooltip below 40/100"
          git push origin HEAD:main
