name: Patch OPERA 250 km analysis

on:
  push:
    paths:
      - '.github/workflows/patch-opera-250km.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dual-zone OPERA analysis
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('opera-nowcast.js')
          s = p.read_text()

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {n}')
              s = s.replace(old, new, 1)

          one(
          """  const GRID_STEP_KM = 4;\n  const GRID_RADIUS_KM = 160;\n  const GRID_N = Math.round(GRID_RADIUS_KM * 2 / GRID_STEP_KM) + 1;\n  const CENTER = Math.floor(GRID_N / 2);\n  // Analysis stays at 4 km for mobile performance. Only the newest frame gets\n  // a separate 1 km display raster so the Leaflet CMAX layer is readable.\n  const MAP_STEP_KM = 1;\n  const MAP_N = Math.round(GRID_RADIUS_KM * 2 / MAP_STEP_KM) + 1;""",
          """  const GRID_STEP_KM = 4;\n  const ANALYSIS_RADIUS_KM = 250;\n  const OPERATIONAL_RADIUS_KM = 160;\n  const GRID_RADIUS_KM = ANALYSIS_RADIUS_KM;\n  const GRID_N = Math.round(GRID_RADIUS_KM * 2 / GRID_STEP_KM) + 1;\n  const CENTER = (GRID_N - 1) / 2;\n  // Motion/history scans a wider 250 km radius at 4 km resolution. The local\n  // operational zone and the detailed 1 km map remain limited to 160 km.\n  const MAP_STEP_KM = 1;\n  const MAP_RADIUS_KM = OPERATIONAL_RADIUS_KM;\n  const MAP_N = Math.round(MAP_RADIUS_KM * 2 / MAP_STEP_KM) + 1;""",
          'constants')

          one("mapButton.textContent = 'OPERA CMAX';", "mapButton.textContent = 'OPERA Europa CMAX';", 'button label')

          marker = """  async function readFrame(frame,p){\n"""
          helper = """  function zoneStats(values,mask,minKm=0,maxKm=ANALYSIS_RADIUS_KM){\n    const area={ge35:0,ge40:0,ge45:0,ge50:0};let active=0,sum=0,max=-Infinity;\n    for(let gy=0;gy<GRID_N;gy++)for(let gx=0;gx<GRID_N;gx++){\n      const east=(gx-CENTER)*GRID_STEP_KM,north=-(gy-CENTER)*GRID_STEP_KM,d=Math.hypot(east,north);\n      if(d<minKm||d>maxKm)continue;const i=gy*GRID_N+gx,v=Number(values[i]);if(!finite(v))continue;max=Math.max(max,v);\n      if(mask[i]){active++;sum+=v;if(v>=35)area.ge35++;if(v>=40)area.ge40++;if(v>=45)area.ge45++;if(v>=50)area.ge50++;}\n    }\n    return{active,mean:active?sum/active:NaN,max:finite(max)?max:NaN,area};\n  }\n\n  async function readFrame(frame,p){\n"""
          one(marker, helper, 'zone helper')

          one(
          """    return{time:frame.time,url:frame.url,values,mask,active,mean:active?sum/active:NaN,max,area,qMean,qUsable,projection:pp.name,geoBounds};""",
          """    const operational=zoneStats(values,mask,0,OPERATIONAL_RADIUS_KM);\n    const scout=zoneStats(values,mask,OPERATIONAL_RADIUS_KM+0.01,ANALYSIS_RADIUS_KM);\n    return{time:frame.time,url:frame.url,values,mask,active,mean:active?sum/active:NaN,max,area,operational,scout,qMean,qUsable,projection:pp.name,geoBounds};""",
          'zone stats return')

          one(
          """    const scaleX=w/(maxX-minX),scaleY=h/(maxY-minY),rx=GRID_RADIUS_KM*1000*scaleX,ry=GRID_RADIUS_KM*1000*scaleY;\n    const x0=clamp(Math.floor(px-rx),0,w-2),x1=clamp(Math.ceil(px+rx),x0+1,w),y0=clamp(Math.floor(py-ry),0,h-2),y1=clamp(Math.ceil(py+ry),y0+1,h);""",
          """    const scaleX=w/(maxX-minX),scaleY=h/(maxY-minY),rx=MAP_RADIUS_KM*1000*scaleX,ry=MAP_RADIUS_KM*1000*scaleY;\n    const x0=clamp(Math.floor(px-rx),0,w-2),x1=clamp(Math.ceil(px+rx),x0+1,w),y0=clamp(Math.floor(py-ry),0,h-2),y1=clamp(Math.ceil(py+ry),y0+1,h);""",
          'display radius')

          one(
          """  function nearestEcho(latest){\n    let best=null;for(let gy=0;gy<GRID_N;gy++)for(let gx=0;gx<GRID_N;gx++){const i=gy*GRID_N+gx,v=latest.values[i];if(!finite(v)||v<DBZ_THRESHOLD||!latest.mask[i])continue;const east=(gx-CENTER)*GRID_STEP_KM,north=-(gy-CENTER)*GRID_STEP_KM,d=Math.hypot(east,north);if(!best||d<best.distance||(d===best.distance&&v>best.value))best={east,north,distance:d,value:v,bearing:bearingFromVector(east,north)}}return best;\n  }\n  function approachEcho(latest,vector){\n    if(!vector||vector.speed<4)return null;let best=null,vsq=vector.east**2+vector.north**2;for(let gy=0;gy<GRID_N;gy++)for(let gx=0;gx<GRID_N;gx++){const i=gy*GRID_N+gx,v=latest.values[i];if(!finite(v)||v<DBZ_THRESHOLD||!latest.mask[i])continue;const east=(gx-CENTER)*GRID_STEP_KM,north=-(gy-CENTER)*GRID_STEP_KM,t=-(east*vector.east+north*vector.north)/vsq;if(t<-.05||t>1.5)continue;const tt=Math.max(0,t),cpa=Math.hypot(east+vector.east*tt,north+vector.north*tt);if(cpa>30)continue;const c={east,north,value:v,tHours:tt,cpa,distance:Math.hypot(east,north),bearing:bearingFromVector(east,north)};if(!best||c.tHours<best.tHours-.05||(Math.abs(c.tHours-best.tHours)<.05&&c.cpa<best.cpa))best=c}return best;\n  }""",
          """  function nearestEcho(latest,minDistance=0,maxDistance=ANALYSIS_RADIUS_KM){\n    let best=null;for(let gy=0;gy<GRID_N;gy++)for(let gx=0;gx<GRID_N;gx++){const i=gy*GRID_N+gx,v=latest.values[i];if(!finite(v)||v<DBZ_THRESHOLD||!latest.mask[i])continue;const east=(gx-CENTER)*GRID_STEP_KM,north=-(gy-CENTER)*GRID_STEP_KM,d=Math.hypot(east,north);if(d<minDistance||d>maxDistance)continue;if(!best||d<best.distance||(d===best.distance&&v>best.value))best={east,north,distance:d,value:v,bearing:bearingFromVector(east,north)}}return best;\n  }\n  function approachEcho(latest,vector,minDistance=0,maxDistance=ANALYSIS_RADIUS_KM,maxHours=1.5){\n    if(!vector||vector.speed<4)return null;let best=null,vsq=vector.east**2+vector.north**2;for(let gy=0;gy<GRID_N;gy++)for(let gx=0;gx<GRID_N;gx++){const i=gy*GRID_N+gx,v=latest.values[i];if(!finite(v)||v<DBZ_THRESHOLD||!latest.mask[i])continue;const east=(gx-CENTER)*GRID_STEP_KM,north=-(gy-CENTER)*GRID_STEP_KM,distance=Math.hypot(east,north);if(distance<minDistance||distance>maxDistance)continue;const t=-(east*vector.east+north*vector.north)/vsq;if(t<-.05||t>maxHours)continue;const tt=Math.max(0,t),cpa=Math.hypot(east+vector.east*tt,north+vector.north*tt);if(cpa>30)continue;const c={east,north,value:v,tHours:tt,cpa,distance,bearing:bearingFromVector(east,north)};if(!best||c.tHours<best.tHours-.05||(Math.abs(c.tHours-best.tHours)<.05&&c.cpa<best.cpa))best=c}return best;\n  }""",
          'nearest and approach')

          one(
          """    ensureUi();$('operaNowcastCard')?.classList.remove('op-error');const latest=r.latest;setState('DZIAŁA','ok');$('opFrame').textContent=fmtUtcMs(latest.time);$('opFrames').textContent=`Historia: ${r.frames} klatek · ${fmtUtcMs(r.frameStart)}–${fmtUtcMs(r.frameEnd)}`;$('opMax').textContent=dbzText(latest.max);$('opNearest').textContent=r.nearest?`${Math.round(r.nearest.distance)} km ${compass16(r.nearest.bearing)} · ${dbzText(r.nearest.value)}`:'brak ≥27 dBZ do 160 km';$('opMotion').textContent=r.vector?`${compass16(r.vector.bearingDeg)} · ${Math.round(r.vector.speedKmh)} km/h`:'brak stabilnego ruchu';$('opTrend').textContent=`trend: ${r.trend.label}`;$('opQind').textContent=latest.qUsable?`QIND ${Math.round(latest.qMean*100)}/100`:'QIND bez osobnego pasma';$('opArea').textContent=`≥35 ${latest.area.ge35} · ≥40 ${latest.area.ge40} · ≥45 ${latest.area.ge45} · ≥50 ${latest.area.ge50}`;$('opPred').textContent=HORIZONS.map(h=>`+${h} ${dbzText(r.predictions[h])}`).join(' · ');\n    const eta=r.approach?Math.round(r.approach.tHours*60):null;$('opSummary').textContent=r.approach?`Podejście ≤30 km za ok. ${eta} min.`:'Brak echa ≥27 dBZ na torze ≤30 km w ciągu 90 min.';setStatus(`klatka ${fmtUtcMs(latest.time)} · central-ingestor · OPERA DBZH GeoTIFF`);renderMapLayer(latest);""",
          """    ensureUi();$('operaNowcastCard')?.classList.remove('op-error');const latest=r.latest;setState('DZIAŁA','ok');$('opFrame').textContent=fmtUtcMs(latest.time);$('opFrames').textContent=`Historia: ${r.frames} klatek · ${fmtUtcMs(r.frameStart)}–${fmtUtcMs(r.frameEnd)}`;$('opMax').textContent=dbzText(latest.operational?.max);$('opNearest').textContent=r.nearest?`${Math.round(r.nearest.distance)} km ${compass16(r.nearest.bearing)} · ${dbzText(r.nearest.value)}`:r.scoutNearest?`wczesne: ${Math.round(r.scoutNearest.distance)} km ${compass16(r.scoutNearest.bearing)} · ${dbzText(r.scoutNearest.value)}`:'brak ≥27 dBZ do 250 km';$('opMotion').textContent=r.vector?`${compass16(r.vector.bearingDeg)} · ${Math.round(r.vector.speedKmh)} km/h`:'brak stabilnego ruchu';$('opTrend').textContent=`trend: ${r.trend.label}`;$('opQind').textContent=latest.qUsable?`QIND ${Math.round(latest.qMean*100)}/100`:'QIND bez osobnego pasma';const oa=latest.operational?.area||{ge35:0,ge40:0,ge45:0,ge50:0};$('opArea').textContent=`0–160 km: ≥35 ${oa.ge35} · ≥40 ${oa.ge40} · ≥45 ${oa.ge45} · ≥50 ${oa.ge50}`;$('opPred').textContent=HORIZONS.map(h=>`+${h} ${dbzText(r.predictions[h])}`).join(' · ');\n    const eta=r.approach?Math.round(r.approach.tHours*60):null,scoutEta=r.scoutApproach?Math.round(r.scoutApproach.tHours*60):null;$('opSummary').textContent=r.approach?`Podejście ≤30 km za ok. ${eta} min.`:r.scoutApproach?`Wczesne wykrycie 160–250 km: możliwe podejście ≤30 km za ok. ${scoutEta} min.`:'Brak echa ≥27 dBZ na torze do EPIR w analizie 250 km.';setStatus(`klatka ${fmtUtcMs(latest.time)} · analiza 250 km · operacyjna 160 km · central-ingestor`);renderMapLayer(latest);""",
          'render result')

          one(
          """      const vector=vectorStats(grids),trend=trendStats(grids),nearest=nearestEcho(latest),approach=vector?approachEcho(latest,vector):null,predictions=vector?advect(latest,vector,trend):Object.fromEntries(HORIZONS.map(h=>[h,NaN])),conf=confidence(grids,vector);\n      const result={updatedAt:new Date().toISOString(),point:p,source:'opera_cirrus_dbzh_central',frames:grids.length,frameStart:grids[0].time,frameEnd:latest.time,latest,vector:vector?{eastKmh:vector.east,northKmh:vector.north,speedKmh:vector.speed,bearingDeg:vector.bearing,score:vector.score,consistency:vector.consistency}:null,confidence:conf,trend,nearest,approach,etaMin:approach?approach.tHours*60:null,predictions,quality:{qindAvailable:latest.qUsable,qindMean:latest.qMean,qindThreshold:QIND_MIN}};""",
          """      const vector=vectorStats(grids),trend=trendStats(grids),nearest=nearestEcho(latest,0,OPERATIONAL_RADIUS_KM),scoutNearest=nearestEcho(latest,OPERATIONAL_RADIUS_KM+0.01,ANALYSIS_RADIUS_KM),approach=vector?approachEcho(latest,vector,0,OPERATIONAL_RADIUS_KM,1.5):null,scoutApproach=vector?approachEcho(latest,vector,OPERATIONAL_RADIUS_KM+0.01,ANALYSIS_RADIUS_KM,3):null,predictions=vector?advect(latest,vector,trend):Object.fromEntries(HORIZONS.map(h=>[h,NaN])),conf=confidence(grids,vector);\n      const result={updatedAt:new Date().toISOString(),point:p,source:'opera_cirrus_dbzh_central',analysisRadiusKm:ANALYSIS_RADIUS_KM,operationalRadiusKm:OPERATIONAL_RADIUS_KM,frames:grids.length,frameStart:grids[0].time,frameEnd:latest.time,latest,vector:vector?{eastKmh:vector.east,northKmh:vector.north,speedKmh:vector.speed,bearingDeg:vector.bearing,score:vector.score,consistency:vector.consistency}:null,confidence:conf,trend,nearest,scoutNearest,approach,scoutApproach,etaMin:approach?approach.tHours*60:null,scoutEtaMin:scoutApproach?scoutApproach.tHours*60:null,predictions,quality:{qindAvailable:latest.qUsable,qindMean:latest.qMean,qindThreshold:QIND_MIN}};""",
          'run zones')

          p.write_text(s)

          p2 = Path('opera-convection-bridge.js')
          b = p2.read_text()
          def bone(old, new, label):
              global b
              n = b.count(old)
              if n != 1:
                  raise SystemExit(f'bridge {label}: expected 1 occurrence, got {n}')
              b = b.replace(old, new, 1)

          bone("const maxDbz = Number(opera?.latest?.max);", "const maxDbz = Number(opera?.latest?.operational?.max ?? opera?.latest?.max);", 'operational max')
          bone(
          """      operaMaxDbz:finite(maxDbz)?maxDbz:null, etaMin, etaAt, trend:opera?.trend?.label||null,""",
          """      operaMaxDbz:finite(maxDbz)?maxDbz:null, etaMin, etaAt, scoutEtaMin:finite(Number(opera.scoutEtaMin))?Number(opera.scoutEtaMin):null, scoutNearest:opera.scoutNearest||null, analysisRadiusKm:Number(opera.analysisRadiusKm)||250, operationalRadiusKm:Number(opera.operationalRadiusKm)||160, trend:opera?.trend?.label||null,""",
          'scout evidence')
          bone(
          """    if(e.trend)parts.push(`trend: ${e.trend}`);\n    box.innerHTML=parts.join(' · ')+'.';""",
          """    if(e.scoutEtaMin!==null)parts.push(`wczesne echo 160–250 km: ETA ~${Math.round(e.scoutEtaMin)} min`);\n    else if(e.scoutNearest)parts.push(`najbliższe echo poza strefą operacyjną: ${Math.round(e.scoutNearest.distance)} km`);\n    if(e.trend)parts.push(`trend: ${e.trend}`);\n    box.innerHTML=parts.join(' · ')+'.';""",
          'scout render')
          p2.write_text(b)
          PY
      - name: Validate JavaScript and zone split
        run: |
          node --check opera-nowcast.js
          node --check opera-convection-bridge.js
          grep -q "ANALYSIS_RADIUS_KM = 250" opera-nowcast.js
          grep -q "OPERATIONAL_RADIUS_KM = 160" opera-nowcast.js
          grep -q "scoutApproach" opera-nowcast.js
          grep -q "OPERA Europa CMAX" opera-nowcast.js
          grep -q "latest?.operational?.max" opera-convection-bridge.js
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opera-nowcast.js opera-convection-bridge.js
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Extend OPERA analysis to 250 km with 160 km operational zone'
          git push
