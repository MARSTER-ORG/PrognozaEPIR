name: Probe Supabase Gemini secret (isolated)
on:
  push:
    branches:
      - chore/probe-gemini-secret-20261111
    paths:
      - '.github/workflows/probe-taf-gemini-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test end-to-end Gemini response (never print credentials)
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request, urllib.error
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          src = Path("message-archive-client.js").read_text(encoding="utf-8")
          m = re.search(r"const SUPABASE_ANON='([^']+)'", src)
          if not m:
              raise RuntimeError("Cannot read frontend publishable credential")
          public_key = m.group(1)
          start = datetime(2026, 11, 11, 6, tzinfo=timezone.utc)
          hours = [
              {
                  "utc": (start+timedelta(hours=i)).strftime("%d.%m.%Y %H:%M UTC"),
                  "wind": "17006KT", "visibility": "3000",
                  "weather": "BR", "clouds": "BKN010", "fogProbability": 35
              }
              for i in range(12)
          ]
          body = json.dumps({
              "taf": "TAF EPIR 110500Z 1106/1118 17006KT 3000 BR BKN010=",
              "hours": hours,
              "observation": "EPIR 102300Z AUTO 24011KT 2300 VV002 01/01 Q1011",
              "fogMode": "legacy",
              "epirRecent": [
                  {"time":"2026-11-11T11:00:00Z","visibilityM":1800,"weather":"BR","temperatureC":2,"dewPointC":2},
                  {"time":"2026-11-11T10:30:00Z","visibilityM":1800,"weather":"BR","temperatureC":2,"dewPointC":2},
                  {"time":"2026-11-11T10:00:00Z","visibilityM":1200,"weather":"BR","temperatureC":2,"dewPointC":2}
              ],
              "neighborObservations": [
                  {"station":"EPBY","time":"2026-11-11T11:00:00Z","visibilityM":3500,"weather":"BR"},
                  {"station":"EPPW","time":"2026-11-11T11:00:00Z","visibilityM":8000,"weather":"NONE"},
                  {"station":"EPKS","time":"2026-11-11T11:00:00Z","visibilityM":5000,"weather":"BR"}
              ],
              "neighborTafs": [
                  {"station":"EPBY","issuedAt":"2026-11-11T10:21:00Z","validFrom":"2026-11-11T10:00:00Z","validTo":"2026-11-12T06:00:00Z","taf":"TAF AMD EPBY 111021Z 1110/1206 21008KT 3000 BR BKN002 PROB40 TEMPO 1110/1116 6000 BKN005 TEMPO 1122/1206 1000 -DZ BR OVC001="},
                  {"station":"EPPW","issuedAt":"2026-11-11T05:00:00Z","validFrom":"2026-11-11T06:00:00Z","validTo":"2026-11-11T18:00:00Z","taf":"TAF EPPW 110500Z 1106/1118 21008KT 0600 FG OVC002 BECMG 1108/1111 6000 BKN013="},
                  {"station":"EPKS","issuedAt":"2026-11-11T11:00:00Z","validFrom":"2026-11-11T12:00:00Z","validTo":"2026-11-12T00:00:00Z","taf":"TAF EPKS 111100Z 1112/1124 11005KT 6000 BKN007 BECMG 1118/1120 2000 BR BKN003 BECMG 1120/1122 0600 FG OVC001="}
              ]
          }).encode("utf-8")
          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "Origin": "https://marster-org.github.io",
              "Authorization": "Bearer " + public_key,
              "apikey": public_key
          }
          req = urllib.request.Request(
              "https://qozgntzeormujmqzkkmd.supabase.co/functions/v1/taf-gemini",
              data=body, headers=headers, method="POST"
          )
          try:
              with urllib.request.urlopen(req, timeout=55) as resp:
                  status = resp.status
                  payload = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              status = exc.code
              payload = json.loads(exc.read().decode("utf-8"))
          print("HTTP_STATUS:", status)
          print("FUNCTION_OK:", payload.get("ok"))
          print("MODEL:", payload.get("model", "n/a"))
          if not payload.get("ok"):
              print("ERROR_CODE:", payload.get("error", "unknown"))
              print("PROVIDER_HTTP_STATUS:", payload.get("providerHttpStatus", "not_reported"))
              print("PROVIDER_REASON:", payload.get("providerReason", "not_reported"))
              sys.exit(1)
          analysis = payload.get("analysis") or {}
          print("GEMINI_ANALYSIS_RECEIVED:", isinstance(analysis.get("summary"), str) and bool(analysis["summary"]))
          print("GEMINI_ADVISORY_ONLY:", payload.get("advisoryOnly"))
          sys.exit(0 if analysis.get("summary") and payload.get("advisoryOnly") is True else 1)
          PY
