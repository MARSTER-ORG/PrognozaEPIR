name: Stage 2 one-shot stability patch

on:
  push:
    branches:
      - fix/audit-stage2-stability
    paths:
      - scripts/_stage2_patch.py
      - .github/workflows/_stage2-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Stage 2 patch
        run: python scripts/_stage2_patch.py
      - name: Validate source contracts
        run: |
          python tests/test_stage2_stability_contracts.py
          python tests/test_fog_vnext_probability_units.py
          python scripts/enforce_global_utc.py --check
          python scripts/check_archive_boundaries.py
      - name: Build canonical Pages artifact
        run: |
          python scripts/prepare_pages_v241.py
          python scripts/wire_fog_mifg_utc_runtime.py
          python scripts/enforce_global_utc.py --check
      - name: Runtime regressions
        run: |
          node tests/fog-native-page-contract.test.js
          node tests/runtime-integration-contract.test.js
          node tests/taf-fog-policy.test.js
          node tests/taf-engine-v2.test.js
      - name: Commit patched sources
        run: |
          rm -f scripts/_stage2_patch.py .github/workflows/_stage2-patch.yml
          rm -rf _site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
          else
            git commit -m "fix(stage2): stabilize source and build contracts"
            git push origin HEAD:fix/audit-stage2-stability
          fi
