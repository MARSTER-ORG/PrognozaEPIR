name: TAF hybrid deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taf-hybrid-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch loader and page labels
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('utc-ui-guard.js')
          s=p.read_text()
          old='taf-generator-policy.js?v=20260912-fewsct12h-live-v10'
          new='taf-generator-policy.js?v=20260912-hybrid-live-v11'
          if old not in s and new not in s:
              raise SystemExit('TAF policy loader marker not found')
          p.write_text(s.replace(old,new))

          p=Path('taf.html')
          s=p.read_text()
          s=s.replace('GENERATOR TAF v0.2.1','GENERATOR TAF v0.3.0 · HYBRID')
          s=s.replace('odczytuje METAR/SPECI, SYNOP i bieżące TAF wyłącznie przez MessageArchive','odczytuje METAR/SPECI i bieżące TAF wyłącznie przez MessageArchive')
          s=s.replace('następnie korzysta z silnika multimodelowego, Cloud Learning oraz kierunkowych TAF EPBY / EPPW / EPKS','następnie korzysta z siedmiowarstwowego silnika hybrydowego, lokalnego MOS/uczenia oraz kierunkowych TAF EPBY / EPPW / EPKS')
          p.write_text(s)
          PY
      - name: Syntax and regression tests
        run: |
          node --check taf-hybrid-engine.js
          node --check taf-hybrid-adapter.js
          node --check taf-generator-policy.js
          node tests/taf-hybrid-engine.test.js
      - name: Commit deployment patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utc-ui-guard.js taf.html
          git commit -m 'TAF: activate hybrid engine in generator [skip ci]'
          git push
