name: Apply OPERA map detail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-opera-map-detail.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse validated migration logic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          text=Path('.github/workflows/patch-opera-map-detail.yml').read_text(encoding='utf-8')
          start=text.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=text.index("\n          PY\n",start)
          body=text[start:end]
          lines=[]
          for line in body.splitlines():
              if line.startswith('          '): line=line[10:]
              lines.append(line)
          Path('/tmp/opera-map-patch.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          subprocess.run(['python3','/tmp/opera-map-patch.py'],check=True)
          PY
          git restore .github/workflows/test-opera-page.yml
          node --check opera-nowcast.js
          node --check opera-convection-bridge.js
          grep -F 'const MAP_STEP_KM = 1;' opera-nowcast.js
          grep -F 'interactive:true' opera-convection-bridge.js
          grep -F 'opera-cmax-popup' opera-convection-bridge.js

      - name: Commit JS only
        run: |
          set -euo pipefail
          if git diff --quiet -- opera-nowcast.js opera-convection-bridge.js; then
            echo 'OPERA map detail already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opera-nowcast.js opera-convection-bridge.js
          git commit -m 'Improve OPERA CMAX map detail and point readout'
          for n in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((n*2))
          done
          exit 1
