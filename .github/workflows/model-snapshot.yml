name: Refresh EPIR model snapshot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_model_snapshot.py'
      - 'scripts/archive_consensus_cloud_profile.js'
      - 'cloud-consensus-calibration.js'
      - 'meteogram-cloud-bands.js'
      - '.github/workflows/model-snapshot.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: epir-model-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test snapshot safeguards
        run: python3 -m unittest discover -s tests -p 'test_model_snapshot_resilience.py'

      - name: Build server-side model snapshot
        env:
          EPIR_SNAPSHOT_MIN_REFRESH_HOURS: ${{ github.event_name == 'schedule' && '3' || '0' }}
        run: python3 scripts/build_model_snapshot.py

      - name: Validate snapshot
        run: |
          python3 -m json.tool data/runtime/models-latest.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/runtime/models-latest.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          assert j.get('schema') == 'prognozaepir-model-snapshot-v1'
          from datetime import datetime, timezone
          stamp=datetime.fromisoformat(j['generated_at'].replace('Z', '+00:00'))
          age=(datetime.now(timezone.utc)-stamp).total_seconds()/3600
          assert -0.25 <= age <= 12, f'snapshot stale: {age:.1f}h'
          models=j.get('models') or {}
          assert len(models) >= 3, f'only {len(models)} models in snapshot'
          for mid,row in models.items():
              times=(row.get('hourly') or {}).get('time') or []
              assert len(times) >= 24, f'{mid}: only {len(times)} hours'
          print('validated models:', ', '.join(models))
          PY

      - name: Archive future cloud profile and very-low cloud base
        run: |
          node --check scripts/archive_consensus_cloud_profile.js
          node --check cloud-consensus-calibration.js
          node tests/cloud-consensus-archive.test.js
          node tests/cloud-consensus-calibration.test.js
          node scripts/archive_consensus_cloud_profile.js

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runtime/models-latest.json data/learning/consensus-cloud-forecasts/
          if git diff --cached --quiet; then
            echo "No model snapshot changes"
            exit 0
          fi
          git commit -m "weather: refresh server-side model snapshot"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "snapshot push retry $attempt"
            sleep $((attempt*3))
          done
          exit 1

      - name: Hourly disaster-recovery trigger for bulletin archive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A completely separate hourly clock recovers each aviation stream
          # independently, then also runs the slower central/SYNOP path.
          gh workflow run metar-heartbeat.yml --repo "${{ github.repository }}" --ref main
          gh workflow run taf-heartbeat.yml --repo "${{ github.repository }}" --ref main
          gh workflow run message-archive.yml --repo "${{ github.repository }}" --ref main
