name: Daily Supabase logical backup

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [supabase-backup-now]
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-supabase-backup.yml'
      - 'scripts/export_supabase_backup.py'

permissions:
  contents: write

concurrency:
  group: daily-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Export Supabase logical backup
        env:
          SUPABASE_PROJECT_REF: qozgntzeormujmqzkkmd
        run: python3 scripts/export_supabase_backup.py

      - name: Validate snapshot files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('backups/supabase/daily')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('schema')!='prognozaepir-supabase-logical-backup-v1':
              raise SystemExit('unexpected backup manifest schema')
          expected={'message_sources','stations','messages','ingest_runs','forecasts','forecast_verifications'}
          actual=set((manifest.get('tables') or {}).keys())
          if actual!=expected:
              raise SystemExit(f'backup table set mismatch: {actual}')
          for table,meta in manifest['tables'].items():
              path=root/meta['file']
              if not path.is_file():
                  raise SystemExit(f'missing backup file: {path}')
              rows=sum(1 for line in path.read_text(encoding='utf-8').splitlines() if line.strip())
              if rows!=int(meta['rows']):
                  raise SystemExit(f'{table}: manifest rows={meta["rows"]}, file rows={rows}')
          if not (root/'schema.json').is_file():
              raise SystemExit('schema.json missing')
          print('Backup validation OK:', {k:v['rows'] for k,v in manifest['tables'].items()})
          PY

      - name: Commit validated backup snapshot
        run: |
          if git diff --quiet -- backups/supabase/daily; then
            echo 'Backup unchanged.'
            exit 0
          fi
          git config user.name 'prognozaepir-supabase-backup'
          git config user.email 'supabase-backup@prognozaepir.invalid'
          git add backups/supabase/daily
          git commit -m 'backup: daily Supabase logical snapshot'
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((n*2))
          done
          echo 'Unable to publish Supabase backup after retries.' >&2
          exit 1
