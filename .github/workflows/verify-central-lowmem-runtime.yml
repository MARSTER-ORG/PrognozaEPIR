name: Verify central lowmem runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-central-lowmem-runtime.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify health and OPERA Range proxy
        run: |
          set -euo pipefail
          BASE='https://central-ingestor-production.up.railway.app'
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE/health" -o /tmp/health.json
          curl -fsS --connect-timeout 10 --max-time 20 "$BASE/opera/health" -o /tmp/opera-health.json
          python3 - <<'PY'
          import json
          for p in ('/tmp/health.json','/tmp/opera-health.json'):
              d=json.load(open(p))
              assert d.get('ok') is True, (p,d)
          PY
          found=0
          for back in $(seq 0 5 90); do
            stamp=$(date -u -d "-$back minutes" +%Y%m%d%H%M)
            mm=${stamp:10:2}
            mm=$((10#$mm / 5 * 5))
            stamp="${stamp:0:10}$(printf '%02d' "$mm")"
            code=$(curl -sS --connect-timeout 10 --max-time 25 -H 'Range: bytes=0-1023' -o /tmp/opera.bin -w '%{http_code}' "$BASE/opera/dbzh/$stamp.tiff" || true)
            if [ "$code" = '206' ]; then
              [ "$(wc -c </tmp/opera.bin)" -gt 0 ]
              echo "PASS OPERA frame $stamp returned HTTP 206"
              found=1
              break
            fi
          done
          [ "$found" = 1 ]
