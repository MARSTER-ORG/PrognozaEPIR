name: Reassert canonical Pages v2 after legacy

on:
  workflow_run:
    workflows: ["Deploy PrognozaEPIR to GitHub Pages"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-canonical:
    if: ${{ github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Pages v2
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/pages-v2.yml/dispatches" \
            -d '{"ref":"main"}'
