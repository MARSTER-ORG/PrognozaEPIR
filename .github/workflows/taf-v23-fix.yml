name: Apply TAF Engine 2.3 production fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taf-v23-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply migration
        shell: bash
        run: |
          python3 scripts/taf-v23-fix.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('taf-engine-v2.js')
          s=p.read_text(encoding='utf-8')
          old="""    const fogEngine=prob(row?.fogRisk);\n    p.fog=Math.max(p.fog,fogEngine);\n    // EPIR FOG ENGINE score is the event probability for FG. VIS thresholds refine severity, not whether the signal exists.\n    p.fg=Math.max(p.fg,fogEngine,prob(row?.fgRisk),prob(row?.fogVis1000Risk));\n    p.br=Math.max(p.br,prob(row?.brRisk));\n"""
          new="""    const fogEngine=prob(row?.fogRisk),explicitFg=prob(row?.fgRisk);\n    p.fog=Math.max(p.fog,fogEngine);\n    // Explicit FG evidence wins. The generic FOG score is a fallback only when no explicit FG probability was supplied.\n    p.fg=Math.max(p.fg,explicitFg,prob(row?.fogVis1000Risk),explicitFg>0?0:fogEngine);\n    p.br=Math.max(p.br,prob(row?.brRisk));\n"""
          if old not in s:
              raise SystemExit('fog probability precedence marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Validate source and regression suite
        run: |
          node --check taf-engine-v2.js
          node --check taf-app-v2.js
          node --check message-archive-client.js
          node tests/taf-engine-v2.test.js
          grep -F 'TAF ENGINE 2.3.0 · INSTRUCTION FIRST' taf.html
          grep -F 'taf-engine-v2.js?v=2.3.0' taf.html
          grep -F 'taf-app-v2.js?v=2.3.0' taf.html
          grep -F 'prognozaepir-taf-engine-v2' message-archive-client.js
          grep -F 'const fgRisk=Math.max(fogScore' taf-app-v2.js
          grep -F 'FOG is an independent input' taf-engine-v2.js
          grep -F 'explicitFg>0?0:fogEngine' taf-engine-v2.js
          grep -F 'workflow_dispatch' .github/workflows/pages.yml

      - name: Commit tested correction
        shell: bash
        run: |
          git config user.name 'PrognozaEPIR bot'
          git config user.email 'actions@users.noreply.github.com'
          git add message-archive-client.js taf-app-v2.js taf-engine-v2.js taf.html tests/taf-engine-v2.test.js .github/workflows/pages-v2.yml .github/workflows/pages.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'fix: make TAF 2.3 sole runtime and integrate FOG engine'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
