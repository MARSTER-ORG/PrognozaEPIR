name: Patch radar layer reliability

on:
  push:
    paths:
      - '.github/workflows/patch-radar-layer-reliability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply radar layer patch
        run: python3 scripts/patch-radar-layer-reliability.py
      - name: Validate JavaScript and Pages builder
        run: |
          node --check radar-intelligence.js
          node --check map-extras.js
          node --check range-rings-reset.js
          node --check lightning-layer.js
          node --check opera-nowcast.js
          node --check opera-convection-bridge.js
          python3 -m py_compile scripts/prepare_pages.py
          python3 scripts/prepare_pages.py
          grep -q 'radar-intelligence.js?v=' _site/radar.html
          grep -q 'map-extras.js?v=' _site/radar.html
          grep -q 'lightning-layer.js?v=' _site/radar.html
          grep -q 'range-rings-reset.js?v=' _site/radar.html
          rm -rf _site scripts/__pycache__
      - name: Commit fix and remove temporary files
        run: |
          rm -f scripts/patch-radar-layer-reliability.py .github/workflows/patch-radar-layer-reliability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix radar layer controls and duplicate renderers'
          git pull --rebase origin main
          git push origin HEAD:main
