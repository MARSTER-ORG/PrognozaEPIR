name: Collect EPIR METAR and SYNOP

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_epir_observations.py'
      - 'scripts/supplement_metar_pilothub.py'
      - 'scripts/supplement_synop_12342.py'
      - 'scripts/refresh_epir_metar.py'
      - 'scripts/organize_observation_archive.py'
      - '.github/workflows/collect-epir-observations.yml'
  schedule:
    # Poll every 15 minutes to limit GitHub Actions usage while still catching new reports promptly.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epir-observation-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect METAR EPIR and SYNOP 12342
        run: |
          # Primary collector plus independent fallbacks. A temporary outage of one source
          # must not prevent the remaining sources from being checked.
          python3 scripts/collect_epir_observations.py || echo "Primary EPIR collector unavailable; continuing with fallbacks"
          python3 scripts/supplement_metar_pilothub.py
          # Legacy FM-12/Ogimet SYNOP remains enabled if station 12342 is published again.
          python3 scripts/supplement_synop_12342.py
          # Final freshness guard compares all METAR sources and always keeps the newest report.
          python3 scripts/refresh_epir_metar.py

      - name: Organize long-term observation archive
        run: |
          python3 scripts/organize_observation_archive.py

      - name: Validate observation data
        run: |
          python3 -m json.tool data/observations/latest.json >/dev/null
          python3 -m json.tool data/observations/recent.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.load(open('data/observations/latest.json',encoding='utf-8'))
          assert p['station']['icao']=='EPIR'
          assert p['station']['synop']=='12342'
          assert p['station']['wigos']=='0-20000-0-12342'
          assert p.get('metar') or p.get('synop')
          m=p.get('metar') or {}
          s=p.get('synop') or {}
          f=p.get('fused') or {}
          if s.get('visibility_m') is not None:
              assert f.get('visibility_source')==s.get('source'), (f.get('visibility_source'),s.get('source'))
          if m.get('visibility_report') in ('9999','CAVOK'):
              assert m.get('visibility_lower_bound') is True
          for kind,row in (('metar',m),('synop',s)):
              if row.get('obs_time'):
                  dt=row['obs_time']
                  y,mo,d=dt[0:4],dt[5:7],dt[8:10]
                  canonical=Path('data/observations')/kind/y/mo/f'{d}.jsonl'
                  assert canonical.exists(), f'missing canonical archive: {canonical}'
          print('METAR:', m.get('obs_time'), m.get('source'), m.get('raw'))
          print('SYNOP:', s.get('obs_time'), s.get('source'), s.get('raw'))
          print('VIS:', f.get('visibility_m'), f.get('visibility_source'))
          PY

      - name: Commit new observations
        run: |
          if git diff --quiet -- data/observations; then
            echo "No new observation to archive"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations
          git commit -m "data: archive EPIR observations $(date -u +'%Y-%m-%d %H:%MZ')"
          git pull --rebase origin main
          git push origin HEAD:main
