name: Collect EPIR METAR and SYNOP

on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_epir_observations.py'
      - '.github/workflows/collect-epir-observations.yml'
  schedule:
    # EPIR METAR is normally half-hourly; run with a publication delay.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epir-observation-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect METAR EPIR and SYNOP 12342
        run: python3 scripts/collect_epir_observations.py

      - name: Validate observation data
        run: |
          python3 -m json.tool data/observations/latest.json >/dev/null
          python3 -m json.tool data/observations/recent.json >/dev/null
          python3 - <<'PY'
          import json
          p=json.load(open('data/observations/latest.json',encoding='utf-8'))
          assert p['station']['icao']=='EPIR'
          assert p['station']['synop']=='12342'
          assert p['station']['wigos']=='0-20000-0-12342'
          assert p.get('metar') or p.get('synop')
          f=p.get('fused') or {}
          if p.get('synop',{}).get('visibility_m') is not None and p.get('synop',{}).get('source')=='IMGW_WIS2_SYNOP':
              assert f.get('visibility_source')=='IMGW_WIS2_SYNOP'
          print('METAR:', (p.get('metar') or {}).get('obs_time'))
          print('SYNOP:', (p.get('synop') or {}).get('obs_time'))
          print('VIS:', f.get('visibility_m'), f.get('visibility_source'))
          PY

      - name: Commit new observations
        run: |
          if git diff --quiet -- data/observations; then
            echo "No new observation to archive"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations
          git commit -m "data: archive EPIR observations $(date -u +'%Y-%m-%d %H:%MZ')"
          git pull --rebase origin main
          git push origin HEAD:main
