name: One-shot live TAF fix
on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-taf-live.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TAF collector and browser source logic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/collect_neighbor_tafs.py')
          s = p.read_text(encoding='utf-8')

          start = s.index('PILOTHUB_PAGES = {')
          end = s.index('\n}\nSOURCE_PRIORITY', start) + 2
          block = '''PILOTHUB_PAGES = {
              "EPIR": (
                  "https://pilothub.pl/lotniska/epin",
              ),
              "EPBY": (
                  "https://pilothub.pl/lotniska/epby",
              ),
              "EPPW": (
                  "https://pilothub.pl/lotniska/epfp?lang=en",
              ),
              "EPKS": (
                  "https://pilothub.pl/lotniska/epze",
              ),
          }'''
          s = s[:start] + block + s[end:]
          s = s.replace(
              'UA = "Mozilla/5.0 (compatible; PrognozaEPIR-TAF-Collector/0.4; +https://github.com/MARSTER-ORG/PrognozaEPIR)"',
              'UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"'
          )
          old_headers = '''                "User-Agent": UA,\n                "Accept": accept,\n                "Cache-Control": "no-cache, no-store, max-age=0",\n                "Pragma": "no-cache",'''
          new_headers = '''                "User-Agent": UA,\n                "Accept": accept,\n                "Accept-Language": "pl-PL,pl;q=0.9,en;q=0.7",\n                "Referer": "https://awiacja.imgw.pl/",\n                "Cache-Control": "no-cache, no-store, max-age=0",\n                "Pragma": "no-cache",'''
          if old_headers not in s:
              raise SystemExit('collector headers marker not found')
          s = s.replace(old_headers, new_headers, 1)

          marker = 'def split_tafs(text: str) -> list[tuple[str, str]]:'
          helper = r'''def parseable_text(page: str) -> str:
              raw = html.unescape(page)
              hydrated = (
                  raw.replace(r"\u003c", "<")
                     .replace(r"\u003e", ">")
                     .replace(r"\u0026", "&")
                     .replace(r"\n", " ")
                     .replace(r"\r", " ")
                     .replace(r"\/", "/")
              )
              visible = plain_text(raw)
              embedded = html.unescape(hydrated)
              embedded = re.sub(r"<style\b[^>]*>.*?</style>", " ", embedded, flags=re.I | re.S)
              embedded = re.sub(r"<[^>]+>", " ", embedded)
              embedded = re.sub(r"\s+", " ", embedded).strip()
              return re.sub(r"\s+", " ", f"{visible} {embedded}").strip()


          '''
          if 'def parseable_text(page: str)' not in s:
              if marker not in s:
                  raise SystemExit('split_tafs marker not found')
              s = s.replace(marker, helper + marker, 1)
          s = s.replace('    one = plain_text(text)\n', '    one = parseable_text(text)\n', 1)
          s = s.replace('    plain = plain_text(page)\n', '    plain = parseable_text(page)\n', 1)
          p.write_text(s, encoding='utf-8')

          h = Path('taf.html')
          t = h.read_text(encoding='utf-8')
          t = t.replace("const VERSION = 'TAF Sources v0.3.2';", "const VERSION = 'TAF Sources v0.3.3';", 1)
          old = "await Promise.allSettled([fromProxy(store,metar,attempts),fromImgw(store,metar,attempts),fromAwc(store,attempts),fromCache(store,attempts)]);"
          new = "await fromCache(store,attempts);const cacheCurrent=IDS.filter(id=>select(store[id])?.current).length;if(cacheCurrent<IDS.length){await Promise.allSettled([fromProxy(store,metar,attempts),fromImgw(store,metar,attempts),fromAwc(store,attempts)]);}else{attempts.push('auto cache '+cacheCurrent+'/4 ✓');}"
          if old not in t:
              raise SystemExit('taf.html collect marker not found')
          t = t.replace(old, new, 1)
          h.write_text(t, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 -m py_compile scripts/collect_neighbor_tafs.py
          python3 scripts/collect_neighbor_tafs.py
          python3 -m json.tool data/taf/neighbors.json >/dev/null
          node --check api/taf-proxy.js
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/one-shot-fix-taf-live.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/collect_neighbor_tafs.py taf.html data/taf/neighbors.json .github/workflows/one-shot-fix-taf-live.yml
          git commit -m 'Fix live TAF source collection and fallback logic'
          git push
