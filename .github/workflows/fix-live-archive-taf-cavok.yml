name: Align live archive consumers and TAF CAVOK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-live-archive-taf-cavok.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch consumers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) TAF: force fresh shared client version and let recent clear
          # observations support a future cycle. We use the last 6 h available
          # up to min(now, TAF start), then cap the lead to 8 h. The model must
          # still show only weak FEW in the first hours for CAVOK suppression.
          p=Path('taf.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'message-archive-client\.js\?v=[^"\']+',
                   'message-archive-client.js?v=live-first-v4',s,count=1)
          old=re.compile(r"function tafObsClearEvidence\(start\)\{let a=tafRecentAviation\(recent\).*?return c\.length>=3&&share>=\.75&&age<=4\?\{count:c\.length,total:a\.length,share,age\}:null\}")
          new=("function tafObsClearEvidence(start){let cutoff=Math.min(start,Date.now()),"
               "a=tafRecentAviation(recent).map(x=>({x,t:tafMsgTime(x)})).filter(q=>fin(q.t)&&q.t<=cutoff&&q.t>=cutoff-6*36e5).sort((x,y)=>y.t-x.t).slice(0,8);"
               "if(a.length<3)return null;let c=a.filter(q=>{let r=String(q.x.raw||q.x.canonical_raw||'');"
               "return /\\bCAVOK\\b/.test(r)||(/\\b9999\\b/.test(r)&&/\\bNSC\\b/.test(r)&&!/(FEW|SCT|BKN|OVC)\\d{3}/.test(r))}),"
               "share=c.length/a.length,lead=Math.max(0,(start-a[0].t)/36e5);"
               "return c.length>=3&&share>=.75&&lead<=8?{count:c.length,total:a.length,share,age:lead,lead}:null}")
          s,n=old.subn(new,s,count=1)
          if n!=1:
              raise SystemExit(f'tafObsClearEvidence patch count={n}')
          p.write_text(s,encoding='utf-8')

          # 2) Main observation/fog modules: avoid a cached old shared client.
          p=Path('observation-engine.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("script.src='message-archive-client.js';",
                      "script.src='message-archive-client.js?v=live-first-v4';")
          p.write_text(s,encoding='utf-8')

          # 3) ARCH: live Railway is authoritative, GitHub raw is durable
          # fallback, deployed Pages snapshot is the final fallback.
          p=Path('arch.html')
          s=p.read_text(encoding='utf-8')
          marker="  const STATIC_ROOT='data/messages';"
          if 'raw.githubusercontent.com/MARSTER-ORG/PrognozaEPIR/main/data/messages' not in s:
              s=s.replace(marker,
                  "  const GITHUB_ROOT='https://raw.githubusercontent.com/MARSTER-ORG/PrognozaEPIR/main/data/messages';\n"+marker,1)
          old_fetch="async function fetchArchiveFile(path){const stamp=Date.now();let liveError=null;try{return await fetchText(`${LIVE_ROOT}/${path}?v=${stamp}`)}catch(e){liveError=e}try{return await fetchText(`${STATIC_ROOT}/${path}?v=${stamp}`)}catch(e){if(liveError?.status===404&&e?.status===404)return '';throw new Error(`Nie udało się odczytać ${path} z archiwum live ani kopii statycznej.`)}}"
          new_fetch="async function fetchArchiveFile(path){const stamp=Date.now();let liveError=null,githubError=null;try{return await fetchText(`${LIVE_ROOT}/${path}?v=${stamp}`)}catch(e){liveError=e}try{return await fetchText(`${GITHUB_ROOT}/${path}?v=${stamp}`)}catch(e){githubError=e}try{return await fetchText(`${STATIC_ROOT}/${path}?v=${stamp}`)}catch(e){if(liveError?.status===404&&githubError?.status===404&&e?.status===404)return '';throw new Error(`Nie udało się odczytać ${path} z archiwum live, GitHub ani kopii statycznej.`)}}"
          if old_fetch not in s:
              raise SystemExit('ARCH fetchArchiveFile pattern not found')
          s=s.replace(old_fetch,new_fetch,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check message-archive-client.js
          node --check observation-engine.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ('taf.html','arch.html'):
              s=Path(name).read_text(encoding='utf-8')
              blocks=[]
              pos=0
              while True:
                  a=s.find('<script>',pos)
                  if a<0: break
                  b=s.find('</script>',a)
                  if b<0: break
                  blocks.append(s[a+8:b])
                  pos=b+9
              for i,code in enumerate(blocks):
                  Path(f'/tmp/{name}-{i}.js').write_text(code,encoding='utf-8')
          PY
          for f in /tmp/taf.html-*.js /tmp/arch.html-*.js; do node --check "$f"; done

      - name: Commit fixes
        run: |
          git config user.name 'PrognozaEPIR bot'
          git config user.email 'actions@users.noreply.github.com'
          git add taf.html arch.html observation-engine.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'archive: use live data and fix future-cycle CAVOK evidence'
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((n*2))
          done
          exit 1
