name: Update TAF cache

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_neighbor_tafs.py'
      - 'scripts/archive_epir_taf.py'
      - '.github/workflows/collect-taf-cache.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: taf-cache
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect and archive current TAFs
        run: |
          python3 scripts/collect_neighbor_tafs.py
          python3 scripts/archive_epir_taf.py
          python3 -m json.tool data/taf/neighbors.json >/dev/null
          python3 -m json.tool data/taf/latest.json >/dev/null

      - name: Commit cache and archive when changed
        id: cache_commit
        run: |
          if git diff --quiet -- data/taf; then
            echo "TAF cache/archive unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/taf
          git commit -m "data: refresh and archive EPIR TAF"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy refreshed TAF data to GitHub Pages
        if: steps.cache_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
