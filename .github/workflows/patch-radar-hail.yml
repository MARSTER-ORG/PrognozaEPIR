name: Patch radar hail algorithm

on:
  push:
    paths:
      - '.github/workflows/patch-radar-hail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch radar hail logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('radar.html')
          s = p.read_text(encoding='utf-8')

          old_version = 'RADAR / SAT / AI v0.10.0'
          new_version = 'RADAR / SAT / AI v0.10.1'
          if old_version in s:
              s = s.replace(old_version, new_version, 1)

          old_guard = '<script src="utc-ui-guard.js"></script>'
          new_guard = '<script src="utc-ui-guard.js?v=20260911-radar-inline-v3"></script>'
          if old_guard in s:
              s = s.replace(old_guard, new_guard, 1)

          old_riskset = "function riskSet(id,v){v=clamp(Math.round(v||0),0,99);$(id+'Risk').textContent=v+'%';$(id+'Bar').style.width=v+'%'}"
          new_riskset = "function riskSet(id,v){v=clamp(Math.round(v||0),0,99);$(id+'Risk').textContent=v+'%';$(id+'Bar').style.width=(v>=40?v:0)+'%';$(id+'Bar').dataset.drawn=v>=40?'1':'0';$(id+'Bar').dataset.minScore='40'}"
          if old_riskset not in s:
              raise SystemExit('Expected riskSet() source not found; refusing unsafe patch')
          s = s.replace(old_riskset, new_riskset, 1)

          old_hail = "  const hailRadar=latestDbz>=55?42:latestDbz>=50?30:latestDbz>=45?16:0,hailCape=clamp((cape-600)/45,0,28),hailFz=fz>=1800&&fz<=3600?12:(fz>0?5:0),hail=clamp(storm*.28+hailRadar+hailCape+hailFz,0,95);"
          new_hail = "  const hailTrigger=latestDbz>=40||(tp>=15&&cape>=250)||(cape>=700&&li<=-1)||(rr>=0.5&&cape>=400);\n  let hail=0;\n  if(hailTrigger){\n    const hailRadar=latestDbz>=55?45:latestDbz>=50?32:latestDbz>=45?18:latestDbz>=40?7:0;\n    const hailCape=clamp((cape-400)/40,0,25),hailLi=li<=-5?12:li<=-3?8:li<=-1?4:0,hailTp=clamp((tp-15)*.25,0,15),hailRain=rr>=2?8:rr>=.5?4:0;\n    hail=hailRadar+hailCape+hailLi+hailTp+hailRain;\n    if(fz>0){if(fz>=1800&&fz<=3600)hail*=1.15;else if(fz>=1200&&fz<=4500)hail*=1.05;else hail*=.90;}\n    hail=clamp(hail,0,95);\n  }"
          if old_hail not in s:
              raise SystemExit('Expected hail formula source not found; refusing unsafe patch')
          s = s.replace(old_hail, new_hail, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Radar: gate hail risk on convective signal"
          git push
