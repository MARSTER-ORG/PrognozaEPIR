name: One-shot PROB30 semantics fix
on:
  push:
    branches:
      - "fix/taf-prob30-tempo-semantics-2026-09-14"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/taf-prob30-tempo-semantics-2026-09-14
      - name: Apply source patch
        run: python scripts/tmp_patch_prob30.py
      - name: Validate
        run: |
          node --check taf-engine-v2.js
          node --check tests/taf-engine-v2.test.js
          node tests/taf-engine-v2.test.js
      - name: Remove migration artifacts
        run: |
          rm -f scripts/tmp_patch_prob30.py
          rm -f .github/workflows/apply-prob30-semantics-fix.yml
      - name: Commit source result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add taf-engine-v2.js tests/taf-engine-v2.test.js scripts/tmp_patch_prob30.py .github/workflows/apply-prob30-semantics-fix.yml
          git commit -m "fix: rozróżnij PROB30 i PROB30 TEMPO"
          git push
