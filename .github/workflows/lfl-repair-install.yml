name: Install resilient Europe-wide LFL repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lfl-repair-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair LFL frontend and collector continuity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1. Do not let the radar cleanup remove the real MTG LI LFL control.
          p = Path('radar-intelligence.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "const obsoleteIds = ['lightningToggle','blitzortungLive','mtgLiToggle','mtgIrToggle','mtgIr105Toggle','mtgGeoToggle'];",
              "const obsoleteIds = ['blitzortungLive','mtgLiToggle','mtgIrToggle','mtgIr105Toggle','mtgGeoToggle'];"
          )
          s = s.replace(
              "/Wyładowania LFL|Blitzortung LIVE|MTG IR10\\.5|MTG Geo/i",
              "/Blitzortung LIVE|MTG IR10\\.5|MTG Geo/i"
          )
          p.write_text(s, encoding='utf-8')

          # 2. Load LFL after radar-intelligence, so late cleanup cannot delete it.
          p = Path('radar.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n?<script src="lightning-layer\.js[^\"]*"></script>', '', s)
          pat = r'(<script src="radar-intelligence\.js[^\"]*"></script>)'
          repl = r'\1\n<script src="lightning-layer.js?v=20260915-lfl-r7"></script>'
          s, n = re.subn(pat, repl, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate radar-intelligence.js in radar.html')
          p.write_text(s, encoding='utf-8')

          # 3. Make the LFL information card independent of the removed legacy storm card.
          p = Path('lightning-layer.js')
          s = p.read_text(encoding='utf-8')
          old = """  function ensurePanel(){\n    const card=$('stormHobbyCard');if(!card||card.dataset.lflV3==='1')return Boolean(card);"""
          new = """  function ensurePanel(){\n    let card=$('stormHobbyCard');\n    if(!card){\n      const mapCard=$('map')?.closest('.card');\n      if(mapCard){\n        card=document.createElement('section');card.id='stormHobbyCard';card.className='card';card.style.marginTop='8px';\n        mapCard.insertAdjacentElement('afterend',card);\n      }\n    }\n    if(!card||card.dataset.lflV3==='1')return Boolean(card);"""
          if old not in s:
              raise SystemExit('Could not locate ensurePanel() anchor in lightning-layer.js')
          s = s.replace(old, new, 1)

          # Treat a server-side transient error as a fetch failure when a last good
          # browser snapshot is already present. This avoids wiping the map/card.
          old = """      if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();if(j?.schema!=='prognozaepir-lightning-features-v1')throw new Error('unexpected schema');\n      features=j;lastFetch=Date.now();window.PrognozaEPIRLightningFeatures=features;removeLegacyAfa();syncMapButtonAvailability();renderOverlay();renderPanel();updateConvectionTile(evidence(window.PrognozaEPIRConvectionNowcast||{}));"""
          new = """      if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();if(j?.schema!=='prognozaepir-lightning-features-v1')throw new Error('unexpected schema');\n      if(j?.status!=='ok'&&features?.status==='ok')throw new Error(j?.reason||`collector status ${j?.status||'unknown'}`);\n      features=j;lastFetch=Date.now();\n      if(features?.status==='ok'){try{localStorage.setItem('prognozaepir:lfl:last-good',JSON.stringify(features));}catch(_){}}\n      window.PrognozaEPIRLightningFeatures=features;removeLegacyAfa();syncMapButtonAvailability();renderOverlay();renderPanel();updateConvectionTile(evidence(window.PrognozaEPIRConvectionNowcast||{}));"""
          if old not in s:
              raise SystemExit('Could not locate LFL load success anchor')
          s = s.replace(old, new, 1)

          old = """    }catch(err){\n      features={schema:'prognozaepir-lightning-features-v1',status:'error',updated_at:new Date().toISOString(),reason:String(err)};window.PrognozaEPIRLightningFeatures=features;syncMapButtonAvailability();renderPanel();updateConvectionTile();return features;\n    }finally{loading=false;}"""
          new = """    }catch(err){\n      let previous=features?.status==='ok'?features:null;\n      if(!previous){try{const cached=JSON.parse(localStorage.getItem('prognozaepir:lfl:last-good')||'null');if(cached?.schema==='prognozaepir-lightning-features-v1'&&cached?.status==='ok')previous=cached;}catch(_){}}\n      features=previous?{...previous,collector_health:{status:'degraded',reason:String(err),checked_at:new Date().toISOString()}}:{schema:'prognozaepir-lightning-features-v1',status:'error',updated_at:new Date().toISOString(),reason:String(err)};\n      window.PrognozaEPIRLightningFeatures=features;syncMapButtonAvailability();renderOverlay();renderPanel();updateConvectionTile(previous?evidence(window.PrognozaEPIRConvectionNowcast||{}):undefined);return features;\n    }finally{loading=false;}"""
          if old not in s:
              raise SystemExit('Could not locate LFL load catch anchor')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 4. Give the EUMETSAT catalogue more tolerance for publication/index lag.
          p = Path('scripts/collect_lightning_features.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('LOOKBACK_MIN = 24', 'LOOKBACK_MIN = int(os.environ.get("LFL_LOOKBACK_MIN", "45"))', 1)
          p.write_text(s, encoding='utf-8')

          # 5. The low-memory wrapper must never overwrite the last valid Europe-wide
          # snapshot with an empty transient error snapshot. Point timestamps are left
          # untouched, so local 50 km alert logic cannot mistake old flashes for new.
          p = Path('scripts/collect_lightning_features_lowmem.py')
          s = p.read_text(encoding='utf-8')
          old = """def main() -> int:\n    load_cache()\n    payload = core.collect_and_write()\n    if payload.get(\"status\") in {\"ok\", \"stale\"}:\n        save_cache()"""
          new = """def main() -> int:\n    load_cache()\n    previous = None\n    try:\n        candidate = json.loads(core.OUT.read_text(encoding=\"utf-8\"))\n        if candidate.get(\"schema\") == \"prognozaepir-lightning-features-v1\" and candidate.get(\"status\") in {\"ok\", \"stale\"}:\n            previous = candidate\n    except (OSError, json.JSONDecodeError, AttributeError):\n        pass\n\n    payload = core.collect_and_write()\n    if payload.get(\"status\") == \"error\" and previous is not None:\n        failure_reason = payload.get(\"reason\") or \"temporary LFL collector failure\"\n        payload = dict(previous)\n        payload[\"collector_health\"] = {\n            \"status\": \"degraded\",\n            \"reason\": failure_reason,\n            \"checked_at\": core.iso(core.utc_now()),\n            \"fallback\": \"last-valid-Europe-wide-snapshot\",\n        }\n        core.atomic_json(core.OUT, payload)\n\n    if payload.get(\"status\") in {\"ok\", \"stale\"}:\n        save_cache()"""
          if old not in s:
              raise SystemExit('Could not locate low-memory main() anchor')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- radar.html radar-intelligence.js lightning-layer.js scripts/collect_lightning_features.py scripts/collect_lightning_features_lowmem.py
          if git diff --quiet; then
            echo 'LFL repair already installed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.html radar-intelligence.js lightning-layer.js scripts/collect_lightning_features.py scripts/collect_lightning_features_lowmem.py
          git commit -m 'Restore Europe-wide LFL map, panel and collector continuity'
          git push
