name: Cache-bust fog meteogram assets once

on:
  push:
    paths:
      - '.github/workflows/cache-bust-fog-meteogram-once.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair fog runtime deployment contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep browser asset URLs fresh. The replacements are deliberately
          # idempotent because the first one-shot run may already have updated them.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'fog-engine.js?v=20260911-7': 'fog-engine.js?v=20260918-fog1',
              'mifg-engine.js?v=20260911-7': 'mifg-engine.js?v=20260918-mifg2',
              'br-engine.js?v=20260917-brsync1': 'br-engine.js?v=20260918-brsync2',
              'fog-meteogram-overlay.js?v=20260917-brsync1': 'fog-meteogram-overlay.js?v=20260918-panel-sync2',
              'fog-summary-layout.js?v=20260911-7': 'fog-summary-layout.js?v=20260918-fog1',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # pages-v2 validation intentionally treats this VERSION string as a
          # compatibility contract. Preserve it and expose the implementation
          # revision separately instead of changing VERSION.
          p = Path('br-engine.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("VERSION:'1.0.1-br-meteogram-sync',", "VERSION:'1.0.0-br-target',\n    BUILD:'1.0.1-br-meteogram-sync',")
          if "VERSION:'1.0.0-br-target'" not in s:
              raise SystemExit('BR compatibility VERSION marker missing')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit deployment repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html br-engine.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore BR Pages contract and refresh fog assets'
          git push origin HEAD:main
