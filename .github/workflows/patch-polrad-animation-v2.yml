name: Patch POLRAD animation v2

on:
  push:
    paths:
      - '.github/workflows/patch-polrad-animation-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/patch-polrad-animation-v2.py
      - name: Validate JavaScript
        run: |
          node --check radar-intelligence.js
          node --check opera-nowcast.js
      - name: Commit fix and remove temporary patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/patch-polrad-animation-v2.py .github/workflows/patch-polrad-animation-v2.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Fix frozen first POLRAD animation frame'
          git push
