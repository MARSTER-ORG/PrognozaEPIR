name: Apply TAF Engine 2.2 policy fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taf-engine-2-2-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply migration
        run: |
          python3 scripts/taf-engine-2-2-fix.py
          git restore .github/workflows/pages-v2.yml .github/workflows/pages.yml

      - name: Validate engine and regression suite
        run: |
          node --check taf-engine-v2.js
          node --check taf-app-v2.js
          node tests/taf-engine-v2.test.js
          grep -F 'TAF ENGINE 2.2.0 · INSTRUCTION FIRST' taf.html
          grep -F 'taf-engine-v2.js?v=2.2.0' taf.html
          grep -F 'taf-app-v2.js?v=2.2.0' taf.html
          grep -F 'prognozaepir-taf-engine-v2' taf.html
          grep -F 'lowWindWholePeriodMinFraction:.75' taf-engine-v2.js
          grep -F 'cloudCandidateCredible' taf-engine-v2.js
          grep -F 'fogUntil=Date.now()+8000' taf-app-v2.js

      - name: Commit tested correction
        shell: bash
        run: |
          git config user.name 'PrognozaEPIR bot'
          git config user.email 'actions@users.noreply.github.com'
          git add taf-engine-v2.js taf-app-v2.js taf.html tests/taf-engine-v2.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'fix: TAF 2.2 cloud credibility and VRB02 policy'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
