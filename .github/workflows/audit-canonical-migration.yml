name: One-shot canonical source migration

on:
  push:
    branches:
      - audit/canonical-runtime-20260913
    paths:
      - '.github/workflows/audit-canonical-migration.yml'
      - 'scripts/canonical_migration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/canonical-runtime-20260913
          fetch-depth: 0
      - name: Apply migration
        run: |
          python3 scripts/canonical_migration.py
          node --check taf-engine-v2.js
          node --check taf-app-v2.js
          node --check message-archive-client.js
          node --check utc-ui-guard.js
          node tests/taf-engine-v2.test.js
      - name: Commit canonical source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Canonical migration already applied.'
            exit 0
          fi
          git commit -m 'audit: canonicalize UI and TAF 2.3.1 runtime'
          git pull --rebase origin audit/canonical-runtime-20260913
          git push origin HEAD:audit/canonical-runtime-20260913
