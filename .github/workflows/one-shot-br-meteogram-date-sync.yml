name: One-shot BR meteogram and fog dates sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-br-meteogram-date-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch BR source and event date labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch anchor: {label}')
              return text.replace(old, new, 1)

          # Meteogram: load authoritative BR engine and keep its UI hidden on index.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '#fogEngine,#fogEngineModeSwitch,#fogVNextDiagnostics,#fogSummaryStructured,#fogAuxStructured{display:none!important}',
              '#fogEngine,#fogEngineModeSwitch,#fogVNextDiagnostics,#fogSummaryStructured,#fogAuxStructured,#brEngine{display:none!important}',
          )
          s = replace_required(
              s,
              '<script src="mifg-engine.js?v=20260911-7"></script>\n<script src="fog-meteogram-overlay.js?v=20260912-1"></script>',
              '<script src="mifg-engine.js?v=20260911-7"></script>\n<script src="br-engine.js?v=20260917-brsync1"></script>\n<script src="fog-meteogram-overlay.js?v=20260917-brsync1"></script>',
              'index BR scripts',
          )
          p.write_text(s, encoding='utf-8')

          # Meteogram overlay: use PrognozaEPIRBRSeries published by br-engine.js.
          p = Path('fog-meteogram-overlay.js')
          s = p.read_text(encoding='utf-8')
          old = '''  function brAt(t) {\n    const fog = fogAt(t);\n    if (!fog) return null;\n    const score = brScoreForFogRow(fog);\n    return finite(score) ? {...fog,score} : null;\n  }\n\n  function brSeries() {\n    const rows = window.PrognozaEPIRFogSeries;\n    if (!Array.isArray(rows)) return [];\n    const out = rows.map(row => {\n      const score = brScoreForFogRow(row);\n      return finite(score) ? {...row,score} : null;\n    }).filter(Boolean);\n    window.PrognozaEPIRBRSeries = out;\n    return out;\n  }'''
          new = '''  function brSeries() {\n    const published = window.PrognozaEPIRBRSeries;\n    if (Array.isArray(published) && published.length) {\n      return published\n        .filter(row => row && finite(Number(row.t)) && finite(Number(row.score)))\n        .slice()\n        .sort((a,b) => Number(a.t) - Number(b.t));\n    }\n    // Fallback only until the dedicated BR engine publishes its series.\n    // Do not write this fallback back to PrognozaEPIRBRSeries, otherwise it\n    // could overwrite the authoritative BR result used by the standalone panel.\n    const rows = window.PrognozaEPIRFogSeries;\n    if (!Array.isArray(rows)) return [];\n    return rows.map(row => {\n      const score = brScoreForFogRow(row);\n      return finite(score) ? {...row,score} : null;\n    }).filter(Boolean);\n  }\n\n  function brAt(t) {\n    const rows = brSeries();\n    if (!rows.length || !finite(t)) return null;\n    let best = null, bestDiff = Infinity;\n    for (const row of rows) {\n      if (!row || !finite(Number(row.t)) || !finite(Number(row.score))) continue;\n      const d = Math.abs(Number(row.t) - t);\n      if (d < bestDiff) { best = row; bestDiff = d; }\n    }\n    return bestDiff <= MAX_MATCH_MS ? best : null;\n  }'''
          s = replace_required(s, old, new, 'overlay BR authoritative series')
          old = "  window.addEventListener('prognozaepir:mifg-series-updated', () => { redraw(); queueMicrotask(renderMifgCard); queueMicrotask(renderBrCard); });\n"
          new = old + "  window.addEventListener('prognozaepir:br-series-updated', () => { redraw(); queueMicrotask(renderBrCard); });\n"
          s = replace_required(s, old, new, 'overlay BR redraw event')
          p.write_text(s, encoding='utf-8')

          # FG summary: date + time for event window and peak period.
          p = Path('fog-engine.js')
          s = p.read_text(encoding='utf-8')
          s = replace_required(
              s,
              "${ev.onset?localHour(ev.onset)+' → '+(ev.end?localHour(ev.end):'dalej'):'brak sygnału ≥50 w 48 h'}",
              "${ev.onset?localDateTime(ev.onset)+' UTC → '+(ev.end?localDateTime(ev.end)+' UTC':'dalej'):'brak sygnału ≥50 w 48 h'}",
              'FG event window date',
          )
          s = replace_required(
              s,
              "${peak.score>=50?fmt0(peak.score)+'/100 · '+(ev.peakFrom?localHour(ev.peakFrom)+'–'+localHour(ev.peakTo):localHour(peak.t)):'brak operacyjnej mgły'}",
              "${peak.score>=50?fmt0(peak.score)+'/100 · '+(ev.peakFrom?localDateTime(ev.peakFrom)+' UTC – '+localDateTime(ev.peakTo)+' UTC':localDateTime(peak.t)+' UTC'):'brak operacyjnej mgły'}",
              'FG peak date',
          )
          p.write_text(s, encoding='utf-8')

          # BR panel: date + time for maximum and window.
          p = Path('br-engine.js')
          s = p.read_text(encoding='utf-8')
          anchor = '''  function localHour(t) {\n    try { return new Intl.DateTimeFormat('pl-PL', {timeZone:'UTC', hour:'2-digit', minute:'2-digit'}).format(new Date(t)) + ' UTC'; }\n    catch (_) { return new Date(t).toISOString().slice(11, 16) + ' UTC'; }\n  }'''
          replacement = anchor + '''\n\n  function localDateTime(t) {\n    try { return new Intl.DateTimeFormat('pl-PL', {timeZone:'UTC', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}).format(new Date(t)) + ' UTC'; }\n    catch (_) { const d=new Date(t); return d.toISOString().slice(8,10)+'.'+d.toISOString().slice(5,7)+' '+d.toISOString().slice(11,16)+' UTC'; }\n  }'''
          s = replace_required(s, anchor, replacement, 'BR localDateTime helper')
          s = replace_required(s, "${Math.round(peak.score)}/100 · ${localHour(peak.t)}", "${Math.round(peak.score)}/100 · ${localDateTime(peak.t)}", 'BR peak date')
          s = replace_required(s, "${win ? `${localHour(win.from)}–${localHour(win.to)}` : 'BRAK'}", "${win ? `${localDateTime(win.from)}–${localDateTime(win.to)}` : 'BRAK'}", 'BR window date')
          p.write_text(s, encoding='utf-8')

          # MIFG standalone panel: date + time for peak and event window.
          p = Path('fog-page-layout.js')
          s = p.read_text(encoding='utf-8')
          anchor = '''  function fmtUtc(t) {\n    if (!finite(t)) return '—';\n    try {\n      return new Intl.DateTimeFormat('pl-PL', {\n        timeZone: 'UTC', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'\n      }).format(new Date(t)) + ' UTC';\n    } catch (_) {\n      return new Date(t).toISOString().slice(11, 16) + ' UTC';\n    }\n  }'''
          replacement = anchor + '''\n\n  function fmtUtcDate(t) {\n    if (!finite(t)) return '—';\n    try {\n      return new Intl.DateTimeFormat('pl-PL', {\n        timeZone:'UTC', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'\n      }).format(new Date(t)) + ' UTC';\n    } catch (_) {\n      const d=new Date(t); return d.toISOString().slice(8,10)+'.'+d.toISOString().slice(5,7)+' '+d.toISOString().slice(11,16)+' UTC';\n    }\n  }'''
          s = replace_required(s, anchor, replacement, 'MIFG fmtUtcDate helper')
          s = replace_required(s, "Math.round(ps) + '/100 · ' + fmtUtc(num(peak.t))", "Math.round(ps) + '/100 · ' + fmtUtcDate(num(peak.t))", 'MIFG peak date')
          s = replace_required(s, "`${fmtUtc(win.from)}–${fmtUtc(win.to)}`", "`${fmtUtcDate(win.from)}–${fmtUtcDate(win.to)}`", 'MIFG window date')
          p.write_text(s, encoding='utf-8')

          # Visibility supplemental cells: also show date with occurrence time.
          p = Path('fog-visibility-cells.js')
          s = p.read_text(encoding='utf-8')
          anchor = '''  function fmtUtc(t) {\n    if (!finite(t)) return '—';\n    try {\n      return new Intl.DateTimeFormat('pl-PL', {timeZone:'UTC', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).format(new Date(t)) + ' UTC';\n    } catch (_) { return new Date(t).toISOString().slice(11, 16) + ' UTC'; }\n  }'''
          replacement = anchor + '''\n\n  function fmtUtcDate(t) {\n    if (!finite(t)) return '—';\n    try {\n      return new Intl.DateTimeFormat('pl-PL', {timeZone:'UTC', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).format(new Date(t)) + ' UTC';\n    } catch (_) {\n      const d=new Date(t); return d.toISOString().slice(8,10)+'.'+d.toISOString().slice(5,7)+' '+d.toISOString().slice(11,16)+' UTC';\n    }\n  }'''
          s = replace_required(s, anchor, replacement, 'visibility fmtUtcDate helper')
          s = s.replace('fmtUtc(num(min.t))', 'fmtUtcDate(num(min.t))')
          s = s.replace('fmtUtc(num(ref.t))', 'fmtUtcDate(num(ref.t))')
          s = s.replace('fmtUtc(num(peak.t))', 'fmtUtcDate(num(peak.t))')
          p.write_text(s, encoding='utf-8')

          # Bust cache on standalone page for modified modules.
          p = Path('fog.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('br-engine.js?v=20260917-br1', 'br-engine.js?v=20260917-brsync1')
          s = s.replace('fog-page-layout.js?v=20260917-1', 'fog-page-layout.js?v=20260917-date2')
          s = s.replace('fog-visibility-cells.js?v=20260917-1', 'fog-visibility-cells.js?v=20260917-date2')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet -- index.html fog-meteogram-overlay.js fog-engine.js br-engine.js fog-page-layout.js fog-visibility-cells.js fog.html; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'prognozaepir-br-sync'
          git config user.email 'br-sync@prognozaepir.invalid'
          git add index.html fog-meteogram-overlay.js fog-engine.js br-engine.js fog-page-layout.js fog-visibility-cells.js fog.html
          git commit -m 'fix: draw authoritative BR and show dates for fog events'
          git push
