name: Migrate bulletin consumers to GitHub archive v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-consumers-to-github-archive-v2.yml'

permissions:
  contents: write

concurrency:
  group: migrate-consumers-to-github-archive-v2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch all active bulletin consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              out, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          # Shared MessageArchive: GitHub Pages first, raw GitHub fallback only.
          p = Path('message-archive-client.js')
          s = p.read_text(encoding='utf-8')
          s = sub_once(
              s,
              r"  // Frontend boundary: this client reads the central archive only\. It must never\n  // contact IMGW, AWC, PilotHub or any other bulletin provider directly\.\n  // Railway is the authoritative live acquisition engine\. GitHub is the durable\n  // published mirror and must only be used as a fallback for current reads\.\n  const GITHUB_ROOT = 'https://raw\.githubusercontent\.com/MARSTER-ORG/PrognozaEPIR/main/data/messages';\n  const STATIC_ROOT = 'data/messages';\n  const RAILWAY_ROOT = 'https://central-ingestor-production\.up\.railway\.app/data/messages';\n  const CUSTOM_ROOT = window\.PROGNOZAEPIR_ARCHIVE_ROOT\n    \? String\(window\.PROGNOZAEPIR_ARCHIVE_ROOT\)\.replace\(/\\/\+\$/,''\)\n    : '';\n  const PRIMARY_ROOT = CUSTOM_ROOT \|\| RAILWAY_ROOT;",
              "  // Frontend boundary: consumers read bulletin data only from the durable GitHub archive.\n  // Railway acquires and mirrors bulletins into GitHub, but browser modules never read Railway directly.\n  // The deployed Pages copy is primary; raw.githubusercontent.com is the GitHub-only fallback.\n  const GITHUB_ROOT = 'https://raw.githubusercontent.com/MARSTER-ORG/PrognozaEPIR/main/data/messages';\n  const STATIC_ROOT = 'data/messages';\n  const PRIMARY_ROOT = STATIC_ROOT;",
              'MessageArchive source block'
          )
          s = sub_once(s, r"  function readRoots\(\)\{.*?\n  \}\n\n  async function fetchJson", "  function readRoots(){\n    return [STATIC_ROOT, GITHUB_ROOT];\n  }\n\n  async function fetchJson", 'MessageArchive readRoots', re.S)
          s = s.replace('MessageArchive ${name}: live/GitHub/static archive unavailable', 'MessageArchive ${name}: GitHub archive unavailable')
          s = sub_once(s, r"  async function status\(force=false\)\{.*?\n  \}", "  async function status(force=false){\n    return fetchJson('status.json', force);\n  }", 'MessageArchive status', re.S)
          s = sub_once(s, r"    root: PRIMARY_ROOT,\n    liveRoot: RAILWAY_ROOT,\n    githubRoot: GITHUB_ROOT,\n    fallbackRoot: GITHUB_ROOT,\n    staticFallbackRoot: STATIC_ROOT,", "    root: PRIMARY_ROOT,\n    liveRoot: STATIC_ROOT,\n    githubRoot: GITHUB_ROOT,\n    fallbackRoot: GITHUB_ROOT,\n    staticFallbackRoot: STATIC_ROOT,", 'MessageArchive API roots')
          if 'central-ingestor-production.up.railway.app/data/messages' in s or 'RAILWAY_ROOT' in s or 'PROGNOZAEPIR_ARCHIVE_ROOT' in s:
              raise SystemExit('message-archive-client.js still permits Railway/custom bulletin reads')
          p.write_text(s, encoding='utf-8')

          # ARCH page: Pages copy + raw GitHub only.
          p = Path('arch.html')
          s = p.read_text(encoding='utf-8')
          s = sub_once(s, r"  const LIVE_ROOT=String\(window\.PROGNOZAEPIR_ARCHIVE_ROOT\|\|'https://central-ingestor-production\.up\.railway\.app/data/messages'\)\.replace\(/\\/\+\$/,''\);\n  const GITHUB_ROOT='https://raw\.githubusercontent\.com/MARSTER-ORG/PrognozaEPIR/main/data/messages';\n  const STATIC_ROOT='data/messages';", "  const GITHUB_ROOT='https://raw.githubusercontent.com/MARSTER-ORG/PrognozaEPIR/main/data/messages';\n  const STATIC_ROOT='data/messages';", 'ARCH roots')
          s = sub_once(s, r"  async function fetchArchiveFile\(path\)\{.*?\n  function parseJsonl", "  async function fetchArchiveFile(path){const stamp=Date.now();let pagesError=null;try{return await fetchText(`${STATIC_ROOT}/${path}?v=${stamp}`)}catch(e){pagesError=e}try{return await fetchText(`${GITHUB_ROOT}/${path}?v=${stamp}`)}catch(e){if(pagesError?.status===404&&e?.status===404)return '';throw new Error(`Nie udało się odczytać ${path} z archiwum GitHub.`)}}\n  function parseJsonl", 'ARCH fetchArchiveFile', re.S)
          if 'central-ingestor-production.up.railway.app/data/messages' in s or 'LIVE_ROOT' in s or 'PROGNOZAEPIR_ARCHIVE_ROOT' in s:
              raise SystemExit('arch.html still permits Railway/custom bulletin reads')
          p.write_text(s, encoding='utf-8')

          # TAF verification history: Pages copy + raw GitHub only.
          p = Path('taf-verification.js')
          s = p.read_text(encoding='utf-8')
          s = sub_once(s, r"  const LIVE_ARCHIVE_BASE='https://central-ingestor-production\.up\.railway\.app/data/messages/';\n  const CENTRAL_RAW_BASE='https://raw\.githubusercontent\.com/MARSTER-ORG/PrognozaEPIR/main/data/messages/';", "  const GITHUB_PAGES_BASE='data/messages/';\n  const CENTRAL_RAW_BASE='https://raw.githubusercontent.com/MARSTER-ORG/PrognozaEPIR/main/data/messages/';", 'TAF verifier roots')
          s = sub_once(s, r"  function centralDayUrls\(kind,day\)\{.*?\n  \}\n  async function fetchMetarDay", "  function centralDayUrls(kind,day){\n    const [y,m,d]=day.split('-'),stamp=Date.now();\n    return [\n      `${GITHUB_PAGES_BASE}${kind}/${y}/${m}/${d}.jsonl?pages=${stamp}`,\n      `${CENTRAL_RAW_BASE}${kind}/${y}/${m}/${d}.jsonl?raw=${stamp}`\n    ];\n  }\n  async function fetchMetarDay", 'TAF verifier centralDayUrls', re.S)
          if 'central-ingestor-production.up.railway.app/data/messages' in s or 'LIVE_ARCHIVE_BASE' in s:
              raise SystemExit('taf-verification.js still contains Railway bulletin read path')
          p.write_text(s, encoding='utf-8')

          # Bust stale browser cache for the shared archive client.
          for p in list(Path('.').glob('*.html')) + list(Path('.').glob('*.js')):
              s = p.read_text(encoding='utf-8', errors='replace')
              t = s.replace('message-archive-client.js?v=live-first-v5', 'message-archive-client.js?v=github-only-v1')
              if t != s:
                  p.write_text(t, encoding='utf-8')

          # Permanent CI guard against direct Railway bulletin reads in browser/API code.
          p = Path('scripts/check_archive_boundaries.py')
          s = p.read_text(encoding='utf-8')
          if 'Railway central archive' not in s:
              anchor = '    "legacy TAF proxy": re.compile(r"/api/taf-proxy", re.I),\n'
              if anchor not in s:
                  raise SystemExit('archive boundary anchor missing')
              s = s.replace(anchor, anchor + '    "Railway central archive": re.compile(r"central-ingestor-production\\.up\\.railway\\.app/data/messages", re.I),\n')
          s = s.replace('Frontend code and Vercel API handlers must read data/messages via the shared\nMessageArchive client, never acquire METAR/TAF directly.', 'Frontend code and Vercel API handlers must read the GitHub data/messages archive,\nnever Railway or bulletin providers directly.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify GitHub-only bulletin boundary
        run: |
          node --check message-archive-client.js
          node --check taf-verification.js
          python3 -m py_compile scripts/check_archive_boundaries.py
          python3 scripts/check_archive_boundaries.py
          if grep -R -n -E 'central-ingestor-production\.up\.railway\.app/data/messages' --include='*.html' --include='*.js' --exclude-dir=.git .; then
            echo 'Browser/API Railway bulletin read remains' >&2
            exit 1
          fi
          if grep -R -n -E 'PROGNOZAEPIR_ARCHIVE_ROOT' --include='*.html' --include='*.js' --exclude-dir=.git .; then
            echo 'Custom bulletin archive override remains' >&2
            exit 1
          fi
          grep -F "return [STATIC_ROOT, GITHUB_ROOT];" message-archive-client.js
          grep -F "const GITHUB_PAGES_BASE='data/messages/';" taf-verification.js

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add message-archive-client.js arch.html taf-verification.js scripts/check_archive_boundaries.py '*.html' '*.js'
          if git diff --cached --quiet; then
            echo 'No migration changes'
            exit 0
          fi
          git commit -m 'architecture: read bulletins only from GitHub archive'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push retry ${attempt}"
            sleep $((attempt*3))
          done
          exit 1
