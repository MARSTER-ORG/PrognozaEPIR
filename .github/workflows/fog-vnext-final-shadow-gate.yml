name: Fog vNext final shadow gate

on:
  push:
    branches:
      - fog-vnext-physics-20260915
    paths:
      - 'fog-physics-vnext.js'
      - 'fog-vnext-probability-layer.js'
      - 'fog-vnext-transition-risk.js'
      - 'scripts/fog_vnext_*.py'
      - 'scripts/fog_vnext_*.js'
      - 'scripts/build_fog_transition_priors_vnext.py'
      - 'scripts/build_fog_event_learning_v2.py'
      - 'scripts/build_adaptive_weights_v2.py'
      - 'tests/fog-physics-vnext.test.js'
      - 'tests/fog-vnext-transition-risk.test.js'
      - 'tests/test_fog_vnext_*.py'
      - 'tests/test_fog_transition_priors_vnext.py'
      - 'data/learning/fog-vnext-promotion.json'
      - '.github/workflows/fog-vnext-final-shadow-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-shadow-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Attach canonical EPIR history 2020-2026
        run: |
          git fetch origin main
          git checkout origin/main -- data/import/epir-history
          test -f data/import/epir-history/fog_training_2020_2024_corrected_v2.zip
          git fetch origin fix/supabase-message-mirror-2025
          git restore --source=origin/fix/supabase-message-mirror-2025 --worktree -- data/messages
          test -d data/messages/metar/2025
          for y in 2020 2021 2022 2023 2024 2025 2026; do test -d "data/messages/synop/$y"; done

      - name: Materialize canonical aviation truth 2020-2024
        run: python3 scripts/fog_vnext_materialize_truth.py

      - name: Syntax and unit-contract checks
        run: |
          node --check fog-physics-vnext.js
          node --check fog-vnext-probability-layer.js
          node --check fog-vnext-transition-risk.js
          node --check scripts/fog_vnext_eval.js
          python3 -m py_compile \
            scripts/fog_vnext_verification.py \
            scripts/fog_vnext_verification_censored.py \
            scripts/fog_vnext_historical_validation.py \
            scripts/fog_vnext_ssfc_diagnostics.py \
            scripts/fog_vnext_onset_calibration.py
          python3 tests/test_fog_vnext_probability_units.py
          python3 tests/test_fog_vnext_censored_events.py
          python3 tests/test_fog_vnext_ssfc_diagnostics.py
          python3 tests/test_fog_vnext_onset_calibration.py
          node tests/fog-physics-vnext.test.js
          node tests/fog-vnext-transition-risk.test.js

      - name: Build canonical transition priors
        run: python3 scripts/build_fog_transition_priors_vnext.py

      - name: Build censor-aware verification 2020-2026
        run: python3 scripts/fog_vnext_verification_censored.py

      - name: Historical cohorts and diagnostics
        run: |
          python3 scripts/fog_vnext_historical_validation.py
          python3 scripts/fog_vnext_ssfc_diagnostics.py
          python3 scripts/fog_vnext_onset_calibration.py

      - name: Learning wrappers
        run: |
          python3 scripts/build_adaptive_weights_v2.py
          python3 scripts/build_fog_event_learning_v2.py

      - name: Final shadow assertions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/learning/fog-vnext-verification/summary.json').read_text(encoding='utf-8'))
          h=json.loads(Path('data/learning/fog-vnext-historical-validation.json').read_text(encoding='utf-8'))
          x=json.loads(Path('data/learning/fog-vnext-ssfc-diagnostics.json').read_text(encoding='utf-8'))
          o=json.loads(Path('data/learning/fog-vnext-onset-calibration.json').read_text(encoding='utf-8'))
          g=json.loads(Path('data/learning/fog-vnext-activation.json').read_text(encoding='utf-8'))
          p=json.loads(Path('data/learning/fog-vnext-promotion.json').read_text(encoding='utf-8'))
          assert s['schema']=='prognozaepir-fog-vnext-verification-summary-v3'
          assert s['cases'] >= 300
          assert s['metrics']['fog_truth_blend']['event_balanced']['auc'] >= 0.60
          assert s['metrics']['onset_next_1h']['event_balanced']['auc'] >= 0.60
          assert h['schema']=='prognozaepir-fog-vnext-historical-validation-v1'
          assert set(h['years']) == {str(y) for y in range(2020,2027)}
          assert x['schema']=='prognozaepir-fog-vnext-ssfc-diagnostics-v1'
          ssfc=x['overall']['delta_event_auc_full_minus_no_ssfc']
          assert ssfc is None or ssfc >= -0.03
          assert o['schema']=='prognozaepir-fog-vnext-onset-calibration-v1'
          assert o['policy']['selection_year']==2025
          assert o['policy']['untouched_test_year']==2026
          assert o['policy']['truth_not_used_as_predictor'] is True
          assert g['mode']=='shadow'
          assert g['statistical_ready'] is True
          assert g['operational_activation_ready'] is False
          assert p['approved'] is False
          print('FINAL_SHADOW_SUMMARY='+json.dumps({
            'cases': s['cases'],
            'targets': s.get('targets', {}),
            'fog_blend_event': s['metrics']['fog_truth_blend']['event_balanced'],
            'fog_physics_event': s['metrics']['fog_truth_physics']['event_balanced'],
            'fog_direct_event': s['metrics']['fog_truth_direct']['event_balanced'],
            'onset_event': s['metrics']['onset_next_1h']['event_balanced'],
            'dissipation_event': s['metrics']['dissipation_next_1h']['event_balanced'],
            'ssfc_delta_event_auc': ssfc,
            'onset_candidate_accepted': o['accepted_on_2026'],
            'activation': g,
            'tiers': {y:r['cohort']['tier'] for y,r in h['years'].items()},
          }, ensure_ascii=False))
          PY

      - name: Upload final Fog vNext shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: fog-vnext-final-shadow-evidence-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            data/learning/fog-vnext-verification/summary.json
            data/learning/fog-vnext-activation.json
            data/learning/fog-vnext-historical-validation.json
            data/learning/fog-vnext-ssfc-diagnostics.json
            data/learning/fog-vnext-onset-calibration.json
            data/learning/adaptive-weights.json
            data/learning/fog-event-skill.json
