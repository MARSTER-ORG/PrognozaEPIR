name: Shorten BR label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/br-label-short.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace BR heading
        shell: python
        run: |
          from pathlib import Path
          p = Path('fog-meteogram-overlay.js')
          s = p.read_text(encoding='utf-8')
          old = 'ZAMGLENIE (BR) W CIĄGU NAJBLIŻSZEJ GODZINY'
          new = 'BR'
          if old not in s:
              raise SystemExit('Expected BR heading not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Validate
        run: |
          node --check fog-meteogram-overlay.js
          grep -F "'<small>BR</small><strong>'" fog-meteogram-overlay.js

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fog-meteogram-overlay.js
          git commit -m 'ui: shorten BR summary label'
          git pull --rebase origin main
          git push origin HEAD:main
