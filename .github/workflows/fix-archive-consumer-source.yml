name: Fix archive consumer source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-archive-consumer-source.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Unify archive consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          addition = base64.b64decode('').decode('utf-8')
          replacement = base64.b64decode('').decode('utf-8')
          validator = base64.b64decode('').decode('utf-8')

          p = Path('message-archive-client.js')
          s = p.read_text(encoding='utf-8')
          if 'async function fetchArchiveText(' not in s:
              marker = '\n  function readRoots(){'
              if marker not in s:
                  raise SystemExit('message-archive-client.js: readRoots marker not found')
              s = s.replace(marker, addition + marker, 1)
          api_marker = "    status,\n    sourceFor(name){ return cache.get(name)?.source || null; },"
          if '    fetchText: fetchArchiveText,' not in s:
              if api_marker not in s:
                  raise SystemExit('message-archive-client.js: API marker not found')
              s = s.replace(api_marker, "    status,\n    fetchText: fetchArchiveText,\n    sourceFor(name){ return cache.get(name)?.source || cache.get(`text:${name}`)?.source || null; },", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('arch.html')
          s = p.read_text(encoding='utf-8')
          guard = '<script src="utc-ui-guard.js"></script>'
          client_tag = '<script src="message-archive-client.js"></script>'
          if client_tag not in s:
              if guard not in s:
                  raise SystemExit('arch.html: utc guard marker not found')
              s = s.replace(guard, guard + '\n' + client_tag, 1)
          s = s.replace("  const GITHUB_ROOT='https://raw.githubusercontent.com/MARSTER-ORG/PrognozaEPIR/main/data/messages';\n", '')
          s = s.replace("  const STATIC_ROOT='data/messages';\n", '')
          pattern = re.compile(r"  async function fetchText\(url\)\{[^\n]*\}\n  async function fetchArchiveFile\(path\)\{[^\n]*\}\n")
          s2, n = pattern.subn(replacement, s, count=1)
          if n == 1:
              s = s2
          elif 'archive.fetchText(path,true)' not in s:
              raise SystemExit('arch.html: fetch helper marker not found')
          p.write_text(s, encoding='utf-8')
          Path('scripts/check_message_archive_consumers.py').write_text(validator, encoding='utf-8')
          PY

      - name: Validate fix
        run: |
          node --check message-archive-client.js
          python3 scripts/check_message_archive_consumers.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          text = Path('arch.html').read_text(encoding='utf-8')
          for i, block in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)):
              if block.strip():
                  f = Path(f'/tmp/arch-inline-{i}.js')
                  f.write_text(block, encoding='utf-8')
                  subprocess.run(['node', '--check', str(f)], check=True)
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arch.html message-archive-client.js scripts/check_message_archive_consumers.py
          git commit -m 'fix: use one authoritative archive client in ARCH'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
