name: One-shot EPIR default label fix
on:
  push:
    paths:
      - '.github/workflows/one-shot-radar-default-label.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix default radar label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('radar.html')
          s=p.read_text(encoding='utf-8')
          old="$('placeLabel').textContent=(nearDefault?'Inowrocław':'Punkt własny')+' · '+point.lat.toFixed(4)+', '+point.lon.toFixed(4);"
          new="$('placeLabel').textContent=(nearDefault?DEFAULT.name:'Punkt własny')+' · '+point.lat.toFixed(4)+', '+point.lon.toFixed(4);"
          if old not in s:
              raise SystemExit('Expected updatePointUI label not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Validate
        run: grep -q "nearDefault?DEFAULT.name:'Punkt własny'" radar.html
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/one-shot-radar-default-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.html .github/workflows/one-shot-radar-default-label.yml
          git commit -m 'Use EPIR name for radar default point'
          git push origin main
