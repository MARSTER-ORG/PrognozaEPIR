name: Optimize central-ingestor child memory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-central-ingestor-child-memory.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stream acquisition subprocess output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/central_ingestor.py')
          s=p.read_text(encoding='utf-8')
          old='''            proc = run_cmd(argv, timeout=timeout)\n            if proc.returncode == 0:\n'''
          new='''            proc = subprocess.run(\n                argv,\n                cwd=ROOT,\n                timeout=timeout,\n                check=False,\n            )\n            if proc.returncode == 0:\n'''
          if old not in s:
              raise SystemExit('run_step capture block missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile scripts/central_ingestor.py
          grep -F 'proc = subprocess.run(' scripts/central_ingestor.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/central_ingestor.py
          git commit -m 'Stream ingestor subprocess logs to reduce peak RAM'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
