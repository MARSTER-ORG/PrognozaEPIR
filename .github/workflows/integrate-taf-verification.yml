name: Integrate TAF verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-taf-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Embed self-verification in TAF page
        run: |
          node --check taf-verification.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('taf.html')
          s=p.read_text(encoding='utf-8')
          js=Path('taf-verification.js').read_text(encoding='utf-8')
          marker='/* TAF Verification v1.0 inline */'
          if marker not in s:
              addon='<script>\n'+marker+'\n'+js+'\n</script>\n'
              if '</body>' not in s:
                  raise SystemExit('taf.html: closing body not found')
              s=s.replace('</body>',addon+'</body>',1)
          p.write_text(s,encoding='utf-8')

          assert marker in s
          assert 'Sprawdzalność generatora TAF' in s
          assert 'data/observations/metar/' in s
          PY

          python3 - <<'PY'
          from pathlib import Path
          s=Path('taf.html').read_text(encoding='utf-8')
          marker='/* TAF Verification v1.0 inline */'
          pos=s.index(marker)
          start=s.rfind('<script>',0,pos)+len('<script>')
          end=s.find('</script>',pos)
          Path('/tmp/taf-verification-inline.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/taf-verification-inline.js

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taf.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: enable TAF self-verification against METAR"
          git pull --rebase origin main
          git push origin HEAD:main
