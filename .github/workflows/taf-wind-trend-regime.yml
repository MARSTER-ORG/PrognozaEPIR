name: Patch TAF wind trend regime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taf-wind-trend-regime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch trend-aware TAF wind encoding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('taf.html')
          s=p.read_text(encoding='utf-8')

          old_ewin=re.search(r"function ewin\(z\)\{.*?\}function evis",s)
          if not old_ewin:
              raise SystemExit('ewin block not found')
          ewin="""function ewin(z){let sr=Math.round(kt(z.WS)||0),gr=Math.round(kt(z.G)||0);if(sr<1)return'00000KT';let s=sr%2?sr+1:sr,g=gr%2?gr+1:gr,d=sr<3&&z.dirSpread>90?'VRB':pad((Math.round((z.WD||0)/10)*10)%360||360,3),o=d+pad(Math.min(s,98));if(gr-sr>=10)o+='G'+(g>99?'P99':pad(g));return o+'KT'}function evenWindKt(v){let n=Math.max(0,Math.round(v||0));return n%2?n+1:n}function medianNum(a){let q=a.filter(fin).slice().sort((x,y)=>x-y);if(!q.length)return null;let m=Math.floor(q.length/2);return q.length%2?q[m]:(q[m-1]+q[m])/2}function meanWindDir(a){let u=0,v=0,n=0;for(const z of a){if(!fin(z.WD))continue;let q=metVec(1,z.WD);u+=q.u;v+=q.v;n++}return n?vecWind(u/n,v/n).dir:null}function cloneWind(z,speedKt,dirDeg,gustKt=null){let o={...z};o.WS=Math.max(0,speedKt)/1.94384;if(fin(dirDeg))o.WD=dirDeg;o.G=fin(gustKt)?Math.max(speedKt,gustKt)/1.94384:o.WS;return o}function trendWindPlan(a){if(!Array.isArray(a)||a.length<7)return null;let early=a.slice(0,3),es=early.map(z=>Math.round(kt(z.WS)||0)),earlyMed=medianNum(es),earlyEven=evenWindKt(earlyMed);if(!fin(earlyMed)||earlyMed<10||Math.max(...es)-Math.min(...es)>4)return null;let tail=a.slice(-3),lateMed=medianNum(tail.map(z=>Math.round(kt(z.WS)||0))),targetKt=evenWindKt(lateMed);if(!fin(lateMed)||targetKt>6)return null;let plateauStart=a.length-3;while(plateauStart>3&&evenWindKt(Math.round(kt(a[plateauStart-1].WS)||0))===targetKt)plateauStart--;if(a.length-plateauStart<3)return null;let rawDrop=earlyEven-targetKt;if(rawDrop<8||rawDrop>=10)return null;let baseKt=targetKt+10,uplift=baseKt-earlyEven;if(uplift<0||uplift>2)return null;let seq=a.slice(2,plateauStart+1).map(z=>evenWindKt(Math.round(kt(z.WS)||0))),rises=0;for(let i=1;i<seq.length;i++)if(seq[i]>seq[i-1]+2)rises++;if(rises>1)return null;let maxSpread=Math.max(...early.map(z=>fin(z.speedSpreadKt)?z.speedSpreadKt:0)),gustHours=early.filter(z=>{let ss=Math.round(kt(z.WS)||0),gg=Math.round(kt(z.G)||0);return gg-ss>=8&&gg>=20}).length;if(gustHours<1&&maxSpread<1.5)return null;let baseGust=Math.max(...early.map(z=>Math.round(kt(z.G)||0)));if(baseGust<baseKt+10)baseGust=null;let end=a[plateauStart].t,start=Math.max(a[Math.min(3,a.length-1)].t,end-4*36e5);if(!(end>start)&&plateauStart>0)return null;let targetDir=meanWindDir(a.slice(plateauStart));return{baseKt,baseGustKt:baseGust,targetKt,targetDir,s:start,e:end,plateauStart,earlyKt:earlyMed,lateKt:lateMed,upliftKt:uplift,maxSpread,gustHours}}function evis"""
          s=s[:old_ewin.start()]+ewin+s[old_ewin.end():]

          m=re.search(r"function changes\(\)\{.*?\}function build",s)
          if not m:
              raise SystemExit('changes block not found')
          changes="""function changes(wp=null){let out=[],why=[],base=rows[0];if(wp){let trg=cloneWind(rows[wp.plateauStart],wp.targetKt,wp.targetDir,null);out.push({k:'BECMG',s:wp.s,e:wp.e,p:ewin(trg),f:['wiatr'],trendWind:true});why.push(`BECMG ${ddhh(wp.s)}/${ddhhEnd(wp.e)}: trwały trend osłabienia wiatru. Pierwsze 3 h dają około ${wp.earlyKt.toFixed(0)} kt, końcowy utrwalony reżim około ${wp.lateKt.toFixed(0)} kt; bazową prędkość podniesiono tylko o ${wp.upliftKt} kt do ${wp.baseKt} kt, bo wspierają to ${wp.gustHours?'porywy':'rozrzut modeli'}, aby zgodnie z progiem 10 kt jawnie zakodować znaczące osłabienie.`)}for(let i=1;i<rows.length&&out.length<5;i++){let f=diff(base,rows[i]);if(!f.length)continue;let ok=f.filter(x=>i+1<rows.length&&diff(base,rows[i+1]).includes(x));if(!ok.length)continue;let s=Math.max(cycles[ci].start,rows[i].t-36e5),e=Math.min(cycles[ci].end,rows[i].t+36e5);out.push({k:'BECMG',s,e,p:payload(rows[i],ok),f:ok});why.push(`BECMG ${ddhh(s)}/${ddhhEnd(e)}: trwała zmiana ${ok.join(', ')} przekracza próg instrukcji.`);base=rows[i];i++}for(let i=0;i<rows.length&&out.length<5;i++){let z=rows[i],mv=z.mv||[],sw=mv.reduce((s,x)=>s+x.w,0)||1,bv=mv.filter(x=>band(x.vis,V)<band(z.VIS,V)).reduce((s,x)=>s+x.w,0)/sw*100,bc=mv.filter(x=>band(ft(x.ceil),C)<band(ft(z.ceiling),C)).reduce((s,x)=>s+x.w,0)/sw*100,s=z.t,e=Math.min(cycles[ci].end,z.t+36e5);if(z.storm>=30&&z.storm<50){let h=pad(Math.min(999,Math.round(ft(z.lowH||z.ceiling||450)/100)),3);out.push({k:'PROB30 TEMPO',s,e,p:`4000 TSRA BKN${h}CB`,pr:Math.round(z.storm)});why.push(`PROB30 TEMPO ${ddhh(s)}/${ddhhEnd(e)}: konwekcja ma poparcie modeli ${Math.round(z.storm)}%.`)}else if(bv>=30&&bv<50){let vv=Math.max(200,Math.min(z.VIS||5000,...mv.filter(x=>fin(x.vis)).map(x=>x.vis)));out.push({k:'PROB30',s,e,p:`${evis(vv)} ${vv<=900?'FG':'BR'}`,pr:Math.round(bv)});why.push(`PROB30 ${ddhh(s)}/${ddhhEnd(e)}: ryzyko wejścia widzialności w niższy przedział ${Math.round(bv)}%.`)}else if(bc>=30&&bc<50){let cc=Math.min(...mv.filter(x=>fin(x.ceil)).map(x=>x.ceil));if(fin(cc)){out.push({k:'PROB30',s,e,p:`BKN${pad(Math.min(999,Math.round(ft(cc)/100)),3)}`,pr:Math.round(bc)});why.push(`PROB30 ${ddhh(s)}/${ddhhEnd(e)}: ryzyko obniżenia pułapu ${Math.round(bc)}%.`)}}}out.sort((a,b)=>a.s-b.s);return{out:out.slice(0,5),why}}function build"""
          s=s[:m.start()]+changes+s[m.end():]

          m=re.search(r"function build\(\)\{.*?\}function render",s)
          if not m:
              raise SystemExit('build block not found')
          build="""function build(){let c=cycles[ci],wp=trendWindPlan(rows),ch=changes(wp),baseRow=wp?cloneWind(rows[0],wp.baseKt,rows[0].WD,wp.baseGustKt):rows[0],o=`TAF EPIR ${ddhhmm(c.issue)}Z ${ddhh(c.start)}/${ddhhEnd(c.end)} ${state(baseRow)}`;for(let g of ch.out)o+=`\n${g.k} ${ddhh(g.s)}/${ddhhEnd(g.e)} ${g.p}`;o+='=';let ck=[['PROB40',!o.includes('PROB40')],['VV',!o.includes(' VV')],['≤ 5 grup zmian',ch.out.length<=5],['Okres ważności 12 h',(c.end-c.start)===12*36e5]];return{o,ch,ck,wp}}function render"""
          s=s[:m.start()]+build+s[m.end():]

          m=re.search(r"function render\(\)\{.*?\}async function gen",s)
          if not m:
              raise SystemExit('render block not found')
          old=m.group(0)
          body=old[:-len('async function gen')]
          old_conf="$('conf').textContent=`Wiatr: ${w0?.windModels||'—'} modeli, rozrzut kierunku ~${Math.round(w0?.dirSpread||0)}°, rozrzut prędkości ~${(w0?.speedSpreadKt||0).toFixed(1)} kt, korekta do aktualnego METAR ${w0?.windAnchorPct||0}%. Korekta zanika z horyzontem, więc dalszy przebieg pozostaje modelowy.`;"
          new_conf="let tn=r.wp?` Reguła trendu: baza ${evenWindKt(r.wp.earlyKt)}→${r.wp.baseKt} kt, końcowy reżim ${r.wp.targetKt} kt, BECMG ${ddhh(r.wp.s)}/${ddhhEnd(r.wp.e)}.`:'';$('conf').textContent=`Wiatr: ${w0?.windModels||'—'} modeli, rozrzut kierunku ~${Math.round(w0?.dirSpread||0)}°, rozrzut prędkości ~${(w0?.speedSpreadKt||0).toFixed(1)} kt, korekta do aktualnego METAR ${w0?.windAnchorPct||0}%. Korekta zanika z horyzontem, więc dalszy przebieg pozostaje modelowy.${tn}`;"
          if old_conf not in body:
              raise SystemExit('render conf marker not found')
          body=body.replace(old_conf,new_conf,1)
          s=s[:m.start()]+body+'async function gen'+s[m.end():]

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript and rule markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('taf.html').read_text(encoding='utf-8')
          for x in ['function trendWindPlan(a)','rawDrop<8||rawDrop>=10','uplift>2','targetKt>6','maxSpread<1.5','gustHours<1','BECMG ${ddhh(wp.s)}/${ddhhEnd(wp.e)}','baseRow=wp?cloneWind']:
              assert x in s, x
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/taf-inline.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/taf-inline.js

      - name: Commit generator change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taf.html
          git diff --cached --quiet && exit 0
          git commit -m 'TAF: encode sustained wind weakening as significant trend'
          git push origin HEAD:main
