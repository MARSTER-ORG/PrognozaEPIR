name: Finalize wind arrow layer

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-wind-arrow-final-layer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch wind foreground
        run: python3 scripts/patch_wind_arrow_layer.py
      - name: Validate files
        run: |
          node --check meteogram-visfog-cleanup.js
          node --check fog-meteogram-overlay.js
          python3 -m py_compile scripts/prepare_pages.py
      - name: Commit patch
        run: |
          git config user.name prognozaepir-bot
          git config user.email actions@users.noreply.github.com
          git add meteogram-visfog-cleanup.js fog-meteogram-overlay.js scripts/prepare_pages.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Render wind arrows above every meteogram overlay'
          git pull --rebase origin main
          git push origin HEAD:main
