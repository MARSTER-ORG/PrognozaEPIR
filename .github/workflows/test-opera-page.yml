name: Test OPERA radar page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-opera-page.yml'
      - 'opera-convection-bridge.js'
      - 'scripts/railway_ingestor_lowmem_server.py'
      - 'scripts/opera_proxy_only.py'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify merged central OPERA proxy
        shell: bash
        env:
          CENTRAL: https://central-ingestor-production.up.railway.app
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 "$CENTRAL/opera/health" -o /tmp/opera-health.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/opera-health.json',encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('component') == 'opera-cmax-proxy', p
          assert p.get('range') is True, p
          print('PASS: central /opera/health reports merged OPERA CMAX proxy')
          PY

          python3 - <<'PY' >/tmp/opera-frames.txt
          from datetime import datetime, timedelta, timezone
          now=datetime.now(timezone.utc).replace(second=0,microsecond=0)
          now-=timedelta(minutes=now.minute%5)
          for i in range(19):
              print((now-timedelta(minutes=5*i)).strftime('%Y%m%d%H%M'))
          PY

          found=0
          while read -r frame; do
            : >/tmp/opera-headers.txt
            rm -f /tmp/opera-part.bin
            code="$(curl -sS --connect-timeout 10 --max-time 30 \
              -H 'Range: bytes=0-1023' \
              -D /tmp/opera-headers.txt \
              -o /tmp/opera-part.bin \
              -w '%{http_code}' \
              "$CENTRAL/opera/dbzh/$frame.tiff" || true)"
            if [ "$code" != 200 ] && [ "$code" != 206 ]; then
              continue
            fi
            if ! grep -qi '^access-control-allow-origin: \*' /tmp/opera-headers.txt; then
              echo "Frame $frame lacks CORS header" >&2
              continue
            fi
            if ! grep -qi '^accept-ranges: bytes' /tmp/opera-headers.txt; then
              echo "Frame $frame lacks Range support" >&2
              continue
            fi
            if python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/opera-part.bin').read_bytes()[:4]
          raise SystemExit(0 if b in (b'II*\x00', b'MM\x00*') else 1)
          PY
            then
              echo "PASS: central OPERA GeoTIFF frame $frame UTC works with CORS + Range (HTTP $code)"
              found=1
              break
            fi
          done </tmp/opera-frames.txt
          if [ "$found" != 1 ]; then
            echo 'No valid recent OPERA GeoTIFF frame found through central ingestor.' >&2
            exit 1
          fi

      - name: Wait for Pages build containing this commit
        shell: bash
        env:
          SITE: https://marster-org.github.io/PrognozaEPIR
        run: |
          set -euo pipefail
          ASSET_V="${GITHUB_SHA:0:12}"
          echo "Waiting for radar.html asset version $ASSET_V"
          ok=0
          for i in $(seq 1 45); do
            curl -fsS --connect-timeout 10 --max-time 30 "$SITE/radar.html?e2e=$GITHUB_SHA-$i" -o /tmp/radar.html || true
            if grep -Fq "opera-convection-bridge.js?v=$ASSET_V" /tmp/radar.html 2>/dev/null; then
              ok=1
              echo "Pages contains current asset version after attempt $i"
              break
            fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo 'Current Pages build was not published in time.' >&2
            grep -o 'opera-convection-bridge.js?v=[^"[:space:]]*' /tmp/radar.html || true
            exit 1
          fi

      - name: Run radar page in headless Chrome
        shell: bash
        env:
          SITE: https://marster-org.github.io/PrognozaEPIR
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not installed on runner.' >&2
            exit 1
          fi
          URL="$SITE/radar.html?e2e=$GITHUB_SHA"
          echo "Browser: $CHROME"
          echo "URL: $URL"
          set +e
          timeout 150s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --disable-background-networking \
            --window-size=1280,2200 \
            --virtual-time-budget=90000 \
            --dump-dom "$URL" >/tmp/dom.html 2>/tmp/chrome.log
          rc=$?
          set -e
          echo "Chrome exit code: $rc"
          tail -n 120 /tmp/chrome.log || true
          python3 - <<'PY'
          import html, re
          from pathlib import Path
          dom=Path('/tmp/dom.html').read_text(encoding='utf-8',errors='replace')
          def text_for(id_):
              m=re.search(rf'<[^>]+id=["\']{re.escape(id_)}["\'][^>]*>(.*?)</[^>]+>',dom,re.I|re.S)
              if not m: return None
              return re.sub(r'<[^>]+>','',html.unescape(m.group(1))).strip()
          def tag_for_id(id_):
              m=re.search(rf'<[^>]+id=["\']{re.escape(id_)}["\'][^>]*>',dom,re.I|re.S)
              return m.group(0) if m else ''
          def attr(tag,name):
              m=re.search(rf'\b{re.escape(name)}=["\']([^"\']*)["\']',tag,re.I)
              return html.unescape(m.group(1)) if m else None

          state=text_for('opState')
          status=text_for('opStatus')
          frame=text_for('opFrame')
          summary=text_for('opSummary')
          button=tag_for_id('operaCmaxToggle')
          classes=attr(button,'class') or ''
          rendered=attr(button,'data-opera-map-rendered')
          visible=attr(button,'data-opera-visible-pixels')
          significant=attr(button,'data-opera-significant-pixels')
          map_frame=attr(button,'data-opera-frame-utc')
          palette=attr(button,'data-opera-palette')
          pane_present='leaflet-operacmax-pane' in dom.lower()
          overlay_present='opera-cmax-fixed-overlay' in dom

          print('opState =',repr(state))
          print('opFrame =',repr(frame))
          print('opStatus =',repr(status))
          print('opSummary =',repr(summary))
          print('map button class =',repr(classes))
          print('map rendered =',repr(rendered))
          print('map frame =',repr(map_frame))
          print('map palette =',repr(palette))
          print('visible pixels =',repr(visible),'significant =',repr(significant))
          print('pane present =',pane_present,'image overlay present =',overlay_present)

          if state != 'DZIAŁA':
              pos=dom.find('id="operaNowcastCard"')
              if pos>=0: print(dom[pos:pos+5000])
              raise SystemExit('OPERA page did not reach DZIAŁA')
          if not frame or 'UTC' not in frame:
              raise SystemExit('OPERA frame time missing explicit UTC')
          if not button:
              raise SystemExit('OPERA CMAX map button missing')
          if 'active' not in classes.split():
              raise SystemExit('OPERA CMAX map did not auto-enable')
          if rendered != '1':
              raise SystemExit('OPERA CMAX map renderer did not report rendered=1')
          if not map_frame or 'UTC' not in map_frame:
              raise SystemExit('OPERA CMAX map frame missing explicit UTC')
          if palette != 'POLRAD CMAX':
              raise SystemExit('OPERA CMAX map is not using POLRAD CMAX palette')
          if not pane_present:
              raise SystemExit('OPERA CMAX Leaflet pane missing')
          try:
              visible_n=int(visible or '0')
          except ValueError:
              visible_n=0
          if visible_n > 0 and not overlay_present:
              raise SystemExit('OPERA has visible pixels but Leaflet image overlay is missing')
          print('PASS: published radar page rendered OPERA CMAX map layer with POLRAD palette')
          PY
