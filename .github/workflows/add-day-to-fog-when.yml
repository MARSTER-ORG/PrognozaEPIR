name: Add day to fog WHEN cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-day-to-fog-when.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add date to WHEN details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fog-meteogram-overlay.js')
          s = p.read_text(encoding='utf-8')
          old = "  function whenDetail(ev) {\n    if (!ev || ev.peak.score < THRESHOLD || ev.onset === null) return 'brak sygnału ≥40 w 48 h';\n    return localHour(ev.onset) + ' → ' + (ev.end === null ? 'dalej' : localHour(ev.end));\n  }\n"
          new = "  function whenDetail(ev) {\n    if (!ev || ev.peak.score < THRESHOLD || ev.onset === null) return 'brak sygnału ≥40 w 48 h';\n    const from = ev.onset;\n    const to = ev.end;\n    const dateFrom = localDate(from);\n    if (to === null) return dateFrom + ' · ' + localHour(from) + ' → dalej';\n    const dateTo = localDate(to);\n    return dateFrom === dateTo\n      ? dateFrom + ' · ' + localHour(from) + ' → ' + localHour(to)\n      : dateFrom + ' ' + localHour(from) + ' → ' + dateTo + ' ' + localHour(to);\n  }\n"
          if old not in s:
              raise SystemExit('whenDetail block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check fog-meteogram-overlay.js
          grep -F "dateFrom + ' · ' + localHour(from) + ' → ' + localHour(to)" fog-meteogram-overlay.js
          grep -F "dateFrom + ' ' + localHour(from) + ' → ' + dateTo + ' ' + localHour(to)" fog-meteogram-overlay.js

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fog-meteogram-overlay.js
          git commit -m 'ui: show day in fog WHEN cards'
          git pull --rebase origin main
          git push origin HEAD:main
