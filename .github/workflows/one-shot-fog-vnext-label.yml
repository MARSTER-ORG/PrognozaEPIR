name: One-shot Fog vNext UI label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fog-vnext-label.yml'

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace stale Fog Engine label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('fog-engine.js')
          s = p.read_text(encoding='utf-8')
          old = "const ENGINE_VERSION = 'EPIR FOG ENGINE v1.4';"
          new = "const ENGINE_VERSION = 'EPIR FOG ENGINE vNext';"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale label, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check fog-engine.js
          grep -F "const ENGINE_VERSION = 'EPIR FOG ENGINE vNext';" fog-engine.js
          ! grep -F "const ENGINE_VERSION = 'EPIR FOG ENGINE v1.4';" fog-engine.js

      - name: Commit label and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fog-vnext-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fog-engine.js .github/workflows/one-shot-fog-vnext-label.yml
          git commit -m 'ui: label Fog Engine as vNext'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
