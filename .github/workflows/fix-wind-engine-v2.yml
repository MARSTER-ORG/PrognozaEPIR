name: Apply internal EPIR wind calibration v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wind-engine-v2.yml'
permissions:
  contents: write
concurrency:
  group: fix-wind-engine-v2
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch wind engine and learning
        run: python3 scripts/apply_wind_engine_v2.py
      - name: Rebuild adaptive weights
        run: python3 scripts/build_adaptive_weights.py
      - name: Validate
        shell: bash
        run: |
          python3 -m py_compile scripts/build_adaptive_weights.py scripts/apply_wind_engine_v2.py
          python3 -m json.tool data/learning/adaptive-weights.json >/dev/null
          node --check neighbor-observation-context.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'offset:-30' in s and 'offset:-25' not in s
          assert 'neighbor-obs-v4' in s
          assert " · surowy " not in s
          assert " · korekta " not in s
          w=json.loads(Path('data/learning/adaptive-weights.json').read_text(encoding='utf-8'))
          assert w['component_learning']['wind']=={'half_life_days':21.0,'full_samples':60,'peer_scale_pct':26.0}
          assert (226-30)%360 == 196
          print('Validated: 226 -> 196; final-only display; accelerated wind learning')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'prognozaepir-bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf scripts/__pycache__
          git add index.html neighbor-observation-context.js scripts/build_adaptive_weights.py data/learning/adaptive-weights.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Calibrate EPIR wind internally and accelerate learning'
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n*4))
          done
          exit 1
