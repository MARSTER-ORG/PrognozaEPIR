name: BR summary UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/br-summary-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: br-summary-ui
  cancel-in-progress: false

# Trigger after workflow registration.
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Show BR assessment even below threshold
        shell: python
        run: |
          from pathlib import Path

          p = Path('fog-meteogram-overlay.js')
          s = p.read_text(encoding='utf-8')

          old = '''  function renderBrCard() {
    const summary = document.getElementById('fogSummary');
    const rows = brSeries();
    if (!summary || !rows.length) return;
    document.getElementById('brCard')?.remove();
    const now = Date.now();
    const current = rows.reduce((a,b) => Math.abs(b.t-now) < Math.abs(a.t-now) ? b : a, rows[0]);
    const future = rows.filter(row => row.t >= now-HOUR && row.t <= now+12*HOUR);
    const peak = future.reduce((a,b) => !a || b.score > a.score ? b : a, null) || current;
    const card = document.createElement('div');
    card.id = 'brCard';
    const signal = Math.max(current.score, peak.score);
    if (signal < BR_INFO_THRESHOLD) return;
    card.className = 'fog-card ' + (signal >= 80 ? 'fog-risk-vhigh' : signal >= 60 ? 'fog-risk-high' : 'fog-risk-mid');
    card.innerHTML = '<small>Zamglenie · BR</small><strong>teraz ' + Math.round(current.score) + '/100</strong>' +
      '<em>' + brRiskText(signal) + ' · szczyt ' + Math.round(peak.score) + '/100 ' + localHour(peak.t) + '</em>';
    summary.appendChild(card);
  }'''

          new = '''  function brOperationalText(score) {
    if (!finite(score)) return 'BRAK DANYCH';
    if (score < 40) return 'NIE';
    if (score < 60) return 'MOŻLIWE';
    if (score < 80) return 'PRAWDOPODOBNE';
    return 'BARDZO PRAWDOPODOBNE';
  }

  function renderBrCard() {
    const summary = document.getElementById('fogSummary');
    const rows = brSeries();
    if (!summary || !rows.length) return;
    document.getElementById('brCard')?.remove();
    const now = Date.now();
    const current = rows.reduce((a,b) => Math.abs(b.t-now) < Math.abs(a.t-now) ? b : a, rows[0]);
    const future = rows.filter(row => row.t >= now-HOUR && row.t <= now+12*HOUR);
    const peak = future.reduce((a,b) => !a || b.score > a.score ? b : a, null) || current;
    const card = document.createElement('div');
    card.id = 'brCard';
    card.className = 'fog-card ' + (current.score >= 80 ? 'fog-risk-vhigh' : current.score >= 60 ? 'fog-risk-high' : current.score >= 40 ? 'fog-risk-mid' : '');
    const currentDetail = current.score >= BR_INFO_THRESHOLD
      ? Math.round(current.score) + '/100'
      : 'wynik <40/100 pominięty';
    const peakDetail = peak.score >= BR_INFO_THRESHOLD
      ? ' · maks. 12 h ' + Math.round(peak.score) + '/100 ' + localHour(peak.t)
      : ' · brak sygnału ≥40 w 12 h';
    card.innerHTML = '<small>ZAMGLENIE (BR) W CIĄGU NAJBLIŻSZEJ GODZINY</small><strong>' + brOperationalText(current.score) + '</strong>' +
      '<em>' + currentDetail + peakDetail + '</em>';
    summary.appendChild(card);
  }'''

          count = s.count(old)
          if count != 1:
              raise SystemExit(f'renderBrCard: expected exactly one match, got {count}')
          p.write_text(s.replace(old,new,1), encoding='utf-8')

      - name: Validate
        run: |
          node --check fog-meteogram-overlay.js
          grep -F 'ZAMGLENIE (BR) W CIĄGU NAJBLIŻSZEJ GODZINY' fog-meteogram-overlay.js
          grep -F "if (score < 40) return 'NIE';" fog-meteogram-overlay.js
          grep -F 'wynik <40/100 pominięty' fog-meteogram-overlay.js

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fog-meteogram-overlay.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'ui: always show current-hour BR assessment'
          git pull --rebase origin main
          git push origin HEAD:main
