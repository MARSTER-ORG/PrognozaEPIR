name: BR summary UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/br-summary-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/fix_br_summary.py

      - name: Validate
        run: |
          node --check fog-meteogram-overlay.js
          grep -F 'ZAMGLENIE (BR) W CIĄGU NAJBLIŻSZEJ GODZINY' fog-meteogram-overlay.js

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fog-meteogram-overlay.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ui: always show current-hour BR assessment'
          git pull --rebase origin main
          git push origin HEAD:main
