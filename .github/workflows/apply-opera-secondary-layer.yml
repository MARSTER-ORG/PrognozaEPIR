name: Apply OPERA secondary-layer refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-opera-secondary-layer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine OPERA visual role
        shell: python
        run: |
          from pathlib import Path

          p = Path('opera-convection-bridge.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              "  let autoEnabled = false;\n",
              ""
            ),
            (
              "  const finite = Number.isFinite;\n  let fixedLayer = null;",
              "  const finite = Number.isFinite;\n  // OPERA is a secondary Europe-wide control layer. Keep raw values for analysis,\n  // but suppress weak isolated pixels only in the visual map rendering.\n  const VISUAL_MIN_DBZ = 18;\n  const VISUAL_STRONG_DBZ = 27;\n  const VISUAL_NEIGHBOURS = 2;\n  let fixedLayer = null;"
            ),
            (
              "    [20,[0,0,210,145]],\n    [14,[0,0,145,105]],\n    [8,[0,0,85,65]]\n",
              "    [20,[0,0,210,145]],\n    [18,[0,0,145,90]]\n"
            ),
            (
              "  function colorForDbz(v) {\n    if (!finite(v) || v < 8) return [0,0,0,0];",
              "  function colorForDbz(v) {\n    if (!finite(v) || v < VISUAL_MIN_DBZ) return [0,0,0,0];"
            ),
            (
              "  function rasterFor(latest) {\n",
              "  function isVisualEcho(values,n,i,v) {\n    if (!finite(v) || v < VISUAL_MIN_DBZ) return false;\n    if (v >= VISUAL_STRONG_DBZ) return true;\n    const x=i%n,y=Math.floor(i/n);\n    let neighbours=0;\n    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) {\n      if(!dx&&!dy) continue;\n      const xx=x+dx,yy=y+dy;\n      if(xx<0||yy<0||xx>=n||yy>=n) continue;\n      if(Number(values[yy*n+xx])>=VISUAL_MIN_DBZ) neighbours++;\n    }\n    return neighbours>=VISUAL_NEIGHBOURS;\n  }\n\n  function rasterFor(latest) {\n"
            ),
            (
              "      const [r,g,b,a] = colorForDbz(v);\n",
              "      const [r,g,b,a] = isVisualEcho(values,n,i,v) ? colorForDbz(v) : [0,0,0,0];\n"
            ),
            (
              "    const html=`<div><b>OPERA CMAX</b><div class=\"op-value\">${value}</div><div>${echoLabel(v)}</div><div class=\"op-meta\">${Number(latlng.lat).toFixed(4)}°, ${Number(latlng.lng).toFixed(4)}° · ${frame}</div></div>`;",
              "    const html=`<div><b>OPERA Europa CMAX</b><div class=\"op-value\">${value}</div><div>${echoLabel(v)}</div><div class=\"op-meta\">${Number(latlng.lat).toFixed(4)}°, ${Number(latlng.lng).toFixed(4)}° · ${frame}<br>warstwa pomocnicza · POLRAD ma priorytet nad Polską</div></div>`;"
            ),
            (
              "      ? `OPERA CMAX · ${raster.pixelKm} km/piksel · ${frameUtc} · dotknij mapy, aby odczytać dBZ`\n      : `OPERA CMAX · ${raster.pixelKm} km/piksel · ${frameUtc} · dotknij mapy, aby sprawdzić punkt`;",
              "      ? `OPERA Europa CMAX · ${raster.pixelKm} km/piksel · ${frameUtc} · filtr mapy ≥${VISUAL_MIN_DBZ} dBZ · dotknij mapy, aby odczytać dBZ`\n      : `OPERA Europa CMAX · ${raster.pixelKm} km/piksel · ${frameUtc} · filtr mapy ≥${VISUAL_MIN_DBZ} dBZ · dotknij mapy, aby sprawdzić punkt`;"
            ),
            (
              "      resolutionKm:raster.pixelKm\n",
              "      resolutionKm:raster.pixelKm,\n      visualThresholdDbz:VISUAL_MIN_DBZ,\n      role:'secondary_europe_control',\n      primaryOverPoland:'POLRAD'\n"
            ),
            (
              "    boundButton = button;\n    button.setAttribute('aria-pressed',button.classList.contains('active')?'true':'false');",
              "    boundButton = button;\n    button.textContent = 'OPERA Europa CMAX';\n    button.title = 'Europejska warstwa kontrolna/backup; nad Polską priorytet ma POLRAD';\n    button.setAttribute('aria-pressed',button.classList.contains('active')?'true':'false');"
            ),
            (
              "    if (!autoEnabled && lastOpera?.latest && !lastOpera.error && button.dataset.operaUserTouched !== '1') {\n      autoEnabled = true;\n      if (!button.classList.contains('active')) button.click();\n      else renderMap(lastOpera);\n      return;\n    }\n    renderMap(lastOpera);",
              "    // Secondary layer: never auto-enable it over POLRAD. Render only when the user explicitly activates it.\n    renderMap(lastOpera);"
            ),
            (
              "      updatedAt:new Date().toISOString(), source:'OPERA CIRRUS DBZH', primaryRadar:'POLRAD', probabilitiesAdjusted:false,",
              "      updatedAt:new Date().toISOString(), source:'OPERA CIRRUS DBZH', primaryRadar:'POLRAD', operaRole:'secondary_verification_backup', probabilitiesAdjusted:false,"
            ),
            (
              "    let lead='brak sygnału do potwierdzenia';\n    if(e.polradSignal&&e.operaSignal&&e.vectorAgreement)lead='potwierdza POLRAD';\n    else if(e.polradSignal&&e.operaSignal)lead='częściowo potwierdza POLRAD';\n    else if(e.polradSignal&&!e.operaSignal)lead='nie potwierdza silnego echa POLRAD';\n    const parts=[`<b>OPERA:</b> ${lead}`];",
              "    let lead='brak sygnału do potwierdzenia';\n    if(e.polradSignal&&e.operaSignal&&e.vectorAgreement)lead='potwierdza POLRAD';\n    else if(e.polradSignal&&e.operaSignal)lead='częściowo potwierdza POLRAD';\n    else if(e.polradSignal&&!e.operaSignal)lead='nie potwierdza silnego echa POLRAD';\n    else if(!e.polradSignal&&e.operaSignal)lead='echo tylko w OPERA — informacja pomocnicza';\n    const parts=[`<b>OPERA Europa:</b> ${lead}`];"
            )
          ]

          for old,new in replacements:
            count=s.count(old)
            if count != 1:
              raise SystemExit(f'guard failed: expected exactly one occurrence, got {count}: {old[:80]!r}')
            s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

      - name: Validate JavaScript and policy
        run: |
          node --check opera-convection-bridge.js
          grep -q "OPERA Europa CMAX" opera-convection-bridge.js
          grep -q "VISUAL_MIN_DBZ = 18" opera-convection-bridge.js
          grep -q "secondary_europe_control" opera-convection-bridge.js
          grep -q "never auto-enable" opera-convection-bridge.js
          grep -q "probabilitiesAdjusted:false" opera-convection-bridge.js

      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opera-convection-bridge.js
          git diff --cached --quiet && exit 0
          git commit -m 'Make OPERA a filtered secondary Europe layer'
          git push origin HEAD:main
