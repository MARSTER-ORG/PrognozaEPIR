name: Cache bust neighbor model
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-neighbor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cache key
        run: sed -i 's/neighbor-observation-context.js?v=neighbor-obs-v1/neighbor-observation-context.js?v=neighbor-obs-v2/' index.html
      - name: Commit patch
        run: |
          git config user.name 'prognozaepir-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Bust neighbor observation model cache'
          git push
