name: One-shot EPIR FOG deploy fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fog-deploy-fix.yml'

permissions:
  contents: write

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical Pages build for EPIR FOG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wire = Path('scripts/wire_fog_mifg_utc_runtime.py')
          s = wire.read_text(encoding='utf-8')

          old = """    s = index.read_text(encoding=\"utf-8\")\n    tag = f'<script src=\"fog-summary-layout.js?v={ASSET_V}\"></script>'"""
          new = """    s = index.read_text(encoding=\"utf-8\")\n    # Force the current global navigation runtime on every Pages deployment.\n    s = re.sub(r'utc-ui-guard\\.js(?:\\?v=[^\\\"]*)?', f'utc-ui-guard.js?v={ASSET_V}', s)\n    # EPIR FOG has its own page. Keep only the graphical FG overlay on the meteogram.\n    hide = '<style id=\"epirFogStandaloneOnly\">#fogEngine,#fogEngineModeSwitch,#fogVNextDiagnostics,#fogSummaryStructured,#fogAuxStructured{display:none!important}</style>'\n    if 'id=\"epirFogStandaloneOnly\"' not in s:\n        s = s.replace('</head>', hide + '\\n</head>', 1)\n    tag = f'<script src=\"fog-summary-layout.js?v={ASSET_V}\"></script>'"""
          if old not in s:
              raise SystemExit('wire index patch marker missing')
          s = s.replace(old, new, 1)
          s = s.replace(
              '"PrognozaEPIRFogRenderSeries", "const FOG_RENDER_THRESHOLD=60",',
              '"PrognozaEPIRFogRenderSeries", "const VNEXT_THRESHOLD=60", "const LEGACY_THRESHOLD=50",',
              1,
          )
          s = s.replace(
              'for marker in ("EPIR FOG ENGINE vNext", f"fog-engine.js?v={ASSET_V}", f"fog-summary-layout.js?v={ASSET_V}"):',
              'for marker in ("EPIR FOG", f"fog-engine.js?v={ASSET_V}", f"fog-summary-layout.js?v={ASSET_V}"):',
              1,
          )
          anchor = """    if 'fog-summary-layout.js?v=' not in index:\n        raise SystemExit(\"Fog vNext production bridge is not wired into deployed index.html\")"""
          replacement = anchor + """\n    if f'utc-ui-guard.js?v={ASSET_V}' not in index:\n        raise SystemExit(\"global navigation runtime is not cache-busted\")\n    if 'id=\"epirFogStandaloneOnly\"' not in index:\n        raise SystemExit(\"Fog Engine panel is not hidden on the meteogram page\")"""
          if anchor not in s:
              raise SystemExit('wire validation marker missing')
          s = s.replace(anchor, replacement, 1)
          wire.write_text(s, encoding='utf-8')

          pages = Path('.github/workflows/pages-v2.yml')
          p = pages.read_text(encoding='utf-8')
          p = p.replace(
              "          grep -F \"const VERSION='1.0.0-production'\" _site/fog-vnext-probability-layer.js\n",
              "          grep -F \"const VNEXT_THRESHOLD=60\" _site/fog-vnext-probability-layer.js\n          grep -F \"const LEGACY_THRESHOLD=50\" _site/fog-vnext-probability-layer.js\n",
              1,
          )
          p = p.replace(
              "          test -s _site/fog-summary-layout.js\n",
              "          test -s _site/fog.html\n          test -s _site/fog-summary-layout.js\n",
              1,
          )
          p = p.replace(
              "          grep -F 'fog-summary-layout.js?v=' _site/index.html\n",
              "          grep -F 'fog-summary-layout.js?v=' _site/index.html\n          grep -F 'utc-ui-guard.js?v=' _site/index.html\n          grep -F 'id=\"epirFogStandaloneOnly\"' _site/index.html\n          grep -F 'EPIR FOG' _site/fog.html\n          grep -F 'href=\"fog.html\"' _site/utc-ui-guard.js\n",
              1,
          )
          pages.write_text(p, encoding='utf-8')
          PY
      - name: Commit deployment repair
        shell: bash
        run: |
          git config user.name 'prognozaepir-ui-patch'
          git config user.email 'ui-patch@prognozaepir.invalid'
          git add scripts/wire_fog_mifg_utc_runtime.py .github/workflows/pages-v2.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'deploy: publish EPIR FOG standalone UI correctly'
          git push
