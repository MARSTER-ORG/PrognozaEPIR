name: Test OPERA proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-opera-proxy.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public v1.1 proxy and real GeoTIFF range
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://opera-cmax-live-v2-production.up.railway.app'
          echo 'Health:'
          curl -fSs --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 90 "$BASE/health"
          echo

          # MeteoGate confirmed this OPERA COG exists. The proxy accepts recent
          # frames for 26 h, so it is deterministic for this deployment test.
          TOKEN='202609101905'
          URL="$BASE/opera/dbzh/$TOKEN.tiff"
          echo "Range test: $TOKEN UTC"
          code="$(curl -sS --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 90 \
            -D /tmp/h -H 'Range: bytes=0-16383' -o /tmp/frame.bin -w '%{http_code}' "$URL")"
          cat /tmp/h
          echo "HTTP $code"
          test "$code" = '206' -o "$code" = '200'
          TOKEN="$TOKEN" python3 - <<'PY'
          import os
          from pathlib import Path
          data=Path('/tmp/frame.bin').read_bytes()
          print('bytes=',len(data),'magic=',repr(data[:8]))
          if len(data) < 8:
              raise SystemExit('GeoTIFF response too short')
          if not (data.startswith(b'II*\x00') or data.startswith(b'MM\x00*')):
              raise SystemExit('Response is not a TIFF')
          print(f"PASS: valid OPERA GeoTIFF range for {os.environ['TOKEN']} UTC")
          PY
