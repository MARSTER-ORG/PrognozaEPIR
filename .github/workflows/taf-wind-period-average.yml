name: Patch TAF representative period wind

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taf-wind-period-average.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch representative wind averaging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('taf.html')
          s=p.read_text(encoding='utf-8')

          if 'function representativeWindPlan(a)' not in s:
              start=s.find('function trendWindPlan(a)')
              if start < 0:
                  raise SystemExit('trendWindPlan not found')
              marker='}function evis(v){'
              pos=s.find(marker,start)
              if pos < 0:
                  raise SystemExit('evis marker after trendWindPlan not found')
              helper="""}function representativeWindPlan(a){if(!Array.isArray(a)||a.length<2)return null;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(diff(a[i],a[j]).includes('wiatr'))return null;let sw=0,ss=0,sg=0,sgw=0,u=0,v=0;for(let i=0;i<a.length;i++){let z=a[i],sp=kt(z.WS);if(!fin(sp))continue;let dt=1;if(i<a.length-1&&fin(a[i+1].t)&&fin(z.t))dt=(a[i+1].t-z.t)/36e5;else if(i>0&&fin(z.t)&&fin(a[i-1].t))dt=(z.t-a[i-1].t)/36e5;if(!fin(dt)||dt<=0)dt=1;dt=Math.max(.25,Math.min(3,dt));sw+=dt;ss+=sp*dt;if(fin(z.WD)){let q=metVec(sp,z.WD);u+=q.u*dt;v+=q.v*dt}let g=kt(z.G);if(fin(g)){sg+=g*dt;sgw+=dt}}if(!sw)return null;let avg=ss/sw,speedKt=evenWindKt(avg),vw=vecWind(u/sw,v/sw),dir=fin(vw.dir)?vw.dir:meanWindDir(a),gustAvg=sgw?sg/sgw:null,gustKt=fin(gustAvg)&&gustAvg-speedKt>=10?evenWindKt(gustAvg):null;return{speedKt,dir,gustKt,avgKt:avg,minKt:Math.min(...a.map(z=>kt(z.WS)).filter(fin)),maxKt:Math.max(...a.map(z=>kt(z.WS)).filter(fin))}}function evis(v){"""
              s=s[:pos]+helper+s[pos+len(marker):]

          m=re.search(r"function build\(\)\{.*?\}function render",s)
          if not m:
              raise SystemExit('build block not found')
          old=m.group(0)
          if 'representativeWindPlan(rows)' not in old:
              new="""function build(){let c=cycles[ci],wp=trendWindPlan(rows),rw=wp?null:representativeWindPlan(rows),ch=changes(wp),baseRow=wp?cloneWind(rows[0],wp.baseKt,rows[0].WD,wp.baseGustKt):rw?cloneWind(rows[0],rw.speedKt,rw.dir,rw.gustKt):rows[0],o=`TAF EPIR ${ddhhmm(c.issue)}Z ${ddhh(c.start)}/${ddhhEnd(c.end)} ${state(baseRow)}`;for(let g of ch.out)o+=`\n${g.k} ${ddhh(g.s)}/${ddhhEnd(g.e)} ${g.p}`;o+='=';let ck=[['PROB40',!o.includes('PROB40')],['VV',!o.includes(' VV')],['≤ 5 grup zmian',ch.out.length<=5],['Okres ważności 12 h',(c.end-c.start)===12*36e5]];return{o,ch,ck,wp,rw}}function render"""
              s=s[:m.start()]+new+s[m.end():]

          m=re.search(r"function render\(\)\{.*?\}async function gen",s)
          if not m:
              raise SystemExit('render block not found')
          block=m.group(0)
          if 'Średnia ważona czasu' not in block:
              old_tn="let tn=r.wp?` Reguła trendu: baza ${evenWindKt(r.wp.earlyKt)}→${r.wp.baseKt} kt, końcowy reżim ${r.wp.targetKt} kt, BECMG ${ddhh(r.wp.s)}/${ddhhEnd(r.wp.e)}.`:'';$('conf').textContent=`Wiatr: ${w0?.windModels||'—'} modeli, rozrzut kierunku ~${Math.round(w0?.dirSpread||0)}°, rozrzut prędkości ~${(w0?.speedSpreadKt||0).toFixed(1)} kt, korekta do aktualnego METAR ${w0?.windAnchorPct||0}%. Korekta zanika z horyzontem, więc dalszy przebieg pozostaje modelowy.${tn}`;"
              new_tn="let tn=r.wp?` Reguła trendu: baza ${evenWindKt(r.wp.earlyKt)}→${r.wp.baseKt} kt, końcowy reżim ${r.wp.targetKt} kt, BECMG ${ddhh(r.wp.s)}/${ddhhEnd(r.wp.e)}.`:'',rn=r.rw?` Brak istotnej zmiany wiatru: średnia ważona czasu ${r.rw.avgKt.toFixed(1)} kt (zakres ${r.rw.minKt.toFixed(0)}–${r.rw.maxKt.toFixed(0)} kt) → kod bazowy ${r.rw.speedKt} kt.`:'';$('conf').textContent=`Wiatr: ${w0?.windModels||'—'} modeli, rozrzut kierunku ~${Math.round(w0?.dirSpread||0)}°, rozrzut prędkości ~${(w0?.speedSpreadKt||0).toFixed(1)} kt, korekta do aktualnego METAR ${w0?.windAnchorPct||0}%. Korekta zanika z horyzontem, więc dalszy przebieg pozostaje modelowy.${tn}${rn}`;"
              if old_tn not in block:
                  raise SystemExit('render wind explanation marker not found')
              block=block.replace(old_tn,new_tn,1)
              s=s[:m.start()]+block+s[m.end():]

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript and representative rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('taf.html').read_text(encoding='utf-8')
          for x in ['function representativeWindPlan(a)','representativeWindPlan(rows)','średnia ważona czasu','rw.speedKt','return{o,ch,ck,wp,rw}']:
              assert x in s, x
          # Fixture from 10.09: 6,6,6,4,4,4,4,4,4,2,2,2 kt => 4.0 kt.
          vals=[6,6,6,4,4,4,4,4,4,2,2,2]
          assert abs(sum(vals)/len(vals)-4.0) < 1e-9
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/taf-inline.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/taf-inline.js

      - name: Commit generator change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taf.html
          git diff --cached --quiet && exit 0
          git commit -m 'TAF: use time-weighted representative wind when changes are insignificant'
          git push origin HEAD:main
