name: One-shot low fog risk green

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Change low risk color to green
        shell: python
        run: |
          from pathlib import Path
          p = Path('fog-engine.js')
          s = p.read_text(encoding='utf-8')
          old = '.fog-risk-low{border-left-color:#6f8b95}'
          new = '.fog-risk-low{border-left-color:#2ea44f}'
          if old not in s:
              raise SystemExit('Expected low-risk color marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Validate JavaScript
        run: node --check fog-engine.js
      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-fog-low-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fog-engine.js .github/workflows/one-shot-fog-low-green.yml
          git commit -m "Use green for fog risk 0-39"
          git push
