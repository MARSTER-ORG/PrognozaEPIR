name: Cloud Learning v1

on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cloud_learning.py'
      - 'scripts/cloud_learning_smoke_test.py'
      - 'scripts/model_verification.py'
      - 'scripts/model_verification_realtime.py'
      - 'scripts/embed_model_verification.py'
      - '.github/workflows/cloud-learning.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-learning-main
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Smoke test Cloud Learning
        run: python3 scripts/cloud_learning_smoke_test.py

      - name: Run Cloud Learning
        run: python3 scripts/cloud_learning.py

      - name: Run model verification
        run: |
          # Keep the established long-lead samples.
          python3 scripts/model_verification.py
          # Additionally archive every model hour for the next six hours. This
          # makes METAR/SPECI visibility verification available as soon as that
          # observation hour has passed instead of waiting for a sparse bucket.
          python3 scripts/model_verification_realtime.py

      - name: Embed model verification
        run: python3 scripts/embed_model_verification.py

      - name: Validate generated JSON
        run: |
          python3 -m json.tool data/learning/cloud-skill.json >/dev/null
          python3 -m json.tool data/learning/model-verification.json >/dev/null

      - name: Commit learning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/learning
          if git diff --cached --quiet; then
            echo "No learning changes"
          else
            git commit -m "weather: update learning and model verification data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Redeploy updated learning data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
