name: Cloud Learning v1
# Manual learning refresh trigger after 634-SYNOP backfill: 2026-10-07

on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cloud_learning.py'
      - 'scripts/cloud_learning_backfill.py'
      - 'scripts/build_adaptive_weights.py'
      - 'scripts/cloud_learning_smoke_test.py'
      - 'scripts/model_verification.py'
      - 'scripts/model_verification_realtime.py'
      - 'scripts/embed_model_verification.py'
      - '.github/workflows/cloud-learning.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: cloud-learning-main
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Smoke test Cloud Learning
        run: python3 scripts/cloud_learning_smoke_test.py

      - name: Archive current cloud forecasts
        run: python3 scripts/cloud_learning.py

      - name: Run model verification
        run: |
          # Keep established long-lead samples and archive current forecasts.
          python3 scripts/model_verification.py
          # Archive every model hour for the next six hours and refresh scores.
          python3 scripts/model_verification_realtime.py

      - name: Rebuild cloud skill from full archived model history
        run: python3 scripts/cloud_learning_backfill.py

      - name: Build adaptive model weights from METAR and SYNOP verification
        run: python3 scripts/build_adaptive_weights.py

      - name: Embed model verification
        run: python3 scripts/embed_model_verification.py

      - name: Validate generated JSON
        run: |
          python3 -m json.tool data/learning/cloud-skill.json >/dev/null
          python3 -m json.tool data/learning/model-verification.json >/dev/null
          python3 -m json.tool data/learning/adaptive-weights.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path('data/learning/adaptive-weights.json').read_text(encoding='utf-8'))
          assert w.get('schema') == 'prognozaepir-adaptive-weights-v1'
          assert len(w.get('models') or {}) >= 8
          c=json.loads(Path('data/learning/cloud-skill.json').read_text(encoding='utf-8'))
          assert c.get('schema') == 'prognozaepir-cloud-learning-v1'
          print('adaptive weights and cloud skill validated')
          PY

      - name: Commit learning data
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/learning
          if git diff --cached --quiet; then
            echo "No learning changes"
          else
            git commit -m "weather: update historical learning and adaptive model weights"
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Learning artifacts published successfully"
                echo "published=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              # Parallel archive/verification jobs may update the same derived
              # JSON. A conflicted rebase cannot be retried in-place. Rebuild
              # against the newest canonical history instead of choosing stale
              # conflict sides or silently returning success after failed push.
              git rebase --abort || true
              git fetch origin main
              git reset --hard origin/main
              echo "Concurrent learning writer; recomputing on latest main (retry $attempt)"
              python3 scripts/cloud_learning.py
              python3 scripts/model_verification.py
              python3 scripts/model_verification_realtime.py
              python3 scripts/cloud_learning_backfill.py
              python3 scripts/build_adaptive_weights.py
              python3 scripts/embed_model_verification.py
              python3 -m json.tool data/learning/cloud-skill.json >/dev/null
              python3 -m json.tool data/learning/model-verification.json >/dev/null
              python3 -m json.tool data/learning/adaptive-weights.json >/dev/null
              git add data/learning
              if git diff --cached --quiet; then
                echo "Latest main already contains equivalent learning artifacts"
                exit 0
              fi
              git commit -m "weather: update historical learning and adaptive model weights"
              sleep $((attempt*3))
            done
            echo "Cloud learning publication failed after 4 recomputed attempts" >&2
            exit 1
          fi

      - name: Refresh Pages after published learning data
        if: github.ref_name == 'main' && steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-v2.yml --ref main
