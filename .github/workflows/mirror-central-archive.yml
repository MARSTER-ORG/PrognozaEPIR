# Railway is the sole bulletin acquisition source. This workflow only mirrors
# a validated completed snapshot into the GitHub archive.
#
# Normal path: Railway emits repository_dispatch only after the archive changes.
# Safety path: one lightweight reconciliation every 6 hours catches missed events.
# Core EPIR/SYNOP JSONL files remain append-only. Neighbor-airport history may
# use a rolling Git window once the repository storage guard is activated; the
# durable copy is then Supabase.
name: Mirror central archive from Railway

on:
  repository_dispatch:
    types: [archive-updated]
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-central-archive.yml'
      - 'scripts/repository_storage_guard.py'
      - 'tests/test_repository_storage_guard.py'

permissions:
  contents: write

concurrency:
  group: mirror-central-archive
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine repository storage mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/repository_storage_guard.py
          python3 tests/test_repository_storage_guard.py
          SIZE_KB="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.size')"
          MODE="$(python3 scripts/repository_storage_guard.py --repo-size-kb "$SIZE_KB" --limit-mb 500 --mode-only)"
          case "$MODE" in
            normal) KEEP_DAYS=0 ;;
            rolling) KEEP_DAYS=30 ;;
            external) KEEP_DAYS=7 ;;
            *) echo "Unknown storage mode: $MODE" >&2; exit 1 ;;
          esac
          echo "NEIGHBOR_ARCHIVE_MODE=$MODE" >> "$GITHUB_ENV"
          echo "NEIGHBOR_RETENTION_DAYS=$KEEP_DAYS" >> "$GITHUB_ENV"
          echo "Repository ${SIZE_KB} KB; neighbor archive mode=${MODE}; keep_days=${KEEP_DAYS}"

      - name: Copy completed Railway archive snapshot
        env:
          ARCHIVE_BASE: https://central-ingestor-production.up.railway.app
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          base=os.environ['ARCHIVE_BASE'].rstrip('/')
          root=Path('data/messages')
          root.mkdir(parents=True,exist_ok=True)
          neighbor_mode=os.environ.get('NEIGHBOR_ARCHIVE_MODE','normal').strip().lower()
          neighbor_keep_days=int(os.environ.get('NEIGHBOR_RETENTION_DAYS','0') or 0)

          def get(url, attempts=3):
              last=None
              for i in range(attempts):
                  try:
                      req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'PrognozaEPIR-GitHub-Mirror/3'})
                      with urllib.request.urlopen(req,timeout=20) as r:
                          return r.read()
                  except Exception as exc:
                      last=exc
                      if i+1<attempts:
                          time.sleep(2+i*2)
              raise RuntimeError(f'GET failed: {url}: {last}')

          def jsonl_ids(data):
              ids=set()
              for raw in data.decode('utf-8').splitlines():
                  if not raw.strip():
                      continue
                  row=json.loads(raw)
                  ident=str(row.get('message_id') or '').strip()
                  if not ident:
                      ident=hashlib.sha256(
                          (str(row.get('type') or '')+'|'+str(row.get('station') or '')+'|'+str(row.get('canonical_raw') or row.get('raw') or '')).encode('utf-8')
                      ).hexdigest()
                  ids.add(ident)
              return ids

          manifest=json.loads(get(base+'/archive-manifest').decode('utf-8'))
          if manifest.get('schema')!='prognozaepir-message-archive-manifest-v1':
              raise SystemExit('unexpected archive manifest schema')

          def neighbor_file_day(rel):
              parts=rel.split('/')
              if len(parts)!=5 or parts[0]!='neighbors' or not parts[4].endswith('.jsonl'):
                  return None
              try:
                  return date(int(parts[2]),int(parts[3]),int(parts[4][:-6]))
              except (TypeError,ValueError):
                  return None

          def wanted(rel):
              if rel in {'latest.json','recent.json','taf-neighbors.json','neighbors/latest.json'}:
                  return True
              if rel.startswith(('metar/','speci/','synop/','taf/')):
                  return rel.endswith(('.json','.jsonl'))
              if not rel.startswith('neighbors/'):
                  return False
              if rel.endswith('.json'):
                  return True
              if not rel.endswith('.jsonl'):
                  return False
              if neighbor_mode=='normal':
                  return True
              day=neighbor_file_day(rel)
              if day is None:
                  return False
              cutoff=datetime.now(timezone.utc).date()-timedelta(days=max(0,neighbor_keep_days))
              return day>=cutoff

          changed=0
          checked=0
          for item in manifest.get('files') or []:
              rel=str(item.get('path') or '')
              expected=str(item.get('sha256') or '')
              if not wanted(rel) or len(expected)!=64:
                  continue
              checked+=1
              dest=root/rel
              if dest.is_file() and hashlib.sha256(dest.read_bytes()).hexdigest()==expected:
                  continue

              quoted='/'.join(urllib.parse.quote(part,safe='') for part in rel.split('/'))
              data=get(base+'/data/messages/'+quoted)
              actual=hashlib.sha256(data).hexdigest()
              if actual!=expected:
                  raise SystemExit(f'snapshot changed during mirror: {rel}; expected {expected}, got {actual}; refusing partial commit')

              if rel.endswith('.jsonl') and dest.is_file():
                  durable=jsonl_ids(dest.read_bytes())
                  incoming=jsonl_ids(data)
                  missing=durable-incoming
                  if missing:
                      raise SystemExit(
                          f'archive regression refused for {rel}: Railway snapshot is missing {len(missing)} records already durable in GitHub'
                      )

              dest.parent.mkdir(parents=True,exist_ok=True)
              tmp=dest.with_name('.'+dest.name+'.mirror.tmp')
              tmp.write_bytes(data)
              os.replace(tmp,dest)
              changed+=1

          print(f'validated manifest {manifest.get("generated_at")}: checked={checked}, changed={changed}, neighbor_mode={neighbor_mode}')
          PY

      - name: Validate central archive before commit
        run: python3 scripts/message_archive.py --validate-only

      - name: Rebuild authoritative archive status
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root=Path('data/messages')
          folders={
              'metar':'METAR',
              'speci':'SPECI',
              'synop':'SYNOP',
              'taf':'TAF',
          }
          counts={}
          latest={}

          for folder,kind in folders.items():
              count=0
              newest=None
              base=root/folder
              if base.exists():
                  for path in sorted(base.rglob('*.jsonl')):
                      for raw_line in path.read_text(encoding='utf-8').splitlines():
                          if not raw_line.strip():
                              continue
                          row=json.loads(raw_line)
                          if row.get('type')!=kind:
                              raise SystemExit(f'unexpected type in {path}: {row.get("type")} != {kind}')
                          if kind=='TAF' and str(row.get('station') or '').upper()!='EPIR':
                              raise SystemExit(f'neighbor TAF leaked into history: {path}')
                          count+=1
                          message_time=str(row.get('message_time') or '')
                          if message_time and (newest is None or message_time>newest):
                              newest=message_time
              counts[folder]=count
              latest[folder]=newest

          latest_view={}
          latest_path=root/'latest.json'
          if latest_path.exists():
              latest_view=json.loads(latest_path.read_text(encoding='utf-8'))
          archive_updated_at=latest_view.get('updated_at') or max((x for x in latest.values() if x),default=None)
          neighbor_mode=os.environ.get('NEIGHBOR_ARCHIVE_MODE','normal').strip().lower()
          neighbor_keep_days=int(os.environ.get('NEIGHBOR_RETENTION_DAYS','0') or 0)
          if neighbor_mode=='normal':
              neighbor_policy='full Git history; durable Supabase copy'
          else:
              neighbor_policy=f'{neighbor_keep_days}-day Git hot window; durable Supabase copy; mode={neighbor_mode}'

          payload={
              'schema':'prognozaepir-message-archive-status-v1',
              'archive':'data/messages',
              'types':['METAR','SPECI','TAF','SYNOP'],
              'counts':counts,
              'latest':latest,
              'archive_updated_at':archive_updated_at,
              'deduplication':'sha256(type + station + canonical_raw)',
              'legacy_archives_authoritative':False,
              'taf_history_scope':'EPIR only',
              'taf_neighbors':'current snapshot only; not archived; not learning data',
              'neighbor_observations':f'EPBY/EPPW/EPKS METAR/SPECI context; {neighbor_policy}; excluded from EPIR counts',
          }
          dest=root/'status.json'
          text=json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True)+'\n'
          if not dest.exists() or dest.read_text(encoding='utf-8')!=text:
              tmp=dest.with_name('.status.json.rebuild.tmp')
              tmp.write_text(text,encoding='utf-8')
              os.replace(tmp,dest)
              print('status.json rebuilt from physical JSONL records:',counts)
          else:
              print('status.json already correct:',counts)
          PY

      - name: Commit only complete message changes
        run: |
          if git diff --quiet -- data/messages; then
            echo 'Archive unchanged.'
            exit 0
          fi
          git config user.name 'prognozaepir-archive-mirror'
          git config user.email 'archive-mirror@prognozaepir.invalid'
          git add data/messages
          git commit -m 'weather: mirror validated central archive'
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((n*2))
          done
          echo 'Unable to publish archive after retries.' >&2
          exit 1
