# Supabase is the authoritative current bulletin archive. Railway is the
# acquisition engine, but its standalone gateway serves an old deployment
# snapshot and MUST NOT be used as the freshness source for GitHub.
# Existing GitHub JSONL history remains append-only.
name: Mirror current archive from Supabase

on:
  repository_dispatch:
    types: [archive-updated]
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-central-archive.yml'
      - 'scripts/archive_jsonl_merge.py'
      - 'scripts/mirror_central_archive.py'
      - 'scripts/rebuild_message_archive_status.py'
      - 'scripts/repository_storage_guard.py'
      - 'tests/test_archive_jsonl_merge.py'
      - 'tests/test_repository_storage_guard.py'

permissions:
  contents: write

concurrency:
  group: prognozaepir-message-archive-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate mirror code
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/archive_jsonl_merge.py \
            scripts/mirror_central_archive.py \
            scripts/sync_supabase_messages_to_git.py \
            scripts/rebuild_message_archive_status.py \
            scripts/repository_storage_guard.py \
            tests/test_archive_jsonl_merge.py \
            tests/test_repository_storage_guard.py
          python3 tests/test_archive_jsonl_merge.py
          python3 tests/test_repository_storage_guard.py

      - name: Determine repository storage mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIZE_KB="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.size')"
          MODE="$(python3 scripts/repository_storage_guard.py --repo-size-kb "$SIZE_KB" --limit-mb 500 --mode-only)"
          case "$MODE" in
            normal) KEEP_DAYS=0 ;;
            rolling) KEEP_DAYS=30 ;;
            external) KEEP_DAYS=7 ;;
            *) echo "Unknown storage mode: $MODE" >&2; exit 1 ;;
          esac
          echo "NEIGHBOR_ARCHIVE_MODE=$MODE" >> "$GITHUB_ENV"
          echo "NEIGHBOR_RETENTION_DAYS=$KEEP_DAYS" >> "$GITHUB_ENV"
          echo "Repository ${SIZE_KB} KB; neighbor archive mode=${MODE}; keep_days=${KEEP_DAYS}"

      - name: Merge current authoritative messages from Supabase Edge archive
        env:
          SUPABASE_PROJECT_REF: qozgntzeormujmqzkkmd
        run: |
          set -euo pipefail
          python3 scripts/sync_supabase_messages_to_git.py --days 4
          # The primary database may contain more recent reports than a stale
          # Railway gateway image; do not replace them with old gateway files.

      - name: Validate central archive before commit
        run: python3 scripts/message_archive.py --validate-only

      - name: Rebuild authoritative archive status
        run: python3 scripts/rebuild_message_archive_status.py

      - name: Commit only complete message changes
        run: |
          if git diff --quiet -- data/messages; then
            echo 'Archive unchanged.'
            exit 0
          fi
          git config user.name 'prognozaepir-archive-mirror'
          git config user.email 'archive-mirror@prognozaepir.invalid'
          git add data/messages
          git commit -m 'weather: mirror validated central archive'
          for n in 1 2 3 4 5; do
            if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((n*2))
          done
          echo 'Unable to publish archive after retries.' >&2
          exit 1
