name: Fix BR meteogram overlay once

on:
  push:
    paths:
      - 'scripts/patch_br_overlay_once.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch BR overlay
        run: python3 scripts/patch_br_overlay_once.py
      - name: Validate overlay
        run: node --check fog-meteogram-overlay.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fog-meteogram-overlay.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: draw BR directly from authoritative score on meteogram'
          git push origin HEAD:main
