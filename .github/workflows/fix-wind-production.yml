name: Fix wind correction in production views
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wind-production.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch production consensus and TAF synchronization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep the EPIR sector correction visible in the main meteogram.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start='function modelSeries(id){'
          i=s.find(start)
          if i<0: raise SystemExit('modelSeries not found')
          j=s.find('\nfunction dataVisible()',i)
          if j<0: raise SystemExit('modelSeries end not found')
          block=s[i:j]
          if 'return correctEpirWindDirection({' not in block:
              marker=';return{t:x,T:r.temperature_2m'
              if marker not in block: raise SystemExit('modelSeries return marker not found')
              block=block.replace(marker,';return correctEpirWindDirection({t:x,T:r.temperature_2m',1)
              tail='stormCount:finite(r.weather_code)?1:0}}).filter(Boolean)}'
              if tail not in block: raise SystemExit('modelSeries tail marker not found')
              block=block.replace(tail,'stormCount:finite(r.weather_code)?1:0})}).filter(Boolean)}',1)
              s=s[:i]+block+s[j:]
          old="infoValue('Kierunek',f(z.WD,0)+'° '+compass(z.WD))"
          new="infoValue('Kierunek',f(z.WD,0)+'° '+compass(z.WD)+(finite(z.windDirSectorCorrectionDeg)?' · surowy '+f(z.windDirRawDeg,0)+'° · korekta '+f(z.windDirSectorCorrectionDeg,0)+'°':''))"
          if old in s: s=s.replace(old,new,1)
          old="infoValue('Kierunek',f(z.WD,0)+'°'),infoValue('Róża wiatrów',compass(z.WD))"
          new="infoValue('Kierunek',f(z.WD,0)+'°'+(finite(z.windDirSectorCorrectionDeg)?' · surowy '+f(z.windDirRawDeg,0)+'° · korekta '+f(z.windDirSectorCorrectionDeg,0)+'°':'')),infoValue('Róża wiatrów',compass(z.WD))"
          if old in s: s=s.replace(old,new,1)
          s=s.replace('v0.9.14','v0.9.15')
          p.write_text(s,encoding='utf-8')

          # Hybrid policy: one authoritative corrected guidance state drives both TAF and table.
          p=Path('taf-generator-policy.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION='3.1.1';","const VERSION='3.2.0';",1)
          if 'function applyShortHorizonToHourly(' not in s:
              needle="""  function reconcileBase(result,plan,cfg,msaFt){
    const original=result.hourly?.[0]||result.base?.state;if(!original)return null;const base={...original,clouds:hourClouds(original).map(c=>({...c}))};
    const hs=(result.hourly||[]).slice(0,(cfg.shortHorizon||DEFAULTS.shortHorizon).hours),windStable=hs.length>1&&!hs.slice(1).some(h=>windNeedsGroup(hs[0],h));
    if(windStable&&(cfg.shortHorizon||DEFAULTS.shortHorizon).blendWind){const w=blendedShortWind(hs);if(w){base.windKt=w.windKt;if(finite(w.windDir))base.windDir=w.windDir;if(finite(w.gustKt))base.gustKt=w.gustKt;}}
    if(plan?.active){const lim=cloudThresholds(msaFt).cavok,minFt=(cfg.shortHorizon||DEFAULTS.shortHorizon).weakCloudMinFt;base.clouds=base.clouds.filter(c=>c.type||c.ft>=lim||c.ft<minFt||(c.okta||amountMin(c.cover))>=5);base.__tafCloudsAuthoritative=true;}
    return base;
  }
"""
              add=needle+"""
  function applyShortHorizonToHourly(result,plan,cfg,msaFt){
    if(!plan?.active||!Array.isArray(result?.hourly))return 0;
    const sh=cfg.shortHorizon||DEFAULTS.shortHorizon,lim=cloudThresholds(msaFt).cavok;let changed=0;
    for(let i=0;i<Math.min(sh.hours,result.hourly.length);i++){
      const h=result.hourly[i];if(!weakClearCompatibleHour(h,msaFt,cfg))continue;
      const raw=hourClouds(h).map(c=>({...c})),filtered=raw.filter(c=>c.type||c.ft>=lim||c.ft<sh.weakCloudMinFt||(c.okta||amountMin(c.cover))>=5);
      if(filtered.length!==raw.length){h.__tafRawClouds=raw;h.clouds=filtered;h.__tafCloudsAuthoritative=true;h.__tafShortHorizonCorrected=true;changed++;}
    }
    return changed;
  }
  function displayForHour(h,msaFt){
    const cavok=strictCavokEligible(h,msaFt),wx=encodedWxForHour(h);
    return{cavok,wind:windFromHour(h),visibility:encodedVis(h?.visM),weather:wx,clouds:cavok?'CAVOK':(strictNscEligible(h,msaFt)?'NSC':encodeCloudsStrict(h,msaFt)),corrected:!!h?.__tafShortHorizonCorrected};
  }
  function attachHourlyDisplay(result,msaFt){
    for(const h of result.hourly||[])h.tafDisplay=displayForHour(h,msaFt);
    if(result.base?.state)result.base.display=displayForHour(result.base.state,msaFt);
  }
"""
              if needle not in s: raise SystemExit('policy reconcileBase block not found')
              s=s.replace(needle,add,1)
          old="""    const advisoryPlan=dominantClearPlan(rows,result.start,cfg),shortPlan=shortHorizonBasePlan(result,ctx,cfg,msaFt),suppressed=[],base=reconcileBase(result,shortPlan,cfg,msaFt);if(base){result.base=result.base||{};result.base.state=base;result.base.text=encodeStateStrict(base,msaFt);}
    let groups=persistentGroups(result,cfg,msaFt,suppressed);groups.push(...visibilityThresholdGroups(result,cfg,msaFt,groups,suppressed));groups.push(...temporaryGroups(result,cfg,msaFt,groups,suppressed));groups.push(...probabilisticGroups(result,cfg,msaFt,groups,suppressed));
"""
          if old in s:
              new="""    const advisoryPlan=dominantClearPlan(rows,result.start,cfg),shortPlan=shortHorizonBasePlan(result,ctx,cfg,msaFt),suppressed=[],correctedHours=applyShortHorizonToHourly(result,shortPlan,cfg,msaFt),base=reconcileBase(result,shortPlan,cfg,msaFt);if(base){result.base=result.base||{};result.base.state=base;result.base.text=encodeStateStrict(base,msaFt);}
    let groups=persistentGroups(result,cfg,msaFt,suppressed);groups.push(...visibilityThresholdGroups(result,cfg,msaFt,groups,suppressed));groups.push(...temporaryGroups(result,cfg,msaFt,groups,suppressed));groups.push(...probabilisticGroups(result,cfg,msaFt,groups,suppressed));
"""
              s=s.replace(old,new,1)
          elif 'correctedHours=applyShortHorizonToHourly' not in s:
              raise SystemExit('policy postprocess prelude not found')
          marker='result.groups=groups;result.taf=rebuildTaf(result);'
          if marker in s:s=s.replace(marker,'result.groups=groups;attachHourlyDisplay(result,msaFt);result.taf=rebuildTaf(result);',1)
          elif 'attachHourlyDisplay(result,msaFt);result.taf=' not in s:raise SystemExit('policy result rendering marker not found')
          s=s.replace('result.diagnostics.shortHorizonBase=shortPlan;','result.diagnostics.shortHorizonBase=shortPlan?{...shortPlan,correctedHours}:shortPlan;',1)
          s=s.replace('shortHorizonBase:shortPlan,dominantClearAdvisory','shortHorizonBase:shortPlan?{...shortPlan,correctedHours}:shortPlan,dominantClearAdvisory',1)
          s=s.replace('shortHorizonBasePlan,reconcileBase,postprocessResult','shortHorizonBasePlan,reconcileBase,applyShortHorizonToHourly,displayForHour,postprocessResult',1)
          s=s.replace('20260913-short-horizon-v6','20260913-hourly-sync-v7')
          p.write_text(s,encoding='utf-8')

          # Adapter: carry the already-corrected consensus fields from the meteogram.
          # If the hidden iframe is stale, defensively apply the same EPIR correction once.
          p=Path('taf-hybrid-adapter.js')
          s=p.read_text(encoding='utf-8')
          if 'const EPIR_WIND_DIR_CORR=' not in s:
              anchor="""  const NSTA = {
    EPBY:{name:'Bydgoszcz',lat:53.0968,lon:17.9777},
    EPPW:{name:'Powidz',lat:52.3792,lon:17.8539},
    EPKS:{name:'Krzesiny',lat:52.3317,lon:16.9664}
  };
"""
              add=anchor+"""  const EPIR_WIND_DIR_CORR={from:190,to:235,offset:-25,minSpeedMs:1.5};
"""
              if anchor not in s: raise SystemExit('adapter NSTA anchor not found')
              s=s.replace(anchor,add,1)
          helper="""  function ensureEpirWindCorrection(z){
    if(!z||!finite(+z.WS)||!finite(+z.WD))return z;
    if(finite(+z.windDirSectorCorrectionDeg))return z;
    const raw=((+z.WD%360)+360)%360;
    if(+z.WS<EPIR_WIND_DIR_CORR.minSpeedMs||raw<EPIR_WIND_DIR_CORR.from||raw>EPIR_WIND_DIR_CORR.to)return {...z,WD:raw};
    return {...z,WD:(raw+EPIR_WIND_DIR_CORR.offset+360)%360,windDirRawDeg:raw,windDirSectorCorrectionDeg:EPIR_WIND_DIR_CORR.offset,windDirSectorCorrectionRule:`${EPIR_WIND_DIR_CORR.from}-${EPIR_WIND_DIR_CORR.to}:${EPIR_WIND_DIR_CORR.offset}`};
  }
"""
          if 'function ensureEpirWindCorrection(' not in s:
              anchor='  function fu(t){'
              if anchor not in s: raise SystemExit('adapter helper anchor not found')
              s=s.replace(anchor,helper+'\n'+anchor,1)
          s=s.replace('WS:z.WS,WD:z.WD,G:z.G,ceiling:z.ceiling','WS:z.WS,WD:z.WD,windDirRawDeg:z.windDirRawDeg,windDirSectorCorrectionDeg:z.windDirSectorCorrectionDeg,windDirSectorCorrectionRule:z.windDirSectorCorrectionRule,G:z.G,ceiling:z.ceiling',1)
          tail="""      return {...z,fogRisk:Math.max(0,q?.risk||q?.probability||0),mifgRisk:finite(m?.score)?m.score:null};
    });
  }
"""
          if tail in s:s=s.replace(tail,"""      return {...z,fogRisk:Math.max(0,q?.risk||q?.probability||0),mifgRisk:finite(m?.score)?m.score:null};
    }).map(ensureEpirWindCorrection);
  }
""",1)
          elif '.map(ensureEpirWindCorrection);' not in s:raise SystemExit('adapter meteogramRows tail not found')
          old="""    if($('hours'))$('hours').innerHTML=result.hourly.map(h=>`<tr><td>${pad(new Date(h.t).getUTCHours())}:00 UTC</td><td>${windText(h,!!result.diagnostics?.vrb02)}</td><td>${visText(h.visM)}</td><td>${wxText(h)||'—'}</td><td>${cloudText(h)}</td><td>${finite(h.ceilingFt)?Math.round(h.ceilingFt)+' ft':'—'}</td><td>${Math.round((h.prob?.precip||0)*100)}% / TS ${Math.round((h.prob?.ts||0)*100)}%</td><td>FG ${Math.round((h.prob?.fog||0)*100)}% · LOW VIS ${Math.round((h.prob?.lowVis||0)*100)}%</td><td>${upstreamText(h)}</td></tr>`).join('');
"""
          if old in s:
              new="""    if($('hours'))$('hours').innerHTML=result.hourly.map((h,i)=>{const d=i===0&&result.base?.display?result.base.display:(h.tafDisplay||{}),wind=d.wind||windText(h,!!result.diagnostics?.vrb02),vis=d.visibility||visText(h.visM),wx=d.weather??wxText(h),clouds=d.clouds||cloudText(h),mark=d.corrected?' <span title=\"korekta silnika hybrydowego\">✓</span>':'';return `<tr><td>${pad(new Date(h.t).getUTCHours())}:00 UTC</td><td>${wind}</td><td>${vis}</td><td>${wx||'—'}</td><td>${clouds}${mark}</td><td>${finite(h.ceilingFt)?Math.round(h.ceilingFt)+' ft':'—'}</td><td>${Math.round((h.prob?.precip||0)*100)}% / TS ${Math.round((h.prob?.ts||0)*100)}%</td><td>FG ${Math.round((h.prob?.fog||0)*100)}% · LOW VIS ${Math.round((h.prob?.lowVis||0)*100)}%</td><td>${upstreamText(h)}</td></tr>`;}).join('');
"""
              s=s.replace(old,new,1)
          elif 'result.base?.display' not in s:raise SystemExit('adapter hourly renderer not found')
          p.write_text(s,encoding='utf-8')

          # Force the hidden meteogram engine to load the same current code as the visible meteogram.
          p=Path('taf.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<iframe id="engine" src="index.html"','<iframe id="engine" src="index.html?v=20260913-taf-consensus-v2"',1)
          p.write_text(s,encoding='utf-8')

          # Regression tests: table guidance must match accepted short-horizon base correction.
          p=Path('tests/taf-hybrid-engine.test.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("assert.equal(P.VERSION,'3.1.1');","assert.equal(P.VERSION,'3.2.0');",1)
          anchor="""assert.equal(r.diagnostics.shortHorizonBase.active,true);
assert.match(r.base.text,/\\bCAVOK\\b/);
assert.ok(r.base.state.windKt>5&&r.base.state.windKt<7,'base wind is blended over short horizon, not copied from one hour');
"""
          if anchor in s and 'hourly table guidance follows accepted short-horizon correction' not in s:
              s=s.replace(anchor,anchor+"""assert.equal(r.hourly[0].tafDisplay.cavok,true,'hourly table guidance follows accepted short-horizon correction');
assert.equal(r.hourly[0].tafDisplay.clouds,'CAVOK');
assert.ok(r.hourly[0].__tafShortHorizonCorrected,'corrected hour is explicitly marked');
assert.ok(Array.isArray(r.hourly[0].__tafRawClouds)&&r.hourly[0].__tafRawClouds.length>0,'raw clouds are retained for diagnostics');
""",1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check taf-generator-policy.js
          node --check taf-hybrid-adapter.js
          node tests/taf-hybrid-engine.test.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=s.split("<script>\n'use strict';",1)[1].split('</script>',1)[0]
          Path('/tmp/index-inline.js').write_text("'use strict';\n"+js,encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'prognozaepir-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html taf.html taf-generator-policy.js taf-hybrid-adapter.js tests/taf-hybrid-engine.test.js
          git diff --cached --quiet && exit 0
          git commit -m 'Synchronize TAF table with corrected hybrid consensus'
          git pull --rebase origin main
          git push
