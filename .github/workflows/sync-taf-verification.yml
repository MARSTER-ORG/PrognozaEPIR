name: Sync TAF verification inline

on:
  push:
    branches: [main]
    paths:
      - taf-verification.js
      - scripts/embed_taf_verification.py
      - .github/workflows/sync-taf-verification.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-taf-verification
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source JavaScript
        run: node --check taf-verification.js

      - name: Embed verifier in TAF page
        run: python3 scripts/embed_taf_verification.py

      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('taf.html').read_text(encoding='utf-8')
          marker='/* TAF Verification v2.0 inline — generated from taf-verification.js */'
          pos=s.rfind(marker)
          if pos < 0:
              raise SystemExit('embedded verifier marker missing')
          a=s.rfind('<script>',0,pos)+len('<script>')
          b=s.find('</script>',pos)
          Path('/tmp/taf-verification-inline.js').write_text(s[a:b],encoding='utf-8')
          if 'prognozaepir-taf-skill-v1' not in s[a:b]:
              raise SystemExit('verification-only guard missing')
          if 'Sprawdzalność TAF — raport dobowy' not in s[a:b]:
              raise SystemExit('daily TAF report UI missing')
          PY
          node --check /tmp/taf-verification-inline.js

      - name: Commit synchronized page
        run: |
          if git diff --quiet -- taf.html; then
            echo 'taf.html already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taf.html
          git commit -m 'taf: sync daily verification view'
          git push
