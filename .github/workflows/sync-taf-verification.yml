name: Sync TAF verification inline
on:
  push:
    branches: [main]
    paths:
      - taf-verification.js
      - scripts/embed_taf_verification.py
      - scripts/apply_central_archive_cutover.py
      - scripts/finalize_central_message_architecture.py
      - scripts/ensure_taf_native_archive.py
      - .github/workflows/sync-taf-verification.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-taf-verification
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Embed verifier and enforce native central archive
        run: |
          python3 scripts/embed_taf_verification.py
          python3 scripts/apply_central_archive_cutover.py
          python3 scripts/finalize_central_message_architecture.py
          python3 scripts/ensure_taf_native_archive.py
          node --check taf-verification.js
          grep -F 'PrognozaEPIRMessageArchive' taf.html
          grep -F 'loadNeighborArchive' taf.html
          ! grep -F 'taf-archive-source.js' taf.html
          ! grep -F 'loadImgwLive(' taf.html
          ! grep -F 'awiacja.imgw.pl' taf.html
          ! grep -F 'aviationweather.gov' taf.html
          ! grep -F '/api/taf-proxy' taf.html
          ! grep -F 'data/observations/metar/' taf-verification.js
          ! grep -F 'data/taf/epir/' taf-verification.js
      - name: Commit synchronized page
        run: |
          if git diff --quiet -- taf.html taf-verification.js data/messages; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taf.html taf-verification.js data/messages
          git commit -m 'taf: keep verifier on native central message archive'
          git pull --rebase origin main
          git push
