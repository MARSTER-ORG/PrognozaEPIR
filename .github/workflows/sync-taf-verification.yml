name: Sync TAF verification inline
on:
  push:
    branches: [main]
    paths:
      - taf-verification.js
      - scripts/embed_taf_verification.py
      - scripts/fix_taf_verification_live_archive.py
      - .github/workflows/sync-taf-verification.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: sync-taf-verification
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce live verifier and embed it
        run: |
          python3 scripts/fix_taf_verification_live_archive.py
          python3 scripts/embed_taf_verification.py
          node --check taf-verification.js
          grep -F 'PrognozaEPIRMessageArchive' taf.html
          grep -F 'loadNeighborArchive' taf.html
          grep -F "A.getLatest('TAF','EPIR',true)" taf-verification.js
          grep -F 'central-ingestor-production.up.railway.app/data/messages/' taf-verification.js
          grep -F 'LIVE Railway/MessageArchive' taf-verification.js
          test "$(grep -F -c 'function centralDayUrls(kind,day)' taf-verification.js)" -eq 1
          ! grep -F 'taf-archive-source.js' taf.html
          ! grep -F 'loadImgwLive(' taf.html
          ! grep -F 'awiacja.imgw.pl' taf.html
          ! grep -F 'aviationweather.gov' taf.html
          ! grep -F '/api/taf-proxy' taf.html
          ! grep -F 'data/observations/metar/' taf-verification.js
          ! grep -F 'data/taf/epir/' taf-verification.js
      - name: Commit synchronized verifier
        run: |
          if git diff --quiet -- taf.html taf-verification.js; then
            echo 'TAF verification already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taf.html taf-verification.js
          git commit -m 'taf: keep verifier on live central message archive'
          git pull --rebase origin main
          git push
      - name: Deploy current main to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
