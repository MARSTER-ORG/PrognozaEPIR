name: Sync TAF verification inline
on:
  push:
    branches: [main]
    paths:
      - taf-verification.js
      - scripts/embed_taf_verification.py
      - scripts/integrate_taf_mifg.py
      - scripts/fix_taf_validity_codes.py
      - .github/workflows/sync-taf-verification.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-taf-verification
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate verifier and retain central source
        run: |
          python3 scripts/integrate_taf_mifg.py
          python3 scripts/fix_taf_validity_codes.py
          python3 scripts/embed_taf_verification.py
          python3 scripts/apply_central_archive_cutover.py
          node --check taf-verification.js
          node --check taf-archive-source.js
          grep -F 'src="taf-archive-source.js"' taf.html
          ! grep -F 'function fromProxy(' taf.html
      - name: Commit synchronized page
        run: |
          if git diff --quiet -- taf.html taf-verification.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taf.html taf-verification.js
          git commit -m 'taf: keep verifier on central message archive'
          git pull --rebase origin main
          git push
