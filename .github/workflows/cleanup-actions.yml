name: Cleanup old Actions runs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cleanup-actions.yml"
  schedule:
    - cron: "17 */12 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-old-actions-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete completed workflow runs older than 2 days
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cutoff = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000);

            // Keep enough REST API budget for pagination and GitHub housekeeping.
            const maxDeletes = 850;

            // GitHub limits filtered workflow-run searches to a finite result window.
            // Filtering by creation time here is essential: otherwise only the newest
            // runs are returned and old runs can be missed entirely.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                status: 'completed',
                created: `<${cutoff.toISOString()}`,
                per_page: 100,
              }
            );

            const oldRuns = runs
              .filter(run => new Date(run.created_at) < cutoff)
              .filter(run => Number(run.id) !== Number(context.runId))
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            let deleted = 0;
            let failed = 0;
            let stoppedForRateLimit = false;

            for (const run of oldRuns) {
              if (deleted >= maxDeletes) break;

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted += 1;
              } catch (error) {
                const remaining = Number(error?.response?.headers?.['x-ratelimit-remaining'] ?? -1);
                if (error.status === 403 && remaining >= 0 && remaining < 20) {
                  stoppedForRateLimit = true;
                  core.warning('Stopping cleanup before hitting the GitHub API rate limit.');
                  break;
                }

                failed += 1;
                core.warning(`Could not delete run ${run.id}: ${error.message}`);
              }
            }

            const visibleRemaining = Math.max(0, oldRuns.length - deleted);

            await core.summary
              .addHeading('GitHub Actions cleanup')
              .addTable([
                [{data: 'Cutoff', header: true}, cutoff.toISOString()],
                [{data: 'Old completed runs returned by API', header: true}, String(oldRuns.length)],
                [{data: 'Deleted in this run', header: true}, String(deleted)],
                [{data: 'Old runs left in this API batch', header: true}, String(visibleRemaining)],
                [{data: 'Delete failures', header: true}, String(failed)],
                [{data: 'Stopped for rate limit', header: true}, String(stoppedForRateLimit)],
              ])
              .write();

            core.info(`API returned ${oldRuns.length} completed runs older than ${cutoff.toISOString()}.`);
            core.info(`Deleted ${deleted}; visible batch remaining: ${visibleRemaining}; failures: ${failed}.`);
