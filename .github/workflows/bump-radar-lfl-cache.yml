name: Bump LFL frontend cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-radar-lfl-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump radar repair runtime URL
        shell: bash
        run: |
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          p=Path('radar.html')
          s=p.read_text(encoding='utf-8')
          old='radar-repair.js?v=20260914-r6'
          new='radar-repair.js?v=20260915-lfl-r8'
          if new not in s:
              if old not in s:
                  raise SystemExit('radar repair script URL anchor missing')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet -- radar.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.html
          git commit -m 'Refresh radar runtime cache for LFL r8'
          for n in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
