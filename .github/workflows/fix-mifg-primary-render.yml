name: Fix MIFG primary renderer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-mifg-primary-render.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch MIFG renderer
        run: python3 scripts/fix_mifg_primary_renderer.py
      - name: Validate JavaScript
        run: node --check mifg-engine.js
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mifg-engine.js
          git commit -m "ui: make primary MIFG summary match BR"
          git pull --rebase origin main
          git push origin HEAD:main
