name: EPIR TAF independent recovery

# Unlike the old heartbeat this runs a real collector on GitHub-hosted compute.
# Railway stays primary; GitHub runs a separately networked recovery path.
on:
  schedule:
    # Four acquisitions per day, near the six-hour TAF issuance windows.
    # 15 minutes after 05:30/11:30/17:30/23:30 UTC allows EPBY's :30 issue to appear.
    # GitHub Actions may start scheduled jobs later than the cron minute.
    - cron: '45 5,11,17,23 * * *'
  workflow_dispatch:
    # Manual recovery remains available when an unscheduled TAF correction is issued.

permissions:
  contents: write

concurrency:
  group: prognozaepir-message-archive-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROGNOZAEPIR_TAF_REQUIRE_NEW_CYCLE: '1'
    steps:
      - name: Checkout canonical source and archive
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector modules
        run: |
          python3 -m py_compile scripts/collect_neighbor_tafs.py scripts/collect_neighbor_tafs_tiered.py scripts/message_archive.py scripts/finalize_central_message_architecture_v2.py scripts/supabase_message_mirror.py
      - name: Acquire from independent runner
        run: |
          set -euo pipefail
          python3 scripts/collect_neighbor_tafs_tiered.py
          python3 scripts/message_archive.py
          python3 scripts/finalize_central_message_architecture_v2.py
          python3 scripts/message_archive.py --validate-only
      - name: Determine current station coverage
        id: coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import collect_neighbor_tafs_tiered as collector

          cache = json.loads(Path('data/taf/neighbors.json').read_text(encoding='utf-8'))
          stations = cache.get('stations') or {}
          now = datetime.now(timezone.utc)
          latest = json.loads(Path('data/messages/latest.json').read_text(encoding='utf-8'))
          metar = latest.get('metar_only') or latest.get('metar') or {}
          epir_auto = False
          try:
              # The checked-out GitHub latest.json may be weeks old. Check
              # the current primary archive before deciding whether EPIR is
              # running AUTO-only and has no currently published TAF.
              from sync_supabase_messages_to_git import fetch_type, parse_time
              primary = fetch_type("METAR", now - timedelta(hours=3), now + timedelta(minutes=1), station="EPIR")
              recent = [
                  (parse_time(r.get("observed_at") or r.get("message_time")), r)
                  for r in primary
              ]
              recent = [(stamp, r) for stamp, r in recent if stamp]
              if recent:
                  stamp, newest = max(recent, key=lambda x: x[0])
                  if stamp >= now - timedelta(minutes=90):
                      raw = str(newest.get("raw_text") or newest.get("raw") or newest.get("canonical_raw") or "")
                      epir_auto = 'AUTO' in raw.upper().split()
              print("EPIR AUTO confirmed by current Supabase METAR:", epir_auto)
          except Exception as exc:
              print("::warning::Cannot verify EPIR AUTO state in primary archive:", exc)
          fresh = []
          missing = []
          for sid in ('EPIR', 'EPBY', 'EPPW', 'EPKS'):
              row = stations.get(sid) or {}
              raw = row.get('raw') or ''
              valid = bool(raw and collector._scheduled_is_current(raw, now))
              if sid == 'EPIR' and epir_auto and not valid:
                  print('EPIR: TAF not published during AUTO METAR; history retained')
                  continue
              if valid:
                  fresh.append(sid)
              else:
                  missing.append(sid)
              print(f"{sid}: {'current' if valid else 'missing/stale'} | {row.get('source') or 'none'}")
          if missing:
              print('::warning::Unrecovered TAF cycles: '+', '.join(missing))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('fresh=' + ('true' if fresh else 'false') + '\n')
              output.write('epir_auto=' + ('true' if epir_auto else 'false') + '\n')
              output.write('missing=' + ','.join(missing) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('TAF independent recovery (UTC): '+now.isoformat()+'\n')
              summary.write('Fresh: '+(', '.join(fresh) or 'none')+'\n')
              summary.write('Missing or stale: '+(', '.join(missing) or 'none')+'\n')
          PY
      - name: Mirror validated TAFs to Supabase
        id: mirror
        if: steps.coverage.outputs.fresh == 'true'
        env:
          SUPABASE_URL: https://qozgntzeormujmqzkkmd.supabase.co
          MESSAGE_INGEST_TOKEN: ${{ secrets.MESSAGE_INGEST_TOKEN }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
          SUPABASE_INGEST_ENABLED: '1'
          EPIR_AUTO: ${{ steps.coverage.outputs.epir_auto }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MESSAGE_INGEST_TOKEN" || -n "$SUPABASE_INGEST_TOKEN" ]]; then
            python3 scripts/supabase_message_mirror.py --lookback-days 3 --force
          else
            echo '::notice::GitHub ingest token unavailable; the Railway ingestor owns primary Supabase writes. Verifying published TAF cycles through the read API.'
          fi
          python3 - <<'PY'
          import os
          import sys
          from datetime import datetime, timedelta, timezone
          sys.path.insert(0, "scripts")
          from sync_supabase_messages_to_git import fetch_type, parse_time
          from check_epir_archive_freshness import expected_taf_cycle, TAF_GRACE_MIN_BY_STATION

          now = datetime.now(timezone.utc)
          stations = ["EPBY", "EPPW", "EPKS"]
          if os.environ.get("EPIR_AUTO") != "true":
              stations.append("EPIR")
          for station in stations:
              rows = fetch_type("TAF", now - timedelta(days=2), now + timedelta(minutes=1), station=station)
              issue_times = [
                  parse_time(r.get("issued_at") or r.get("issue_time") or r.get("message_time"))
                  for r in rows
              ]
              latest = max((x for x in issue_times if x), default=None)
              expected = expected_taf_cycle(now, TAF_GRACE_MIN_BY_STATION[station], station)
              print(f"Primary Supabase {station} TAF: latest={latest}, required={expected}")
              if latest is None or latest < expected:
                  raise SystemExit(f"::error::TAF {station} not yet published to primary Supabase")
          PY
          echo 'mirror_ok=true' >> "$GITHUB_OUTPUT"
      - name: Preserve independent recovery in GitHub archive
        if: steps.coverage.outputs.fresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/taf/neighbors.json data/taf/latest.json data/taf/epir data/messages/taf data/messages/taf-neighbors.json data/messages/latest.json data/messages/recent.json data/messages/status.json
          if git diff --cached --quiet; then
            echo 'No new canonical TAF content.'
            exit 0
          fi
          git config user.name 'prognozaepir-taf-recovery'
          git config user.email 'taf-recovery@prognozaepir.invalid'
          git commit -m 'archive(taf): restore verified current TAFs from independent runner'
          for attempt in 1 2 3; do
            if git -c rebase.autoStash=true pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$attempt"
          done
          echo 'Could not publish independent archive TAF changes.' >&2
          exit 1

      - name: Enforce TAF availability and primary archive publishing
        if: always() && steps.coverage.outcome == 'success'
        shell: bash
        env:
          TAF_MISSING: ${{ steps.coverage.outputs.missing }}
          TAF_FRESH: ${{ steps.coverage.outputs.fresh }}
          MIRROR_OK: ${{ steps.mirror.outputs.mirror_ok }}
        run: |
          if [[ -n "$TAF_MISSING" ]]; then
            echo "::error::Official TAF issue cycles still missing for: $TAF_MISSING. See acquisition logs and provider errors."
            exit 1
          fi
          if [[ "$TAF_FRESH" == 'true' && "$MIRROR_OK" != 'true' ]]; then
            echo '::error::TAFs recovered but not verified as sent to the Supabase archive.'
            exit 1
          fi
          echo 'Current scheduled TAF cycles found and mirrored to Supabase.'
