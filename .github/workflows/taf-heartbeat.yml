name: EPIR neighbor TAF archive watchdog

on:
  schedule:
    - cron: '9-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: prognozaepir-taf-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check freshness and trigger the single ingestor if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if python3 scripts/check_epir_archive_freshness.py --taf-only --all-tafs; then
            echo 'TAF archive is fresh.'
            exit 0
          fi
          echo '::warning::TAF archive stale; triggering central ingestor'
          gh workflow run message-archive.yml --repo "${{ github.repository }}" --ref main
          exit 1
