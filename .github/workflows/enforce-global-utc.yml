name: Validate global UTC policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-global-utc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate UTC runtime invariant
        shell: bash
        run: |
          node --check utc-ui-guard.js
          python3 - <<'PY'
          from pathlib import Path
          pages=['index.html','arch.html','taf.html','radar.html','sat-fog.html','lightning-alerts.html']
          for page in pages:
              p=Path(page)
              if not p.exists():
                  raise SystemExit(f'missing public page: {page}')
              text=p.read_text(encoding='utf-8')
              if 'utc-ui-guard.js' not in text:
                  raise SystemExit(f'{page}: missing utc-ui-guard.js')
          guard=Path('utc-ui-guard.js').read_text(encoding='utf-8')
          required=["timeZone: 'UTC'",'CLOCK_RE','markUtc','toLocaleTimeString']
          for marker in required:
              if marker not in guard: raise SystemExit(f'UTC guard missing invariant: {marker}')
          print('UTC runtime invariant: OK')
          PY

      - name: Validate message archive consumer architecture
        run: python3 scripts/check_message_archive_consumers.py

      - name: Validate neighboring observation context
        run: python3 scripts/check_neighbor_observation_context.py

      - name: Validate inline JavaScript on user-facing pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=['index.html','arch.html','taf.html','radar.html','sat-fog.html','lightning-alerts.html']
          out=Path('/tmp/utc-js'); out.mkdir(exist_ok=True)
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
              for i,block in enumerate(blocks):
                  if block.strip():
                      (out/f'{page}.{i}.js').write_text(block,encoding='utf-8')
          PY
          shopt -s nullglob
          files=(/tmp/utc-js/*.js)
          for f in "${files[@]}"; do node --check "$f"; done
