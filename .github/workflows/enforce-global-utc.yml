name: Enforce global UTC policy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enforce_global_utc.py'
      - '.github/workflows/enforce-global-utc.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enforce-global-utc-main
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply project-wide UTC rule
        run: python3 scripts/enforce_global_utc.py

      - name: Validate UTC rule
        run: python3 scripts/enforce_global_utc.py --check

      - name: Validate inline JavaScript on user-facing pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=['index.html','arch.html','taf.html','radar.html','sat-fog.html']
          out=Path('/tmp/utc-js'); out.mkdir(exist_ok=True)
          for page in pages:
              text=Path(page).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
              for i,block in enumerate(blocks):
                  if block.strip():
                      (out/f'{page}.{i}.js').write_text(block,encoding='utf-8')
          PY
          for f in /tmp/utc-js/*.js; do node --check "$f"; done

      - name: Commit UTC normalization
        run: |
          if git diff --quiet; then
            echo 'All pages and modules already comply with UTC policy.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: standardize all times on UTC'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
