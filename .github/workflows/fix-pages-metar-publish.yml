name: Install direct live IMGW METAR path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pages-metar-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch live METAR browser path and Pages compatibility marker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Keep the current visible TAF version, but satisfy the legacy Pages
          # compatibility check so a TAF version bump cannot block METAR data.
          p=Path('taf.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<!-- deploy-compat: GENERATOR TAF v0.1.0 -->',
                      '<!-- deploy-compat: GENERATOR TAF v0.2.0 -->',1)
          p.write_text(s,encoding='utf-8')

          p=Path('observation-engine.js')
          s=p.read_text(encoding='utf-8')
          if "const IMGW_METAR_URL" not in s:
              marker="  const RECENT_URL = 'data/observations/recent.json';\n"
              s=s.replace(marker, marker+"  const IMGW_METAR_URL = 'https://aviation-api.imgw.pl/data/last?params=metar,taf&format=json&count=4';\n",1)

          helper_marker="  function metarPhenomena(m){\n"
          if "async function fetchImgwLiveMetar" not in s:
              helper=r'''  function walkImgwMessages(value,out=[]){
    if(Array.isArray(value)){for(const x of value)walkImgwMessages(x,out);return out;}
    if(value&&typeof value==='object'){
      if(typeof value.message==='string')out.push(value);
      for(const x of Object.values(value))walkImgwMessages(x,out);
    }
    return out;
  }

  function metarTimeFromToken(token){
    const m=String(token||'').match(/^(\d{2})(\d{2})(\d{2})Z$/);if(!m)return null;
    const dd=Number(m[1]),hh=Number(m[2]),mm=Number(m[3]),now=new Date(),cand=[];
    for(const dm of [-1,0,1]){
      const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()+dm,dd,hh,mm));
      if(d.getUTCDate()===dd&&d.getUTCHours()===hh&&d.getUTCMinutes()===mm)cand.push(d);
    }
    if(!cand.length)return null;
    cand.sort((a,b)=>Math.abs(a-now)-Math.abs(b-now));return cand[0].toISOString();
  }

  function signedMetarTemp(v){
    if(!v)return null;const neg=v.startsWith('M'),n=Number(v.replace(/^M/,''));return finite(n)?(neg?-n:n):null;
  }

  function decodeImgwLiveMetar(raw){
    let text=String(raw||'').replace(/\s+/g,' ').trim().replace(/=$/,'');
    const reportType=/^SPECI\b/i.test(text)?'SPECI':'METAR';
    text=text.replace(/^(?:METAR|SPECI)\s+/i,'');
    if(!/^EPIR\s+/i.test(text)||/\bNIL\b/i.test(text))return null;
    const tm=text.match(/\b(\d{6}Z)\b/),obs=metarTimeFromToken(tm?.[1]);if(!obs)return null;
    const wind=text.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/i);
    const tt=text.match(/\b(M?\d{2})\/(M?\d{2})\b/i),q=text.match(/\bQ(\d{4})\b/i);
    const T=signedMetarTemp(tt?.[1]),Td=signedMetarTemp(tt?.[2]);
    let vis=null,vlb=false,vrep=null;
    if(/\bCAVOK\b/i.test(text)){vis=10000;vlb=true;vrep='CAVOK';}
    else if(wind){const tail=text.slice((wind.index||0)+wind[0].length);const vm=tail.match(/\b(9999|\d{4})\b/);if(vm){vrep=vm[1];vis=vm[1]==='9999'?10000:Number(vm[1]);vlb=vm[1]==='9999';}}
    const clouds=[];for(const m of text.matchAll(/\b(FEW|SCT|BKN|OVC|VV)(\d{3})\b/gi)){const ft=Number(m[2])*100;clouds.push({cover:m[1].toUpperCase(),base_ft_agl:ft,base_m_agl:Math.round(ft*.3048)});}
    const ceil=clouds.find(x=>['BKN','OVC','VV'].includes(x.cover))?.base_m_agl??null;
    const wx=[];for(const code of ['FZFG','MIFG','BCFG','PRFG','FG','BR'])if(new RegExp(`(^|\\s)${code}(?=\\s|$|=)`).test(text))wx.push(code);
    let rh=null;if(T!==null&&Td!==null){const a=17.625,b=243.04;rh=Math.max(0,Math.min(100,100*Math.exp(a*Td/(b+Td)-a*T/(b+T))));}
    return {source:'IMGW_AVIATION_METAR',station:'EPIR',obs_time:obs,temperature_c:T,dew_point_c:Td,relative_humidity_pct:rh===null?null:Math.round(rh*10)/10,
      visibility_m:vis,visibility_lower_bound:vlb,visibility_upper_bound:false,visibility_report:vrep,
      wind_direction_deg:!wind||wind[1].toUpperCase()==='VRB'?null:Number(wind[1]),wind_speed_ms:wind?Math.round(Number(wind[2])*.514444*100)/100:null,
      wind_gust_ms:wind?.[3]?Math.round(Number(wind[3])*.514444*100)/100:null,pressure_hpa:q?Number(q[1]):null,
      weather:wx.join(' ')||null,fog:wx.some(x=>x.endsWith('FG')),mist:wx.includes('BR'),freezing_fog:wx.includes('FZFG'),ceiling_m_agl:ceil,clouds,raw:text,report_type:reportType,imgw_browser_live:true};
  }

  async function fetchImgwLiveMetar(){
    const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),5000);
    try{
      const sep=IMGW_METAR_URL.includes('?')?'&':'?';
      const r=await fetch(`${IMGW_METAR_URL}${sep}_=${Date.now()}`,{cache:'no-store',signal:ctrl.signal});
      if(!r.ok)throw new Error(`IMGW HTTP ${r.status}`);
      const j=await r.json(),records=walkImgwMessages(j?.EPIR?.metars||[]),rows=[];
      for(const rec of records){const row=decodeImgwLiveMetar(rec?.message);if(row)rows.push(row);}
      rows.sort((a,b)=>Date.parse(a.obs_time)-Date.parse(b.obs_time));return rows.at(-1)||null;
    }finally{clearTimeout(timer);}
  }

  function liveFused(m){
    return {obs_time:m.obs_time,metar_obs_time:m.obs_time,synop_obs_time:null,temperature_c:m.temperature_c,dew_point_c:m.dew_point_c,
      relative_humidity_pct:m.relative_humidity_pct,visibility_m:m.visibility_m,visibility_lower_bound:m.visibility_lower_bound,visibility_upper_bound:m.visibility_upper_bound,
      visibility_source:m.source,wind_direction_deg:m.wind_direction_deg,wind_speed_ms:m.wind_speed_ms,pressure_hpa:m.pressure_hpa,fog:m.fog,mist:m.mist,freezing_fog:m.freezing_fog,
      cloud_base_m_agl:m.ceiling_m_agl,sources:{temperature:m.source,dew_point:m.source,rh:m.source,visibility:m.source,wind_direction:m.source,wind_speed:m.source,pressure:m.source,cloud_base:m.source}};
  }

  function applyLiveMetar(m){
    if(!m)return false;const nt=Date.parse(m.obs_time),ot=Date.parse(latestData?.metar?.obs_time||'');if(!finite(nt)||(finite(ot)&&nt<=ot))return false;
    latestData=latestData||{station:{icao:'EPIR',synop:'12342',wigos:'0-20000-0-12342'}};
    latestData.metar=m;latestData.fused=liveFused(m);latestData.updated_at=m.obs_time;latestData.collected_at=new Date().toISOString();
    latestData.metar_freshness={...(latestData.metar_freshness||{}),status:'ok',age_min:Math.max(0,Math.round((Date.now()-nt)/6000)/10),fresh_limit_min:60};
    recentData=recentData||{schema:'epir-observation-history-v2',station:latestData.station,hours:30,metar:[],synop:[],observations:[]};
    recentData.metar=Array.isArray(recentData.metar)?recentData.metar:[];recentData.observations=Array.isArray(recentData.observations)?recentData.observations:[];
    if(!recentData.metar.some(x=>x?.obs_time===m.obs_time&&x?.raw===m.raw))recentData.metar.push(m);
    const f=liveFused(m);if(!recentData.observations.some(x=>x?.metar_obs_time===m.obs_time))recentData.observations.push(f);
    recentData.metar.sort((a,b)=>Date.parse(a.obs_time)-Date.parse(b.obs_time));recentData.observations.sort((a,b)=>Date.parse(a.obs_time)-Date.parse(b.obs_time));
    return true;
  }

'''
              s=s.replace(helper_marker,helper+helper_marker,1)

          old=r'''  async function bootstrap(){
    setVersion();
    try{
      [latestData,recentData]=await Promise.all([fetchJson(LATEST_URL),fetchJson(RECENT_URL)]);
      storeAutomaticObservations(recentData);
    }catch(e){
      console.warn('EPIR automatic observations:',e);
      try{localStorage.removeItem(OBS_KEY);}catch(_){ }
    }
    try{await loadFogEngine();}catch(e){console.error('EPIR Fog Engine load:',e);return;}
    setVersion();
    let tries=0;
    const t=setInterval(()=>{
      setVersion();
      if(installPanel()||++tries>40){clearInterval(t);refreshVerification();}
    },250);
    setInterval(refreshVerification,30*1000);
    setInterval(async()=>{
      try{
        const [l,r]=await Promise.all([fetchJson(LATEST_URL),fetchJson(RECENT_URL)]);
        const old=latestData?.updated_at;
        latestData=l;recentData=r;storeAutomaticObservations(r);
        if(l?.updated_at!==old) location.reload();
      }catch(_){ }
    },5*60*1000);
  }
'''
          new=r'''  async function refreshLiveMetar(){
    try{
      const live=await fetchImgwLiveMetar();
      if(applyLiveMetar(live)){
        storeAutomaticObservations(recentData);installPanel();refreshVerification();
        console.info('EPIR live METAR from IMGW:',live.obs_time,live.raw);
      }
    }catch(e){console.warn('EPIR live IMGW METAR:',e);}
  }

  async function bootstrap(){
    setVersion();
    try{
      const [l,r]=await Promise.allSettled([fetchJson(LATEST_URL),fetchJson(RECENT_URL)]);
      if(l.status==='fulfilled')latestData=l.value;
      if(r.status==='fulfilled')recentData=r.value;
      await refreshLiveMetar();
      if(recentData)storeAutomaticObservations(recentData);
    }catch(e){console.warn('EPIR automatic observations:',e);}
    try{await loadFogEngine();}catch(e){console.error('EPIR Fog Engine load:',e);return;}
    setVersion();
    let tries=0;
    const t=setInterval(()=>{
      setVersion();
      if(installPanel()||++tries>40){clearInterval(t);refreshVerification();}
    },250);
    setInterval(refreshVerification,30*1000);
    setInterval(refreshLiveMetar,2*60*1000);
    setInterval(async()=>{
      try{
        const [l,r]=await Promise.allSettled([fetchJson(LATEST_URL),fetchJson(RECENT_URL)]);
        if(l.status==='fulfilled')latestData=l.value;
        if(r.status==='fulfilled')recentData=r.value;
        await refreshLiveMetar();
        if(recentData)storeAutomaticObservations(recentData);
        installPanel();refreshVerification();
      }catch(_){ }
    },5*60*1000);
  }
'''
          if old not in s:
              raise SystemExit('bootstrap block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check observation-engine.js
          grep -F 'async function fetchImgwLiveMetar' observation-engine.js
          grep -F 'setInterval(refreshLiveMetar,2*60*1000)' observation-engine.js
          grep -F 'deploy-compat: GENERATOR TAF v0.2.0' taf.html
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observation-engine.js taf.html
          git commit -m 'fix: read live EPIR METAR directly from IMGW in browser'
          git pull --rebase origin main
          git push origin HEAD:main
