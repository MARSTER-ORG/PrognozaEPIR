name: Fix wind arrow z-order
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wind-arrow-layer.yml'
permissions:
  contents: write
concurrency:
  group: fix-wind-arrow-z-order
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Put wind direction arrows on top
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="yy+=PANELS[5].h;ctx.fillStyle='#18228a';ctx.textAlign='center';ctx.font='16px Arial';for(let i=0;i<d.length;i+=3){const z=d[i];if(!finite(z.WD))continue;ctx.save();ctx.translate(x(z.t),yy+PANELS[6].h/2);ctx.rotate((z.WD+180)*Math.PI/180);ctx.fillText('↑',0,5);ctx.restore()}yy+=PANELS[6].h;"
          new="yy+=PANELS[5].h;const dirPanelY=yy;yy+=PANELS[6].h;"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('wind arrow source block not found')

          marker="line(d.map(z=>({x:x(z.t),y:scale(z.oktaH,0,8,yy,PANELS[8].h)})),'#bd4723',1.7);cv._meta="
          overlay="line(d.map(z=>({x:x(z.t),y:scale(z.oktaH,0,8,yy,PANELS[8].h)})),'#bd4723',1.7);ctx.save();ctx.beginPath();ctx.rect(x0,dirPanelY,x1-x0,PANELS[6].h);ctx.clip();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='16px Arial';ctx.lineJoin='round';ctx.strokeStyle=cp.panel;ctx.lineWidth=4;ctx.fillStyle='#18228a';for(let i=0;i<d.length;i+=3){const z=d[i];if(!finite(z.WD))continue;ctx.save();ctx.translate(x(z.t),dirPanelY+PANELS[6].h/2);ctx.rotate((z.WD+180)*Math.PI/180);ctx.strokeText('↑',0,0);ctx.fillText('↑',0,0);ctx.restore()}ctx.restore();cv._meta="
          if marker in s:
              s=s.replace(marker,overlay,1)
          elif "ctx.strokeText('↑',0,0);ctx.fillText('↑',0,0)" not in s:
              raise SystemExit('draw tail marker not found')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate draw order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "const dirPanelY=yy;yy+=PANELS[6].h;" in s
          assert "ctx.strokeText('↑',0,0);ctx.fillText('↑',0,0)" in s
          assert s.index("ctx.strokeText('↑',0,0)") > s.index("scale(z.oktaH,0,8,yy,PANELS[8].h)")
          assert "ctx.fillText('↑',0,5)" not in s
          print('OK: wind arrows are the final meteogram overlay')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'prognozaepir-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Render wind direction arrows above chart lines'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
