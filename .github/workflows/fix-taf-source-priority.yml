name: Fix TAF source priority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-taf-source-priority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make automatic TAF sources authoritative
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('taf.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  "const VERSION = 'TAF Sources v0.3.1';",
                  "const VERSION = 'TAF Sources v0.3.2';",
              ),
              (
                  "function rank(c){if(c.manual)return 100;if(/IMGW/i.test(c.source))return 80;if(/PilotHub/i.test(c.source))return 70;if(/AWC/i.test(c.source))return 60;if(/cache/i.test(c.source))return 10;return 20}",
                  "function rank(c){if(c.manual)return -10;if(/IMGW/i.test(c.source))return 80;if(/PilotHub/i.test(c.source))return 70;if(/AWC/i.test(c.source))return 60;if(/cache/i.test(c.source))return 50;return 20}",
              ),
              (
                  "function select(list){return [...list].sort((a,b)=>a.current!==b.current?(a.current?-1:1):a.manual!==b.manual?(a.manual?-1:1):b.issue!==a.issue?b.issue-a.issue:rank(b)-rank(a))[0]||null}",
                  "function select(list){return [...list].sort((a,b)=>a.current!==b.current?(a.current?-1:1):a.manual!==b.manual?(a.manual?1:-1):b.issue!==a.issue?b.issue-a.issue:rank(b)-rank(a))[0]||null}",
              ),
              (
                  "Kolejność: ręczne → najświeższe z proxy/IMGW/AWC/PilotHub → cache. TAF EPIR jest tylko referencją i nie steruje projektem.",
                  "Kolejność: źródła automatyczne (proxy/IMGW/AWC/PilotHub/cache) → ręczne tylko awaryjnie. Ręczny TAF nie może maskować działającego źródła automatycznego. TAF EPIR jest tylko referencją i nie steruje projektem.",
              ),
              (
                  "GENERATOR TAF v0.2.0",
                  "GENERATOR TAF v0.2.1",
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected TAF hook not found: ' + old[:90])
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -F "TAF Sources v0.3.2" taf.html
          grep -F "a.manual?1:-1" taf.html
          grep -F "ręczne tylko awaryjnie" taf.html
          grep -F "GENERATOR TAF v0.2.1" taf.html

      - name: Commit fix
        run: |
          if git diff --quiet -- taf.html; then
            echo "No TAF changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taf.html
          git commit -m "fix: prefer automatic TAF sources over manual fallback"
          git pull --rebase origin main
          git push origin HEAD:main
