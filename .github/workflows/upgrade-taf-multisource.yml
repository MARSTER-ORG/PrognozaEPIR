name: Upgrade TAF multi-source frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-taf-multisource.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Embed multi-source TAF loader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('taf.html')
          s=p.read_text(encoding='utf-8')
          addon=Path('taf-multisource.js').read_text(encoding='utf-8').strip()
          marker='TAF Sources v0.3.0'
          if marker not in s:
              anchor="<script>\n'use strict';"
              if anchor not in s:
                  raise SystemExit('TAF inline script anchor not found')
              embedded='<script>\n'+addon+'\n</script>\n'
              s=s.replace(anchor,embedded+anchor,1)
          s=s.replace('Generator po kliknięciu „Odśwież i generuj” pobiera bieżące METAR/TAF bezpośrednio z awiacja.imgw.pl,',
                      'Generator po kliknięciu „Odśwież i generuj” scala TAF z IMGW, AWC, PilotHub przez proxy, cache i źródeł ręcznych,')
          p.write_text(s,encoding='utf-8')
          PY

          node --check taf-multisource.js
          node --check api/taf-proxy.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('taf.html').read_text(encoding='utf-8')
          first=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/taf-source-inline.js').write_text(first,encoding='utf-8')
          PY
          node --check /tmp/taf-source-inline.js
          grep -F 'TAF Sources v0.3.0' taf.html
          grep -F 'manualTafInput' taf.html
          grep -F 'api/taf-proxy' vercel.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taf.html
          if git diff --cached --quiet; then
            echo 'TAF multi-source loader already embedded'
            exit 0
          fi
          git commit -m "taf: enable multi-source loader manual TAFs and proxy"
          git pull --rebase origin main
          git push origin HEAD:main
