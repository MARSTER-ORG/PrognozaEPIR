# retrigger
name: Reconcile TAF cloud rollback and 12h wind mean

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taf-reconcile-cloud-wind.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pre-cloud-hotfix logic and add stable 12h base wind mean
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          BASE='d3fc9f7dee6c46c58b6a961cd86c8229d9842454'
          def restore(path):
              data=subprocess.check_output(['git','show',f'{BASE}:{path}'])
              Path(path).write_bytes(data)

          restore('taf-generator-policy.js')
          restore('tests/taf-hybrid-engine.test.js')

          p=Path('taf-hybrid-adapter.js')
          s=p.read_text(encoding='utf-8')
          marker="  function visText(v){if(!finite(v)||v>=10000)return'9999';"
          insert=r'''  function windPeriodStable(hours){
    const a=(hours||[]).filter(h=>finite(+h?.windKt));
    if(a.length<3)return false;
    for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
      const x=a[i],y=a[j],xs=+x.windKt||0,ys=+y.windKt||0;
      if(Math.abs(xs-ys)>=10)return false;
      if(finite(+x.windDir)&&finite(+y.windDir)&&circ(+x.windDir,+y.windDir)>=60&&(xs>=10||ys>=10))return false;
      const xg=finite(+x.gustKt)&&+x.gustKt-xs>=10,yg=finite(+y.gustKt)&&+y.gustKt-ys>=10;
      if(xg!==yg&&(xs>=15||ys>=15))return false;
    }
    return true;
  }
  function averagedPeriodWind(hours){
    const a=(hours||[]).filter(h=>finite(+h?.windKt));
    if(!a.length)return null;
    let speed=0,u=0,v=0,dw=0,gust=0,gw=0,spread=0;
    for(const h of a){
      const ws=Math.max(0,+h.windKt||0);speed+=ws;
      if(finite(+h.windDir)){const r=rad(+h.windDir),w=Math.max(1,ws);u+=Math.sin(r)*w;v+=Math.cos(r)*w;dw+=w;}
      if(finite(+h.gustKt)){gust+=+h.gustKt;gw++;}
    }
    const windKt=speed/a.length,windDir=dw?deg(Math.atan2(u,v)):null,gustKt=gw?gust/gw:null;
    if(finite(windDir))for(const h of a)if(finite(+h.windDir))spread=Math.max(spread,circ(+h.windDir,windDir));
    return{windKt,windDir,gustKt,dirSpreadDeg:spread};
  }
  function applyStablePeriodBaseWind(result){
    const hours=result?.hourly||[];
    if(!result?.base?.state||!windPeriodStable(hours))return result;
    const w=averagedPeriodWind(hours);if(!w)return result;
    const token=windText(w,false),old=result.base.text||'',m=old.match(/^(?:VRB|\d{3})\d{2,3}(?:G(?:P99|\d{2,3}))?KT\b/);
    if(!m)return result;
    const oldToken=m[0];
    result.base.state={...result.base.state,windKt:w.windKt,windDir:w.windDir,gustKt:w.gustKt,dirSpreadDeg:w.dirSpreadDeg};
    result.base.text=old.replace(oldToken,token);
    if(result.base.display)result.base.display={...result.base.display,wind:token};
    if(typeof result.taf==='string')result.taf=result.taf.replace(oldToken,token);
    result.diagnostics=result.diagnostics||{};
    result.diagnostics.baseWindAverage={active:true,hours:hours.length,windKt:w.windKt,windDir:w.windDir,gustKt:w.gustKt,token};
    if(Array.isArray(result.diagnostics.reasons))result.diagnostics.reasons.push(`Wiatr bazowy ${token}: średnia z ${hours.length} h, ponieważ różnice w całym okresie nie spełniają kryteriów istotnej zmiany wiatru TAF.`);
    return result;
  }
'''
          if 'function applyStablePeriodBaseWind(result)' not in s:
              if marker not in s: raise SystemExit('adapter insertion marker not found')
              s=s.replace(marker,insert+marker,1)
          old="    const result=engine.generate({station:'EPIR',issue:c.issue,start:c.start,end:c.end,rows,observation:data.observation,observations:data.history,msaFt:msaFt(),rowsAlreadyAnchored:false,record:true});\n    renderResult(result,data,rows);return result;"
          new="    const result=engine.generate({station:'EPIR',issue:c.issue,start:c.start,end:c.end,rows,observation:data.observation,observations:data.history,msaFt:msaFt(),rowsAlreadyAnchored:false,record:true});\n    applyStablePeriodBaseWind(result);\n    renderResult(result,data,rows);return result;"
          if 'applyStablePeriodBaseWind(result);' not in s:
              if old not in s: raise SystemExit('adapter generate marker not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          u=Path('utc-ui-guard.js')
          q=u.read_text(encoding='utf-8')
          q,n=re.subn(r"taf-generator-policy\.js\?v=[^']+","taf-generator-policy.js?v=20260913-cloud-revert-windavg-v12",q,count=1)
          if n!=1: raise SystemExit('policy loader cache-bust marker not found')
          u.write_text(q,encoding='utf-8')

          Path('.github/workflows/taf-cloud-threshold-hotfix.yml').unlink(missing_ok=True)
          Path('.github/workflows/taf-reconcile-cloud-wind.yml').unlink(missing_ok=True)
      - name: Validate JavaScript and hybrid tests
        run: |
          node --check taf-generator-policy.js
          node --check taf-hybrid-adapter.js
          node --check utc-ui-guard.js
          node tests/taf-hybrid-engine.test.js
      - name: Commit reconciled TAF logic
        run: |
          git config user.name 'prognozaepir-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'TAF: restore cloud criteria and average stable 12h wind'
          git push origin HEAD:main
