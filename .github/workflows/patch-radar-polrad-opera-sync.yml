name: Patch POLRAD OPERA synchronization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-radar-polrad-opera-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix POLRAD animation, product coverage and OPERA time alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'missing patch anchor: {label}')

          def must_sub(text, pattern, repl, label):
              out, n = re.subn(pattern, repl, text, count=1, flags=re.S)
              if n == 1:
                  return out
              if isinstance(repl, str) and repl.strip() and repl.strip() in text:
                  return text
              raise SystemExit(f'missing regex patch anchor: {label}')

          # ------------------------------------------------------------------
          # radar-intelligence.js
          # One owner for the POLRAD map image, six official visualisations,
          # runtime capability probing, and an explicit frame-time event.
          p = Path('radar-intelligence.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// PrognozaEPIR v0.11.0', '// PrognozaEPIR v0.11.2', 1)
          s = s.replace("version.textContent = 'RADAR / SAT / AI v0.11.0'", "version.textContent = 'RADAR / SAT / AI v0.11.2'", 1)

          old_products = """  const POLRAD_PRODUCTS = {\n    cmax: {label:'POLRAD CMAX', short:'CMAX'},\n    sri:  {label:'POLRAD SRI', short:'SRI'},\n    pac:  {label:'POLRAD PAC 1h', short:'PAC'}\n  };\n"""
          new_products = """  // Official IMGW radar viewer exposes six visualisations. Some of them are\n  // not always published through the same list endpoint, therefore each\n  // product is capability-probed and unavailable transports are disabled\n  // instead of being silently substituted with another field.\n  const POLRAD_PRODUCTS = {\n    cmax:  {label:'POLRAD CMAX', short:'CMAX', apiKeys:['cmax'], operaComparable:true},\n    cappi: {label:'POLRAD CAPPI 1 km', short:'CAPPI', apiKeys:['cappi','cappi1','cappi_1km'], operaComparable:true},\n    eht:   {label:'POLRAD EHT', short:'EHT', apiKeys:['eht','etop','echo_top'], operaComparable:false},\n    sri:   {label:'POLRAD SRI', short:'SRI', apiKeys:['sri'], operaComparable:false},\n    pac:   {label:'POLRAD PAC 1 h', short:'PAC', apiKeys:['pac'], operaComparable:false},\n    hail:  {label:'POLRAD grad', short:'GRAD', apiKeys:['hail','grad','hailprob'], operaComparable:false}\n  };\n"""
          s = must_replace(s, old_products, new_products, 'POLRAD product catalogue')

          old_state = """  let polradProduct = 'cmax';\n  let polradFrames = [];\n  let polradIndex = 0;\n  let polradLayer = null;\n  let polradTimer = null;\n  let polradAvailable = false;\n"""
          new_state = """  let polradProduct = 'cmax';\n  let polradFrames = [];\n  let polradIndex = 0;\n  let polradLayer = null;\n  let polradTimer = null;\n  let polradAvailable = false;\n  let polradFrameToken = 0;\n  const polradFrameCache = new Map();\n  const POLRAD_PANE = 'polradImagePane';\n"""
          s = must_replace(s, old_state, new_state, 'POLRAD state')

          old_fetch_remove_frame = re.compile(r"  async function fetchPolradFrames\(product\) \{.*?\n  \}\n\n  function removePolradLayer\(\) \{.*?\n  \}\n\n  function setPolradFrame\(index\) \{.*?\n  \}\n", re.S)
          new_fetch_remove_frame = r'''  async function fetchPolradFrames(product, {force=false}={}) {
    if (!force && polradFrameCache.has(product)) return polradFrameCache.get(product).frames;
    const meta = POLRAD_PRODUCTS[product] || {apiKeys:[product]};
    let lastError = null;
    for (const apiKey of (meta.apiKeys || [product])) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 9000);
      try {
        const r = await fetch(`https://meteo.imgw.pl/api/radars/v1/list/${encodeURIComponent(apiKey)}`, {
          cache:'no-cache', signal:controller.signal
        });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        const direct = data?.[apiKey]?.list || data?.[product]?.list;
        const fallback = direct || Object.values(data || {}).find(v => Array.isArray(v?.list))?.list;
        if (!Array.isArray(fallback) || !fallback.length) throw new Error('brak klatek');
        const frames = fallback
          .filter(f => f && f.url && Number.isFinite(Number(f.date)))
          .sort((a, b) => Number(a.date) - Number(b.date));
        if (!frames.length) throw new Error('brak poprawnych klatek');
        polradFrameCache.set(product,{frames,apiKey,checkedAt:Date.now()});
        meta.resolvedApiKey = apiKey;
        return frames;
      } catch (e) {
        lastError = e;
      } finally {
        clearTimeout(timeout);
      }
    }
    throw lastError || new Error('produkt niedostępny w API listy');
  }

  async function auditPolradProducts() {
    await Promise.all(Object.keys(POLRAD_PRODUCTS).map(async product => {
      const b = polradButtons[product];
      if (!b) return;
      try {
        const frames = await fetchPolradFrames(product);
        b.disabled = false;
        const key = POLRAD_PRODUCTS[product].resolvedApiKey || product;
        b.title = `${POLRAD_PRODUCTS[product].short}: ${frames.length} klatek · źródło IMGW / ${key}`;
        b.dataset.available = '1';
      } catch (e) {
        b.disabled = product !== 'cmax';
        b.dataset.available = '0';
        b.title = `${POLRAD_PRODUCTS[product].short}: oficjalny produkt IMGW, ale brak dostępnej listy obrazów w wykrywanych endpointach`;
      }
    }));
  }

  function ensurePolradPane() {
    let pane = map.getPane(POLRAD_PANE);
    if (!pane) pane = map.createPane(POLRAD_PANE);
    pane.style.zIndex = '470';
    pane.style.pointerEvents = 'none';
    return pane;
  }

  function removePolradLayer() {
    try {
      map.eachLayer(layer => {
        if (!L.ImageOverlay || !(layer instanceof L.ImageOverlay)) return;
        if (layer === polradLayer || layer?.options?.attribution === 'IMGW-PIB / POLRAD') {
          if (map.hasLayer(layer)) map.removeLayer(layer);
        }
      });
    } catch (_) {}
    polradLayer = null;
  }

  function preloadPolradFrame(index) {
    if (!polradFrames.length) return;
    const i = clamp01(Math.round(index),0,polradFrames.length-1);
    const frame = polradFrames[i];
    if (!frame?.url) return;
    try { const img = new Image(); img.decoding='async'; img.src=normalizeImgwUrl(frame.url); } catch (_) {}
  }

  function publishPolradFrame(frame) {
    const meta = POLRAD_PRODUCTS[polradProduct] || {};
    const detail = {
      product:polradProduct,
      short:meta.short || polradProduct,
      timeSec:Number(frame.date),
      timeMs:Number(frame.date) * 1000,
      comparableToOpera:!!meta.operaComparable,
      index:polradIndex,
      count:polradFrames.length,
      url:normalizeImgwUrl(frame.url)
    };
    window.PrognozaEPIRPolradState = detail;
    window.dispatchEvent(new CustomEvent('prognozaepir:polrad-frame-changed',{detail}));
  }

  function setPolradFrame(index) {
    if (!polradFrames.length) return;
    polradIndex = clamp01(Math.round(Number(index) || 0), 0, polradFrames.length - 1);
    if (historyRange) historyRange.value = polradIndex;
    const frame = polradFrames[polradIndex];
    const url = normalizeImgwUrl(frame.url);
    const active = !!polradButtons[polradProduct]?.classList.contains('active');
    const token = ++polradFrameToken;
    ensurePolradPane();

    const onLoad = () => {
      if (token !== polradFrameToken || !polradLayer) return;
      if (active && map.hasLayer(polradLayer)) polradLayer.setOpacity(.70);
      const next = polradIndex + 1 < polradFrames.length ? polradIndex + 1 : Math.max(0,polradFrames.length - 18);
      preloadPolradFrame(next);
    };
    const onError = () => {
      if (token !== polradFrameToken) return;
      if (polradLayer) polradLayer.setOpacity(0);
      setPolradStatus('POLRAD: nie udało się wczytać tej klatki; obraz został ukryty zamiast pozostawienia starej klatki.');
    };

    if (!polradLayer) {
      polradLayer = L.imageOverlay(url, POLRAD_BOUNDS, {
        pane:POLRAD_PANE, opacity:0, interactive:false, crossOrigin:true,
        attribution:'IMGW-PIB / POLRAD'
      });
      polradLayer.once('load',onLoad);
      polradLayer.once('error',onError);
      if (active) polradLayer.addTo(map);
    } else {
      polradLayer.setOpacity(0);
      polradLayer.setBounds(POLRAD_BOUNDS);
      polradLayer.once('load',onLoad);
      polradLayer.once('error',onError);
      polradLayer.setUrl(url);
      if (active && !map.hasLayer(polradLayer)) polradLayer.addTo(map);
    }

    const timeEl = byId('radarTime');
    if (timeEl) timeEl.textContent = `${POLRAD_PRODUCTS[polradProduct]?.short || polradProduct}: ${fmtRadarTime(frame.date)} UTC`.replace(' UTC UTC',' UTC');
    setPolradStatus(`Mapa: IMGW/POLRAD ${POLRAD_PRODUCTS[polradProduct]?.short || polradProduct} · ${fmtRadarTime(frame.date)} UTC · jedna aktywna klatka.`.replace(' UTC UTC',' UTC'));
    publishPolradFrame(frame);
  }
'''
          m = old_fetch_remove_frame.search(s)
          if not m:
              raise SystemExit('missing POLRAD fetch/frame functions')
          s = s[:m.start()] + new_fetch_remove_frame + s[m.end():]

          s = s.replace('polradFrames = await fetchPolradFrames(product);', 'polradFrames = await fetchPolradFrames(product,{force:true});', 1)

          s = must_sub(s,
              r"  function togglePolradAnimation\(\) \{.*?\n  \}\n\n  // ---------- Official IMGW warning overlay",
              r'''  function togglePolradAnimation() {
    if (polradTimer) { stopPolradAnimation(); return; }
    if (!polradAvailable || !polradFrames.length) return;
    if (playButton) playButton.textContent = '■ Stop';
    const start = Math.max(0, polradFrames.length - 18);
    let i = start;
    // Draw the first animation frame immediately. The same ImageOverlay is then
    // reused for every URL, so no stale first frame can remain below the loop.
    setPolradFrame(i);
    i = i + 1 < polradFrames.length ? i + 1 : start;
    preloadPolradFrame(i);
    polradTimer = setInterval(() => {
      setPolradFrame(i);
      i++;
      if (i >= polradFrames.length) i = start;
      preloadPolradFrame(i);
    }, 700);
  }

  // ---------- Official IMGW warning overlay''',
              'POLRAD animation')

          old_initial = """  // Initial official layer and ensemble. Direct POLRAD is preferred; RainViewer is fallback only.\n  selectPolrad('cmax').catch(() => {});\n  scheduleEnhanced(1400);\n"""
          new_initial = """  // Initial official layer and ensemble. Direct POLRAD is preferred; RainViewer is fallback only.\n  selectPolrad('cmax').catch(() => {});\n  setTimeout(() => auditPolradProducts().catch(() => {}), 700);\n  scheduleEnhanced(1400);\n"""
          s = must_replace(s, old_initial, new_initial, 'POLRAD initial audit')
          p.write_text(s,encoding='utf-8')

          # ------------------------------------------------------------------
          # opera-nowcast.js
          # Keep a short OPERA frame history and pair map rendering to the
          # selected POLRAD frame by UTC time. Fusion is rejected when latest
          # frames are too far apart in time.
          p = Path('opera-nowcast.js')
          s = p.read_text(encoding='utf-8')
          s = must_replace(s, "  const QIND_MIN = 0.25;\n", "  const QIND_MIN = 0.25;\n  const SYNC_TOLERANCE_MIN = 7.5;\n", 'OPERA sync tolerance')
          s = must_replace(s,
              "  let running=false,lastRun=0,latestOpera=null,libPromise=null,operaLayer=null,mapEnabled=false,mapButton=null;\n",
              "  let running=false,lastRun=0,latestOpera=null,libPromise=null,operaLayer=null,mapEnabled=false,mapButton=null;\n  let operaFrameHistory=[];\n  let lastPolradFrame=null;\n",
              'OPERA sync state')

          anchor = "  const pad2=n=>String(n).padStart(2,'0');\n\n"
          helpers = r'''  const pad2=n=>String(n).padStart(2,'0');
  const normalizeMs=value=>{
    const n=Number(value);if(!finite(n))return NaN;
    return n<1e12?n*1000:n;
  };
  const polradFrameMs=polrad=>normalizeMs(polrad?.timeMs ?? polrad?.frameEnd ?? polrad?.timeSec);
  const operaFrameMs=opera=>normalizeMs(opera?.frameEnd ?? opera?.latest?.time);

'''
          s = must_replace(s, anchor, helpers, 'OPERA time helpers')

          s = must_sub(s,
              r"  function polradSignal\(polrad\)\{.*?\n  \}\n\n  function colorForDbz",
              r'''  function polradSignal(polrad){if(!polrad||polrad.error)return false;if(polrad.source==='cmax'){const vals=Object.values(polrad.predictions||{}).map(Number).filter(finite);return vals.some(v=>v>=35)||Number(polrad.approach?.value)>=35||Number(polrad.nearest?.value)>=40}return false}
  function fuse(opera,polrad){
    const pvec=polrad?.vector||null,ovec=opera?.vector||null;
    const pTime=normalizeMs(polrad?.frameEnd),oTime=operaFrameMs(opera),frameSkewMin=finite(pTime)&&finite(oTime)?Math.abs(oTime-pTime)/60000:NaN;
    const timeAligned=finite(frameSkewMin)&&frameSkewMin<=SYNC_TOLERANCE_MIN;
    const dirDiff=pvec&&ovec?circularDiff(Number(pvec.bearingDeg),Number(ovec.bearingDeg)):NaN,ps=Number(pvec?.speedKmh),os=Number(ovec?.speedKmh),speedDiff=finite(ps)&&finite(os)?Math.abs(ps-os):NaN;
    const vectorAgree=timeAligned&&finite(dirDiff)&&finite(speedDiff)&&dirDiff<=45&&speedDiff<=Math.max(25,ps*.6),pSignal=polradSignal(polrad),oStrong=Number(opera?.approach?.value)>=35||Number(opera?.nearest?.value)>=40||Object.values(opera?.predictions||{}).some(v=>Number(v)>=35);
    let convLevel='brak sygnału do potwierdzenia';
    if(!timeAligned)convLevel='brak porównania — różny czas';
    else if(pSignal&&oStrong&&vectorAgree)convLevel='potwierdza';
    else if(pSignal&&oStrong)convLevel='częściowo potwierdza';
    else if(pSignal&&!oStrong)convLevel='nie potwierdza';
    const level=!timeAligned?'czasowo rozbieżne':!pvec||!ovec?'brak porównania':vectorAgree?'zgodne':finite(dirDiff)&&dirDiff<=70?'częściowo zgodne':'rozbieżne';
    return{updatedAt:new Date().toISOString(),level,vectorAgree,dirDiffDeg:dirDiff,speedDiffKmh:speedDiff,convectiveSupport:convLevel,polradSignal:pSignal,operaSignal:oStrong,primary:'POLRAD',secondary:'OPERA CIRRUS',timeAligned,frameSkewMin:finite(frameSkewMin)?frameSkewMin:null,polradFrameMs:finite(pTime)?pTime:null,operaFrameMs:finite(oTime)?oTime:null,syncToleranceMin:SYNC_TOLERANCE_MIN};
  }

  function colorForDbz''',
              'OPERA fusion time gate')

          old_render_map = """  function renderMapLayer(latest){ensureMapButton();if(!mapEnabled||!latest?.geoBounds||typeof L==='undefined'||typeof map==='undefined')return;const url=rasterDataUrl(latest);if(!url)return;try{if(operaLayer&&map.hasLayer(operaLayer))map.removeLayer(operaLayer)}catch(_){}operaLayer=L.imageOverlay(url,latest.geoBounds,{opacity:.52,interactive:false,attribution:'EUMETNET OPERA CIRRUS'});operaLayer.addTo(map)}\n\n"""
          new_render_map = """  // The detailed OPERA map is owned by opera-convection-bridge.js. Keeping a\n  // second ImageOverlay here caused a stale/frozen layer below the synchronized\n  // renderer. This function now only removes any legacy copy and delegates.\n  function renderMapLayer(latest){\n    ensureMapButton();\n    try{if(operaLayer&&typeof map!=='undefined'&&map.hasLayer(operaLayer))map.removeLayer(operaLayer)}catch(_){}\n    operaLayer=null;\n    if(!mapEnabled)return;\n    try{window.PrognozaEPIROperaMapLayer?.refresh?.()}catch(_){}\n  }\n\n"""
          s = must_replace(s, old_render_map, new_render_map, 'single OPERA map owner')

          old_publish = """  function publishOpera(result){latestOpera=result;window.PrognozaEPIROperaNowcast=result;window.dispatchEvent(new CustomEvent('prognozaepir:opera-nowcast-updated',{detail:result}));publishFusion()}\n  function publishFusion(){if(!latestOpera)return;const fusion=fuse(latestOpera,window.PrognozaEPIRRadarNowcast||null);window.PrognozaEPIRRadarFusion=fusion;window.dispatchEvent(new CustomEvent('prognozaepir:radar-fusion-updated',{detail:fusion}));renderFusion(fusion)}\n"""
          new_publish = r'''  function closestOperaFrame(targetMs){
    if(!finite(targetMs)||!operaFrameHistory.length)return null;
    let best=null,bestDiff=Infinity;
    for(const frame of operaFrameHistory){const t=normalizeMs(frame?.time),d=Math.abs(t-targetMs);if(finite(t)&&d<bestDiff){best=frame;bestDiff=d}}
    return best?{frame:best,skewMin:bestDiff/60000}:null;
  }

  function publishOperaDisplay(polrad=lastPolradFrame||window.PrognozaEPIRPolradState||null){
    if(!latestOpera||latestOpera.error)return;
    lastPolradFrame=polrad||lastPolradFrame;
    const comparable=!!polrad?.comparableToOpera;
    const targetMs=polradFrameMs(polrad);
    let display=latestOpera;
    if(comparable&&finite(targetMs)){
      const match=closestOperaFrame(targetMs);
      if(match&&match.skewMin<=SYNC_TOLERANCE_MIN){
        display={...latestOpera,latest:match.frame,frameEnd:normalizeMs(match.frame.time),sync:{comparable:true,synchronized:true,skewMin:match.skewMin,polradTimeMs:targetMs,operaTimeMs:normalizeMs(match.frame.time),product:polrad.product,toleranceMin:SYNC_TOLERANCE_MIN}};
      }else{
        display={...latestOpera,sync:{comparable:true,synchronized:false,skewMin:match?.skewMin??null,polradTimeMs:targetMs,operaTimeMs:match?normalizeMs(match.frame.time):null,product:polrad.product,toleranceMin:SYNC_TOLERANCE_MIN}};
      }
    }else{
      display={...latestOpera,sync:{comparable:false,synchronized:false,skewMin:null,polradTimeMs:finite(targetMs)?targetMs:null,operaTimeMs:operaFrameMs(latestOpera),product:polrad?.product||null,toleranceMin:SYNC_TOLERANCE_MIN}};
    }
    window.PrognozaEPIROperaDisplay=display;
    window.dispatchEvent(new CustomEvent('prognozaepir:opera-display-updated',{detail:display}));
    return display;
  }

  function publishOpera(result){latestOpera=result;window.PrognozaEPIROperaNowcast=result;window.dispatchEvent(new CustomEvent('prognozaepir:opera-nowcast-updated',{detail:result}));if(!result?.error)publishOperaDisplay();publishFusion()}
  function publishFusion(){if(!latestOpera)return;const fusion=fuse(latestOpera,window.PrognozaEPIRRadarNowcast||null);window.PrognozaEPIRRadarFusion=fusion;window.dispatchEvent(new CustomEvent('prognozaepir:radar-fusion-updated',{detail:fusion}));renderFusion(fusion)}
'''
          s = must_replace(s, old_publish, new_publish, 'OPERA display synchronizer')

          old_render_fusion = """  function renderFusion(f){if($('opFusion'))$('opFusion').textContent=f.level;if($('opConv'))$('opConv').textContent=f.convectiveSupport;if($('opFusionSub'))$('opFusionSub').textContent=finite(f.dirDiffDeg)?`różnica kierunku ${Math.round(f.dirDiffDeg)}° · prędkości ${Math.round(f.speedDiffKmh)} km/h`:'wektor jednego źródła niedostępny'}\n"""
          new_render_fusion = """  function renderFusion(f){if($('opFusion'))$('opFusion').textContent=f.level;if($('opConv'))$('opConv').textContent=f.convectiveSupport;if($('opFusionSub'))$('opFusionSub').textContent=f.frameSkewMin!=null?`Δt POLRAD–OPERA ${f.frameSkewMin.toFixed(1)} min · ${finite(f.dirDiffDeg)?'kierunek '+Math.round(f.dirDiffDeg)+'°':'brak wspólnego wektora'}`:(finite(f.dirDiffDeg)?`różnica kierunku ${Math.round(f.dirDiffDeg)}° · prędkości ${Math.round(f.speedDiffKmh)} km/h`:'wektor jednego źródła niedostępny')}\n"""
          s = must_replace(s, old_render_fusion, new_render_fusion, 'OPERA fusion UI')

          old_display_hook = """      try{latest.display=await readDisplayRaster(latest,p)}catch(e){console.warn('OPERA 1 km display raster unavailable; using 4 km fallback',e)}\n      const vector=vectorStats(grids),trend=trendStats(grids),nearest=nearestEcho(latest,0,OPERATIONAL_RADIUS_KM),scoutNearest=nearestEcho(latest,OPERATIONAL_RADIUS_KM+0.01,ANALYSIS_RADIUS_KM),approach=vector?approachEcho(latest,vector,0,OPERATIONAL_RADIUS_KM,1.5):null,scoutApproach=vector?approachEcho(latest,vector,OPERATIONAL_RADIUS_KM+0.01,ANALYSIS_RADIUS_KM,3):null,predictions=vector?advect(latest,vector,trend):Object.fromEntries(HORIZONS.map(h=>[h,NaN])),conf=confidence(grids,vector);\n"""
          new_display_hook = """      try{latest.display=await readDisplayRaster(latest,p)}catch(e){console.warn('OPERA 1 km display raster unavailable; using 4 km fallback',e)}\n      operaFrameHistory=grids.slice();\n      const vector=vectorStats(grids),trend=trendStats(grids),nearest=nearestEcho(latest,0,OPERATIONAL_RADIUS_KM),scoutNearest=nearestEcho(latest,OPERATIONAL_RADIUS_KM+0.01,ANALYSIS_RADIUS_KM),approach=vector?approachEcho(latest,vector,0,OPERATIONAL_RADIUS_KM,1.5):null,scoutApproach=vector?approachEcho(latest,vector,OPERATIONAL_RADIUS_KM+0.01,ANALYSIS_RADIUS_KM,3):null,predictions=vector?advect(latest,vector,trend):Object.fromEntries(HORIZONS.map(h=>[h,NaN])),conf=confidence(grids,vector);\n"""
          s = must_replace(s, old_display_hook, new_display_hook, 'OPERA frame history')

          old_tail = """  ensureUi();window.addEventListener('prognozaepir:radar-nowcast-updated',publishFusion);for(const id of ['apply','resetPoint','refresh'])$(id)?.addEventListener('click',()=>setTimeout(()=>run(true),650));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRun>AUTO_MS)run(false)});setTimeout(()=>run(false),1200);setInterval(()=>{if(!document.hidden)run(false)},AUTO_MS);\n  window.PrognozaEPIROperaNowcastEngine={refresh:()=>run(true),get:()=>window.PrognozaEPIROperaNowcast||null,getFusion:()=>window.PrognozaEPIRRadarFusion||null,toggleMap:()=>mapButton?.click()};\n"""
          new_tail = """  ensureUi();window.addEventListener('prognozaepir:radar-nowcast-updated',publishFusion);window.addEventListener('prognozaepir:polrad-frame-changed',ev=>{lastPolradFrame=ev?.detail||null;publishOperaDisplay(lastPolradFrame)});for(const id of ['apply','resetPoint','refresh'])$(id)?.addEventListener('click',()=>setTimeout(()=>run(true),650));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRun>AUTO_MS)run(false)});setTimeout(()=>run(false),1200);setInterval(()=>{if(!document.hidden)run(false)},AUTO_MS);\n  window.PrognozaEPIROperaNowcastEngine={refresh:()=>run(true),get:()=>window.PrognozaEPIROperaNowcast||null,getFusion:()=>window.PrognozaEPIRRadarFusion||null,toggleMap:()=>mapButton?.click(),syncToPolrad:p=>publishOperaDisplay(p||window.PrognozaEPIRPolradState||null),getDisplay:()=>window.PrognozaEPIROperaDisplay||null};\n"""
          s = must_replace(s, old_tail, new_tail, 'OPERA event wiring')
          p.write_text(s,encoding='utf-8')

          # ------------------------------------------------------------------
          # opera-convection-bridge.js
          # It is the single visual owner of OPERA; use the temporally paired
          # display frame and hide OPERA when no common CMAX/CAPPI time exists.
          p = Path('opera-convection-bridge.js')
          s = p.read_text(encoding='utf-8')
          old_state = """  let fixedLayer = null;\n  let outlineLayer = null;\n  let lastOpera = null;\n  let lastRaster = null;\n"""
          new_state = """  let fixedLayer = null;\n  let outlineLayer = null;\n  let lastOpera = null;\n  let lastDisplay = null;\n  let lastRaster = null;\n"""
          s = must_replace(s, old_state, new_state, 'OPERA bridge display state')
          s = must_replace(s, '  function renderMap(opera = lastOpera) {\n', '  function renderMap(opera = lastDisplay || lastOpera) {\n', 'OPERA bridge render source')

          sync_guard_anchor = """    const enabled = button.classList.contains('active');\n    if (!enabled) {\n      clearFixed(m);\n      publishState(button,{enabled:false,rendered:false,visiblePixels:0,significantPixels:0,frameUtc:'',palette:'POLRAD CMAX'});\n      return;\n    }\n    if (!opera || opera.error || !opera.latest) {\n"""
          sync_guard_new = """    const enabled = button.classList.contains('active');\n    if (!enabled) {\n      clearFixed(m);\n      publishState(button,{enabled:false,rendered:false,visiblePixels:0,significantPixels:0,frameUtc:'',palette:'POLRAD CMAX'});\n      return;\n    }\n    if (opera?.sync?.comparable && !opera.sync.synchronized) {\n      clearFixed(m);\n      const skew=Number(opera.sync.skewMin);\n      button.title=Number.isFinite(skew)?`OPERA ukryta: najbliższa klatka różni się od POLRAD o ${skew.toFixed(1)} min`:'OPERA ukryta: brak klatki o wspólnym czasie z POLRAD';\n      publishState(button,{enabled:true,rendered:false,visiblePixels:0,significantPixels:0,frameUtc:'',palette:'POLRAD CMAX',synchronized:false,frameSkewMin:Number.isFinite(skew)?skew:null});\n      return;\n    }\n    if (!opera || opera.error || !opera.latest) {\n"""
          s = must_replace(s, sync_guard_anchor, sync_guard_new, 'OPERA bridge sync guard')

          old_title = """    const frameUtc = fmtUtc(opera.frameEnd || opera.latest.time);\n    const rendered = !!fixedLayer || !!outlineLayer;\n    button.title = raster.visible > 0\n      ? `OPERA Europa CMAX · ${raster.pixelKm} km/piksel · ${frameUtc} · filtr mapy ≥${VISUAL_MIN_DBZ} dBZ · dotknij mapy, aby odczytać dBZ`\n      : `OPERA Europa CMAX · ${raster.pixelKm} km/piksel · ${frameUtc} · filtr mapy ≥${VISUAL_MIN_DBZ} dBZ · dotknij mapy, aby sprawdzić punkt`;\n"""
          new_title = """    const frameUtc = fmtUtc(opera.frameEnd || opera.latest.time);\n    const rendered = !!fixedLayer || !!outlineLayer;\n    const syncText=opera?.sync?.synchronized?` · zsynchronizowana z ${String(opera.sync.product||'POLRAD').toUpperCase()} (Δt ${Number(opera.sync.skewMin||0).toFixed(1)} min)`:'';\n    button.title = raster.visible > 0\n      ? `OPERA Europa CMAX · ${raster.pixelKm} km/piksel · ${frameUtc}${syncText} · filtr mapy ≥${VISUAL_MIN_DBZ} dBZ · dotknij mapy, aby odczytać dBZ`\n      : `OPERA Europa CMAX · ${raster.pixelKm} km/piksel · ${frameUtc}${syncText} · filtr mapy ≥${VISUAL_MIN_DBZ} dBZ · dotknij mapy, aby sprawdzić punkt`;\n"""
          s = must_replace(s, old_title, new_title, 'OPERA bridge sync title')

          old_state_publish = """      visualThresholdDbz:VISUAL_MIN_DBZ,\n      role:'secondary_europe_control',\n      primaryOverPoland:'POLRAD'\n"""
          new_state_publish = """      visualThresholdDbz:VISUAL_MIN_DBZ,\n      role:'secondary_europe_control',\n      primaryOverPoland:'POLRAD',\n      synchronized:!!opera?.sync?.synchronized,\n      frameSkewMin:Number.isFinite(Number(opera?.sync?.skewMin))?Number(opera.sync.skewMin):null,\n      polradProduct:opera?.sync?.product||null\n"""
          s = must_replace(s, old_state_publish, new_state_publish, 'OPERA bridge state metadata')

          old_handlers = """  function onOpera(ev) {\n    lastOpera = ev?.detail || window.PrognozaEPIROperaNowcast || null;\n    bindButton();\n    const button = $('operaCmaxToggle');\n    if (!button) return;\n    // Secondary layer: never auto-enable it over POLRAD. Render only when the user explicitly activates it.\n    renderMap(lastOpera);\n  }\n\n  bindButton();\n  if (window.PrognozaEPIROperaNowcast) onOpera({detail:window.PrognozaEPIROperaNowcast});\n  window.addEventListener('prognozaepir:opera-nowcast-updated',onOpera);\n  setTimeout(bindButton,500);\n  setTimeout(() => renderMap(window.PrognozaEPIROperaNowcast || lastOpera),3000);\n\n  window.PrognozaEPIROperaMapLayer = {\n    refresh:() => renderMap(window.PrognozaEPIROperaNowcast || lastOpera),\n    get:() => window.PrognozaEPIROperaMapState || null,\n    samplePoint:(lat,lon)=>lastRaster&&lastBounds?sampleRaster({lat:Number(lat),lng:Number(lon)},lastRaster,lastBounds):NaN\n  };\n"""
          new_handlers = """  function onOpera(ev) {\n    lastOpera = ev?.detail || window.PrognozaEPIROperaNowcast || null;\n    bindButton();\n    if(window.PrognozaEPIRPolradState&&window.PrognozaEPIROperaNowcastEngine?.syncToPolrad){\n      window.PrognozaEPIROperaNowcastEngine.syncToPolrad(window.PrognozaEPIRPolradState);\n      return;\n    }\n    if(!lastDisplay)lastDisplay=lastOpera;\n    renderMap(lastDisplay||lastOpera);\n  }\n\n  function onOperaDisplay(ev){\n    lastDisplay=ev?.detail||window.PrognozaEPIROperaDisplay||null;\n    bindButton();\n    renderMap(lastDisplay);\n  }\n\n  bindButton();\n  if (window.PrognozaEPIROperaDisplay) onOperaDisplay({detail:window.PrognozaEPIROperaDisplay});\n  else if (window.PrognozaEPIROperaNowcast) onOpera({detail:window.PrognozaEPIROperaNowcast});\n  window.addEventListener('prognozaepir:opera-nowcast-updated',onOpera);\n  window.addEventListener('prognozaepir:opera-display-updated',onOperaDisplay);\n  setTimeout(bindButton,500);\n  setTimeout(() => renderMap(window.PrognozaEPIROperaDisplay || lastDisplay || window.PrognozaEPIROperaNowcast || lastOpera),3000);\n\n  window.PrognozaEPIROperaMapLayer = {\n    refresh:() => renderMap(window.PrognozaEPIROperaDisplay || lastDisplay || window.PrognozaEPIROperaNowcast || lastOpera),\n    get:() => window.PrognozaEPIROperaMapState || null,\n    samplePoint:(lat,lon)=>lastRaster&&lastBounds?sampleRaster({lat:Number(lat),lng:Number(lon)},lastRaster,lastBounds):NaN\n  };\n"""
          s = must_replace(s, old_handlers, new_handlers, 'OPERA bridge handlers')
          p.write_text(s,encoding='utf-8')

          # ------------------------------------------------------------------
          # radar.html - wire the maintained modules into the actual Pages page.
          # The inline POLRAD nowcast remains the analysis source; the external
          # intelligence module owns the official map animation.
          p = Path('radar.html')
          s = p.read_text(encoding='utf-8')
          tags = """<script src=\"radar-intelligence.js?v=20260914-radar-sync-v2\"></script>\n<script src=\"opera-nowcast.js?v=20260914-radar-sync-v2\"></script>\n<script src=\"opera-convection-bridge.js?v=20260914-radar-sync-v2\"></script>\n"""
          if 'radar-intelligence.js?v=20260914-radar-sync-v2' not in s:
              if '</body>' not in s: raise SystemExit('radar.html has no body end')
              s = s.replace('</body>', tags + '</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate patched radar runtime
        run: |
          node --check radar-intelligence.js
          node --check opera-nowcast.js
          node --check opera-convection-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          r=Path('radar.html').read_text(encoding='utf-8')
          for token in ['radar-intelligence.js?v=20260914-radar-sync-v2','opera-nowcast.js?v=20260914-radar-sync-v2','opera-convection-bridge.js?v=20260914-radar-sync-v2']:
              assert token in r, token
          ri=Path('radar-intelligence.js').read_text(encoding='utf-8')
          for token in ["cmax:","cappi:","eht:","sri:","pac:","hail:","prognozaepir:polrad-frame-changed","polradImagePane"]:
              assert token in ri, token
          op=Path('opera-nowcast.js').read_text(encoding='utf-8')
          for token in ['SYNC_TOLERANCE_MIN','opera-display-updated','frameSkewMin','syncToPolrad']:
              assert token in op, token
          print('radar patch validation OK')
          PY

      - name: Commit patch and remove one-shot workflow
        run: |
          rm -f .github/workflows/patch-radar-polrad-opera-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.html radar-intelligence.js opera-nowcast.js opera-convection-bridge.js .github/workflows/patch-radar-polrad-opera-sync.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix POLRAD animation and synchronize OPERA frames'
          git push origin main
