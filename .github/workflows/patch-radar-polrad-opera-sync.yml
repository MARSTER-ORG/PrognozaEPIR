name: Patch POLRAD OPERA synchronization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-radar-polrad-opera-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply radar patch
        run: python3 scripts/patch-radar-polrad-opera-sync.py

      - name: Validate JavaScript and wiring
        run: |
          node --check radar-intelligence.js
          node --check opera-nowcast.js
          python3 - <<'PY'
          from pathlib import Path
          radar = Path('radar.html').read_text(encoding='utf-8')
          intel = Path('radar-intelligence.js').read_text(encoding='utf-8')
          opera = Path('opera-nowcast.js').read_text(encoding='utf-8')
          assert 'radar-intelligence.js?v=20260914-radar-sync-v3' in radar
          assert 'opera-nowcast.js?v=20260914-radar-sync-v3' in radar
          for token in ['cmax:', 'cappi:', 'eht:', 'sri:', 'pac:', 'hail:', 'polradImagePane', 'prognozaepir:polrad-frame-changed']:
              assert token in intel, token
          for token in ['SYNC_TOLERANCE_MIN', 'renderSynchronizedMap', 'frameSkewMin', 'prognozaepir:polrad-frame-changed']:
              assert token in opera, token
          print('radar synchronization validation OK')
          PY

      - name: Commit final radar fix
        run: |
          rm -f .github/workflows/patch-radar-polrad-opera-sync.yml
          rm -f scripts/patch-radar-polrad-opera-sync.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar.html radar-intelligence.js opera-nowcast.js .github/workflows/patch-radar-polrad-opera-sync.yml scripts/patch-radar-polrad-opera-sync.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix POLRAD animation and synchronize OPERA frames'
          git push origin main
