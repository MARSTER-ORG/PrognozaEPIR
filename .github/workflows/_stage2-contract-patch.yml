name: Stage 2 station and unit patch

on:
  push:
    branches: [fix/audit-stage2-contracts]
    paths:
      - scripts/_stage2_contract_patch.py
      - .github/workflows/_stage2-contract-patch.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply patch
        run: python scripts/_stage2_contract_patch.py
      - name: Validate metadata and units
        run: |
          python tests/test_station_unit_contracts.py
          python -m py_compile scripts/station_metadata.py scripts/meteo_units.py scripts/collect_epir_observations.py scripts/message_archive.py scripts/neighbor_observations.py
          node --check meteo-units.js
          node --check message-archive-client.js
          node --check visual-style-fix.js
          node --check aviation-hazards.js
          node --check warnings-readable.js
      - name: Existing core regressions
        run: |
          python tests/test_stage2_stability_contracts.py
          python scripts/check_archive_boundaries.py
          node tests/taf-engine-v2.test.js
          node tests/taf-engine-v243.test.js
          node tests/runtime-integration-contract.test.js
      - name: Canonical Pages build
        run: |
          python scripts/prepare_pages_v241.py
          python scripts/wire_fog_mifg_utc_runtime.py
          python scripts/enforce_global_utc.py --check
      - name: Commit clean patch
        run: |
          rm -f scripts/_stage2_contract_patch.py
          rm -f .github/workflows/_stage2-contract-discovery.yml .github/workflows/_stage2-contract-patch.yml
          rm -rf _site scripts/__pycache__ tests/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(stage2): centralize station and unit contracts"
          git push origin HEAD:fix/audit-stage2-contracts
