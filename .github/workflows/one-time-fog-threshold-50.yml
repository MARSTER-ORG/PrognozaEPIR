name: One-time fog threshold 50
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fog-threshold-50.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch operational fog thresholds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              orig=s
              for old,new in replacements:
                  s=s.replace(old,new)
              if s!=orig:
                  p.write_text(s,encoding='utf-8')
                  print(path,'patched')
              else:
                  print(path,'already current')

          # FG: 50/100 is the operational threshold. Physics weights such as .40 stay untouched.
          patch('fog-engine.js',[
              ("if(s<40)return 'NIE';","if(s<50)return 'NIE';"),
              ("if(!finite(s)||s<40)return '';","if(!finite(s)||s<50)return '';"),
              ('&lt;40 = MGŁA: NIE (wynik pomijany) · 40–59 = MOŻLIWA','&lt;50 = MGŁA: NIE (wynik pomijany) · 50–59 = MOŻLIWA'),
              ('x.score>=40','x.score>=50'),
              ('series[last+1].score>=40','series[last+1].score>=50'),
              ('peak.score>=40','peak.score>=50'),
              ('Math.max(40,.85*peak.score)','Math.max(50,.85*peak.score)'),
              ("current.score>=40?fmt0(current.score)+'/100':'wynik <40/100 pominięty'","current.score>=50?fmt0(current.score)+'/100':'wynik <50/100 pominięty'"),
              ("'brak sygnału ≥40 w 48 h'","'brak sygnału ≥50 w 48 h'"),
              ("'próg operacyjny 40/100'","'próg operacyjny 50/100'"),
              ("'&lt;40 · pominięte'","'&lt;50 · pominięte'"),
          ])

          # Hour information on the meteogram: the same 50/100 threshold for FG, MIFG and BR.
          patch('fog-meteogram-overlay.js',[
              ('const FOG_INFO_THRESHOLD = 40;','const FOG_INFO_THRESHOLD = 50;'),
              ('const MIFG_INFO_THRESHOLD = 40;','const MIFG_INFO_THRESHOLD = 50;'),
              ('const BR_INFO_THRESHOLD = 40;','const BR_INFO_THRESHOLD = 50;'),
              ('w informacji godziny FOG, MIFG i BR są pokazywane od 40/100.','w informacji godziny FOG, MIFG i BR są pokazywane od 50/100.'),
          ])

          # MIFG: keep the same operational policy in its standalone card.
          patch('mifg-engine.js',[
              ("if(s>=40)return 'umiarkowane';","if(s>=50)return 'umiarkowane';"),
              ("s>=40?'fog-risk-mid'","s>=50?'fog-risk-mid'"),
              ("if(score<40)return 'NIE';","if(score<50)return 'NIE';"),
              ("current.score>=40?'fog-risk-mid'","current.score>=50?'fog-risk-mid'"),
              ('current.score>=40','current.score>=50'),
              ("'wynik <40/100 pominięty'","'wynik <50/100 pominięty'"),
              ('peak.score>=40','peak.score>=50'),
              ("' · brak sygnału ≥40 w 12 h'","' · brak sygnału ≥50 w 12 h'"),
          ])

          # BR uses the shared event logic in the structured summary.
          patch('fog-summary-layout.js',[
              ('const THRESHOLD = 40;','const THRESHOLD = 50;'),
              ('score < 40','score < 50'),
              ('wynik <40/100 pominięty','wynik <50/100 pominięty'),
              ('≥40/100','≥50/100'),
              ('≥40 w 48 h','≥50 w 48 h'),
              ('próg operacyjny 40/100','próg operacyjny 50/100'),
              ('&lt;40 = NIE (wynik pomijany) · 40–59 = MOŻLIWE','&lt;50 = NIE (wynik pomijany) · 50–59 = MOŻLIWE'),
          ])
          PY
      - name: Commit threshold policy
        shell: bash
        run: |
          git config user.name 'PrognozaEPIR bot'
          git config user.email 'actions@users.noreply.github.com'
          git add fog-engine.js fog-meteogram-overlay.js mifg-engine.js fog-summary-layout.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fog: use 50 as operational threshold for FG BR MIFG [skip ci]'
          git push
